<script id="course-data" type="application/json">{"id":"genetics","title":"גנטיקה כללית ומולקולרית","source":"סיכום גנטיקה כללית ומולקולרית — אמיר (82 עמ', 25 שיעורים)","units":[{"id":"01-intro","title":"מבוא: גן, DNA וכרומוזומים","lectures":"1–2","pages":"1–3","lessons":[{"id":"intro-01","title":"איפה בכלל יושבות התכונות","estMinutes":9,"source":"שיעור 1, עמ' 1–2","cards":[{"id":"i1-hook","type":"hook","text":"יש לך את האף של אבא שלך.","sub":"לא משהו דומה — בדיוק אותו אף. איך הוא עבר לשם?"},{"id":"i1-concept-genetics","type":"concept","term":"מה גנטיקה חוקרת","text":"**גנטיקה היא המדע שחוקר איך תכונות עוברות מהורים לצאצאים.**\n\nזה הכל. השאלה \"למה הילד דומה להורה\" היא השאלה של כל הקורס, וכל השאר זה מנגנון.","note":"שמו לב לזה הרבה לפני שהבינו איך זה עובד — ובייתו חיטה וכלבים על סמך ההבחנה הזו בלבד."},{"id":"i1-anchor-zoom","type":"anchor","text":"בוא נתקרב פנימה, שכבה אחרי שכבה, עד שנגיע לאף.\n\nכל שלב כאן נמצא **בתוך** השלב שלפניו:","work":["**הגוף** מורכב ממערכות (עיכול, נשימה…)","**מערכת** מורכבת מאיברים","**איבר** מורכב מרקמות","**רקמה** מורכבת מתאים","**בתא** יש גרעין","**בגרעין** יש כרומוזומים","**בכרומוזום** יש אלפי גנים"],"reveal":{"q":"אז איפה בדיוק \"כתוב\" האף?","a":"בגנים. בסוף השרשרת."},"alt":[{"title":"אותו דבר, בכיוון ההפוך","text":"**גן** הוא הוראה בודדת.\nאלפי הוראות ארוזות ב**כרומוזום**.\nהכרומוזומים יושבים ב**גרעין**, בתוך ה**תא**.\nמיליוני תאים דומים מרכיבים **רקמה**, רקמות מרכיבות **איבר**, ואיברים מרכיבים אותך.\n\nאותה סולם, מלמטה למעלה."}]},{"id":"i1-concept-gene","type":"concept","term":"גן, DNA, גנום","text":"שלושת המונחים האלה מבלבלים כי הם מדברים על אותו חומר בשלוש רמות של זום.","rows":[["DNA","החומר עצמו — המולקולה הארוכה שהכל כתוב עליה"],["גן","**קטע** מתוך ה-DNA שאחראי על תפקוד מסוים"],["גנום","**כל** החומר הגנטי של יצור, הכל ביחד"]],"note":"כלומר: הגן הוא היחידה הבסיסית של ההורשה, והגנום הוא הספרייה השלמה."},{"id":"i1-mcq-hierarchy","type":"mcq","q":"מה נמצא בתוך מה?","options":["גן בתוך כרומוזום, כרומוזום בתוך גרעין, גרעין בתוך תא","תא בתוך גן, גן בתוך כרומוזום","כרומוזום בתוך גן, גן בתוך גרעין","כולם נמצאים זה לצד זה בתוך התא"],"correct":0,"why":["נכון. מהקטן לגדול: **גן → כרומוזום → גרעין → תא**.","הפוך. התא הוא הגדול מכולם כאן, לא הקטן.","הפוך. הכרומוזום מכיל אלפי גנים, לא להפך.","לא. זו שרשרת של הכלה — כל אחד ממש בתוך השני."]},{"id":"i1-concept-diploid","type":"concept","term":"למה הכל מגיע בזוגות","text":"לבני אדם יש **23 זוגות כרומוזומים** — 46 בסך הכל.\n\nזוגות, כי **מכל כרומוזום יש שני עותקים: אחד מאמא, אחד מאבא.** שני העותקים האלה נקראים **כרומוזומים הומולוגיים**.","rows":[["דיפלואידי","שני עותקים מכל כרומוזום. אנחנו, וכמעט כל מה שמוכר לך"],["הפלואידי","עותק אחד בלבד. יצורים פשוטים כמו וירוסים"]],"note":"כי מכל כרומוזום יש שני עותקים, יש גם **שני עותקים של כל גן**. תחזיק את זה — זה הבסיס לכל הקורס.","alt":[{"title":"למה זה משנה בכלל","text":"כי זה אומר שלכל הוראה בגוף שלך יש **גיבוי**.\n\nאם עותק אחד פגום, השני מכסה ואתה בריא לגמרי — בלי לדעת שיש לך עותק פגום.\n\nכמעט כל הגנטיקה הרפואית יושבת על המשפט הזה."}]},{"id":"i1-pitfall-count","type":"pitfall","text":"**מספר הכרומוזומים לא מעיד על מורכבות היצור.**\n\nזה מפתה לחשוב שיותר כרומוזומים = יצור מפותח יותר. זה פשוט לא נכון — יש צמחים עם הרבה יותר כרומוזומים מאיתנו.","punch":"מה שכן גדל עם המורכבות זו כמות הגנים, לא מספר החבילות שהם ארוזים בהן."},{"id":"i1-mcq-count","type":"mcq","q":"לאדם יש 23 זוגות כרומוזומים. כמה כרומוזומים יש בתא רגיל בגוף?","options":["23","46","92","תלוי באיזה תא"],"correct":1,"why":["23 זה מספר ה**זוגות**, לא הכרומוזומים.","נכון. 23 זוגות כפול 2 = **46**. אחד מכל זוג מאמא, אחד מאבא.","92 יהיה אם כל הורה היה תורם 46 — וזה בדיוק מה שהגוף מונע. הכרטיסייה הבאה מסבירה איך.","לא. כל התאים הרגילים בגוף נושאים את אותם 46. היוצא מן הכלל הוא תאי המין."]},{"id":"i1-concept-gametes","type":"concept","term":"למה תאי המין הם חצי","text":"אם אמא הייתה תורמת 46 ואבא 46, לילד היו 92. לנכד 184. תוך כמה דורות זה מתפוצץ.\n\nלכן **תאי המין נושאים רק חצי** — 23 כרומוזומים, אחד מכל זוג. תא כזה נקרא **גמטה** (זרע או ביצית).","note":"התהליך שמחלק את הכרומוזומים לחצי נקרא **מיוזה**. נלמד אותו לעומק ביחידה 8 — כרגע מספיק לדעת שזה מה שהוא עושה.","alt":[{"title":"החשבון בשורה אחת","text":"23 מאמא + 23 מאבא = **46**. בדיוק כמו שצריך.\n\nכל הורה תורם בדיוק אחד מכל זוג, ולכן הילד מקבל זוג שלם — עותק אחד מכל צד. המספר נשאר יציב לנצח."}]},{"id":"i1-mcq-gametes","type":"mcq","q":"כמה כרומוזומים יש בביצית אנושית?","options":["46, כמו בכל תא","23","92","אחד"],"correct":1,"why":["לא. אם לביצית היו 46, הילד היה מקבל 92.","נכון. הביצית היא **גמטה** — היא נושאת 23, אחד מכל זוג. הזרע נושא 23 נוספים.","לא. 92 זה בדיוק מה שהמערכת נועדה למנוע.","לא. אחד מכל **זוג**, כלומר 23 בסך הכל."]},{"id":"i1-mcq-transfer","type":"mcq","level":2,"q":"לחתול יש 19 **זוגות** כרומוזומים. כמה כרומוזומים יש בזרע של חתול?","options":["19","38","76","אי אפשר לדעת בלי לדעת את המין"],"correct":0,"why":["נכון. הזרע הוא גמטה — הוא נושא **אחד מכל זוג**, כלומר 19.","38 זה מה שיש בתא רגיל בגוף החתול (19 כפול 2), לא בגמטה.","76 זה כפול מהתא הרגיל — זה לא קורה באף שלב.","המין לא משנה כאן. כל גמטה, זרע או ביצית, נושאת אחד מכל זוג."]},{"id":"i1-recap","type":"recap","points":["התכונות יושבות ב**גנים**, שנמצאים על **כרומוזומים**, שנמצאים ב**גרעין** של כל תא.","אנחנו **דיפלואידיים**: 23 זוגות כרומוזומים, כלומר **שני עותקים של כל גן** — אחד מאמא, אחד מאבא.","**גמטות** (זרע וביצית) נושאות רק חצי — 23 — כדי שהילד יקבל בדיוק 46 ולא כפול."],"next":"בשיעור הבא: אם יש שני עותקים של כל גן, מה קורה כשהם **לא זהים**? שם נכנסים המונחים אלל, גנוטיפ ופנוטיפ."}]},{"id":"intro-02","title":"אלל, גנוטיפ ופנוטיפ","estMinutes":10,"source":"שיעור 1–2, עמ' 2–3","cards":[{"id":"i2-hook","type":"hook","text":"שני אחים, אותם הורים בדיוק.","sub":"לאחד עיניים חומות ולשני כחולות. אף אחד לא אומץ. אז מאיפה השוני?"},{"id":"i2-concept-allele","type":"concept","term":"אלל","text":"לגן אחד יכולות להיות **כמה גרסאות שונות**. כל גרסה כזו נקראת **אלל**.\n\nהגן לצבע שיער הוא גן אחד — אבל יש לו גרסה לשחור, גרסה לחום, גרסה לבלונדיני. אלו אללים שונים של אותו גן.","note":"לכן ההגדרה: **אלל = צורה מסוימת של גן, מתוך כמה צורות אפשריות.**","alt":[{"title":"ההבדל בין גן לאלל, בשורה","text":"**הגן** הוא השאלה: \"מה צבע השיער?\"\n**האלל** הוא התשובה: שחור. או חום. או בלונדיני.\n\nלכולנו יש את אותו גן לצבע שיער. מה שמבדיל בינינו זה איזה אללים קיבלנו."}]},{"id":"i2-concept-locus","type":"concept","term":"לוקוס","text":"לכל גן יש **מקום קבוע** על כרומוזום מסוים — תמיד אותו מקום, אצל כל בני האדם.\n\nהמקום הזה נקרא **לוקוס**.","note":"לכן אפשר לומר משפט כמו \"הגן לצבע השיער נמצא בכרומוזום 6, במיקום כזה וכזה\". בזכות זה בכלל אפשר לחפש גן ולבדוק אותו."},{"id":"i2-mcq-allele","type":"mcq","q":"\"שיער שחור\" ו\"שיער בלונדיני\" הם:","options":["שני גנים שונים","שני אללים — שתי גרסאות של אותו גן","שני לוקוסים שונים","גן ומוטציה שלו"],"correct":1,"why":["לא. זה גן אחד — הגן לצבע השיער.","נכון. אותו גן, אותו לוקוס, **שתי גרסאות שונות** שלו.","לא. הלוקוס הוא המיקום, והוא זהה לשניהם — שם בדיוק יושב הגן הזה.","לא בהכרח. שתי הגרסאות יכולות להיות נפוצות ותקינות לגמרי, בלי שאף אחת מהן היא \"תקלה\"."]},{"id":"i2-concept-zygosity","type":"concept","term":"הומוזיגוט והטרוזיגוט","text":"ראינו שאתה דיפלואידי — **שני עותקים של כל גן**. לכן יש לך תמיד **שני אללים** לכל תכונה.\n\nמסמנים אותם באות לועזית, ויש בדיוק שלוש אפשרויות:","rows":[["AA","**הומוזיגוט** — שני האללים זהים"],["aa","**הומוזיגוט** — גם כאן זהים, פשוט אלל אחר"],["Aa","**הטרוזיגוט** — שני האללים שונים"]],"note":"הומו = זהה. הטרו = שונה. אותו אדם יהיה הומוזיגוט בתכונה אחת והטרוזיגוט באחרת — זה נאמר תמיד **ביחס לתכונה מסוימת**, לא על האדם כולו.","alt":[{"title":"איך לא לשכוח מה זה מה","text":"**הומו**גני = אחיד, אותו דבר.\n**הטרו**גני = מגוון, שונה.\n\nהתחיליות האלה מתנהגות אותו דבר בכל מילה בעברית.\n\nAA ו-aa הומוזיגוטים כי שני האללים זהים. Aa הטרוזיגוט כי הם שונים. זה כל ההבדל."}]},{"id":"i2-mcq-zygosity","type":"mcq","q":"אדם עם הגנוטיפ aa הוא:","options":["הטרוזיגוט, כי שני האללים קטנים","הומוזיגוט, כי שני האללים זהים","לא הומוזיגוט ולא הטרוזיגוט","תלוי אם האלל תקין או פגום"],"correct":1,"why":["לא. גודל האות לא קובע — רק אם השניים **זהים** או לא.","נכון. aa הומוזיגוט בדיוק כמו AA. שניהם זהים, וזה כל מה שהמילה אומרת.","לא. תמיד יש שני אללים, ולכן תמיד אחד מהשניים.","לא. המילה מתארת רק אם השניים זהים — לא אם הם תקינים."]},{"id":"i2-concept-geno-pheno","type":"concept","term":"גנוטיפ ופנוטיפ","text":"**גנוטיפ** = אילו אללים יש לך. מה שכתוב.\n**פנוטיפ** = מה שרואים בפועל.\n\nהם לא אותו דבר, ושני אנשים עם פנוטיפ זהה יכולים להיות בעלי גנוטיפ שונה.","rows":[["גנוטיפ","Aa"],["פנוטיפ","עיניים חומות"]],"note":"וגם הסביבה משפיעה על הפנוטיפ, לא רק הגנים — אותו אדם יהיה כהה יותר אחרי קיץ בחוץ מאשר אחרי חורף בבית.","alt":[{"title":"בשפה של מרפאה","text":"**גנוטיפ** הוא מה שכתוב בתיק. **פנוטיפ** הוא מה שאתה רואה כשהמטופל נכנס לחדר.\n\nשני אנשים שנראים זהים לגמרי יכולים להיות שונים לחלוטין בתיק — וההבדל הזה לא משנה כלום עבורם, אבל משנה הכל עבור הילדים שלהם."}]},{"id":"i2-mcq-geno-pheno","type":"mcq","q":"לשני אנשים יש עיניים חומות. מה בהכרח נכון?","options":["יש להם אותו גנוטיפ","יש להם אותו פנוטיפ, אבל הגנוטיפ יכול להיות שונה","שניהם הומוזיגוטים","שניהם הטרוזיגוטים"],"correct":1,"why":["לא. זה בדיוק הפער — אותו מראה לא מבטיח אותם אללים.","נכון. **פנוטיפ זהה, גנוטיפ אפשרי שונה.** אחד יכול להיות AA והשני Aa, ושניהם ייראו זהים.","לא ידוע. אחד מהם יכול להיות הטרוזיגוט ועדיין להיראות אותו דבר.","לא ידוע, ומאותה סיבה."]},{"id":"i2-answer-hook","type":"example","text":"עכשיו אפשר לענות על השאלה שפתחנו איתה.\n\nלכל הורה יש **שני** אללים, והוא מעביר לכל ילד רק **אחד** מהם — בהגרלה.","work":["האח הראשון קיבל צירוף אחד של אללים","האח השני קיבל צירוף אחר","אותם הורים, הגרלה נפרדת לכל ילד"],"note":"זו התשובה לשאלה למה אחים דומים אבל לא זהים: הם שואבים מאותו מאגר, אבל כל אחד מקבל דגימה משלו."},{"id":"i2-concept-mutation","type":"concept","term":"מוטציה וזן בר","text":"ה-DNA ארוך ומורכב, ובזמן ההעתקה שלו קורות טעויות. שינוי כזה ברצף נקרא **מוטציה**.\n\nלעומתה, **זן בר** (wild type) הוא המצב הרגיל והנפוץ באוכלוסייה — זה שהיה שם לפני השינוי.","note":"מוטציה היא לא בהכרח דבר רע. חלקן גורמות למחלות קשות, אבל מוטציות הן גם המקור לכל השונות בטבע ולאבולוציה עצמה.","alt":[{"title":"למה \"טעות\" זה לא בהכרח \"נזק\"","text":"שינוי במתכון יכול להרוס את המנה, ויכול לצאת טעים יותר.\n\nמוטציה שמחליפה צבע שיער לא פוגעת באיש. מוטציה שפוגעת בחלבון חיוני — כן.\n\nאותו סוג אירוע בדיוק, תוצאות שונות לגמרי."}]},{"id":"i2-mcq-five-alleles","type":"mcq","level":2,"q":"לגן מסוים קיימים באוכלוסייה **5 אללים שונים**. כמה מהם יכולים להיות אצל אדם אחד?","options":["5","2","1","תלוי בגן"],"correct":1,"why":["כאן נופלים. 5 זה מה שקיים **באוכלוסייה** — לא אצל אדם יחיד.","נכון. אתה דיפלואידי, ולכן יש לך בדיוק **שני אללים** לכל גן — אחד מאמא, אחד מאבא. גם אם באוכלוסייה קיימות 50 גרסאות.","לא. אחד היה נכון ליצור הפלואידי, לא לנו.","לא תלוי. כל גן אוטוזומלי אצל אדם — תמיד שניים."]},{"id":"i2-mcq-environment","type":"mcq","level":3,"q":"אחרי קיץ בחוץ, העור של אדם כהה משמעותית מכפי שהיה בחורף. מה השתנה?","options":["הגנוטיפ שלו השתנה","הפנוטיפ השתנה, הגנוטיפ נשאר זהה","שניהם השתנו","אף אחד — זה לא קשור לגנטיקה"],"correct":1,"why":["לא. הגנוטיפ הוא האללים עצמם, והם לא משתנים מחשיפה לשמש.","נכון. **הפנוטיפ הוא מה שרואים, והוא מושפע גם מהסביבה** — לא רק מהגנים. אותם אללים בדיוק, מראה אחר.","לא. הגנוטיפ יציב. רק הביטוי שלו השתנה.","דווקא כן. הפנוטיפ הוא מושג גנטי, והנקודה כאן היא שהוא לא נקבע על ידי הגנים לבדם."]},{"id":"i2-recap","type":"recap","points":["**אלל** = גרסה של גן. ל**לוקוס** אחד (מיקום קבוע) יכולות להיות כמה גרסאות.","יש לך שני אללים לכל תכונה: זהים = **הומוזיגוט** (AA או aa), שונים = **הטרוזיגוט** (Aa).","**גנוטיפ** הוא מה שכתוב, **פנוטיפ** מה שרואים. פנוטיפ זהה לא מעיד על גנוטיפ זהה."],"next":"עכשיו יש לך את כל השפה. ביחידה הבאה נראה מה קורה כששני האללים שונים — מי מהם מנצח, ולמה שני הורים בריאים יכולים להביא ילד חולה."}]}],"plan":2},{"id":"02-mendel","title":"הורשה מנדלית וריבוע פאנט","lectures":"2–3","pages":"3–8","lessons":[{"id":"mendel-01","title":"שני עותקים, ומה שקורה כששניהם פגומים","estMinutes":12,"source":"שיעור 2–3, עמ' 3–5","cards":[{"id":"m1-hook","type":"hook","text":"לשני הורים בריאים לגמרי נולד ילד עם מחלה גנטית.","sub":"אף אחד לא בגד, ולאף אחד במשפחה אין את המחלה. אז מאיפה היא הגיעה?"},{"id":"m1-anchor","type":"anchor","text":"מכל הוראה בגוף שלך יש **שני עותקים** — אחד מאמא, אחד מאבא.\n\nאם עותק אחד פגום, השני מכסה עליו והכל עובד כרגיל. אתה בכלל לא יודע שיש לך עותק פגום.","reveal":{"q":"כמה עותקים תקינים צריך כדי שהכל יעבוד?","a":"אחד מספיק. וזה כל הרעיון."},"alt":[{"title":"אותו דבר, בשפה של סידור משמרות","text":"לכל תפקיד בגוף יש **שני עובדים רשומים** — אחד מאמא, אחד מאבא.\n\nאם אחד לא מגיע, השני מכסה והמשמרת עוברת בשלום. אף אחד לא שם לב שחסר מישהו.\n\nהבעיה מתחילה רק כששניהם לא הגיעו."},{"title":"ואם גם זה לא מתיישב","text":"יש לך שני עותקים של אותו מסמך חשוב. אחד מהם פגום ולא נפתח.\n\nאתה פותח את השני, הכל תקין, ובחיים לא תדע שהראשון פגום.\n\nעד שתעביר הלאה דווקא אותו."}]},{"id":"m1-concept-alleles","type":"concept","term":"אלל","text":"כל אחד משני העותקים נקרא **אלל**. מסמנים אותם באות לועזית: אות גדולה לעותק התקין, אות קטנה לפגום.","rows":[["AA","שני עותקים תקינים — בריא"],["Aa","עותק אחד תקין מכסה — **בריא, אבל נשא**"],["aa","אין מי שיכסה — חולה"]],"note":"העותק התקין נקרא **דומיננטי**, הפגום נקרא **רצסיבי**. בחירת האות שרירותית — רק שיהיה הבדל ברור בין הגדולה לקטנה.","alt":[{"title":"מה בעצם האותיות אומרות","text":"A ו-a הם **אותו גן, באותו מיקום** — שתי גרסאות שלו.\n\nכמו שני עותקים של אותו טופס: אחד מלא נכון, אחד עם שדה חסר. זה אותו טופס, לא שני מסמכים שונים.\n\nלכן תמיד כותבים שתי אותיות — הן שתי הגרסאות שיש לך ביד."}]},{"id":"m1-concept-zygosity","type":"concept","term":"הומוזיגוט והטרוזיגוט","text":"לשלושת המצבים שראית יש שמות רשמיים, ותפגוש אותם בכל שאלה בקורס.\n\nהם אומרים דבר אחד בלבד: **האם שני האללים זהים או שונים.**","rows":[["AA","**הומוזיגוט** — שני האללים זהים"],["aa","**הומוזיגוט** — גם כאן זהים, פשוט שניהם פגומים"],["Aa","**הטרוזיגוט** — שני האללים שונים. זה הנשא"]],"note":"הומו = זהה. הטרו = שונה. שים לב ש-**aa הוא הומוזיגוט בדיוק כמו AA** — המילה לא מספרת אם האלל תקין או פגום, רק שהשניים זהים.","alt":[{"title":"איך לא לשכוח מה זה מה","text":"**הומו**גני = אחיד, אותו דבר.\n**הטרו**גני = מגוון, שונה.\n\nהתחיליות האלה מתנהגות אותו דבר בכל מילה בעברית.\n\nזה כל ההבדל. AA ו-aa הומוזיגוטים כי שני האללים זהים. Aa הטרוזיגוט כי הם שונים."}]},{"id":"m1-pitfall-strong","type":"pitfall","text":"**דומיננטי לא אומר \"חזק\".**\n\nזו הטעות הכי נפוצה בקורס. A לא מנצח את a בקרב — פשוט מספיק עותק תקין אחד כדי שהכל יעבוד.\n\nב-Aa העותק הפגום **לא נמחק**. הוא יושב שם בשקט, ועובר הלאה לילדים.","punch":"וזה בדיוק איך שני הורים בריאים מביאים ילד חולה.","alt":[{"title":"למה \"מספיק אחד\" זה לא מוזר","text":"יש לך **שתי כליות**, ואפשר לחיות חיים מלאים עם אחת.\n\nהכליה השנייה לא \"מנצחת\" את הראשונה — פשוט אחת מספיקה. מי שיש לו כליה אחת בריא לגמרי, רק בלי גיבוי.\n\nכך בדיוק עובד עותק תקין אחד מול עותק פגום."}]},{"id":"m1-mcq-carrier","type":"mcq","q":"לאדם יש עותק תקין אחד ועותק פגום אחד — Aa. מה מצבו?","options":["חולה, כי יש לו עותק פגום","בריא לגמרי, אבל יכול להעביר את העותק הפגום","בריא, והעותק הפגום נעלם אצלו","חולה בצורה קלה — חצי מהמחלה"],"correct":1,"why":["לא. העותק התקין מכסה, והוא בריא לגמרי. מספיק אחד.","בדיוק. זה נקרא **נשא** — בריא, ומעביר הלאה בלי לדעת.","לא. הוא לא נעלם, הוא רק לא מתבטא. יש 50% שהוא יעבור לכל ילד.","לא. אין \"חצי מחלה\" בהורשה רצסיבית — או שיש מספיק חלבון תקין או שאין."]},{"id":"m1-concept-geno-pheno","type":"concept","term":"גנוטיפ מול פנוטיפ","text":"**גנוטיפ** = מה כתוב בגנים (AA, Aa, aa).\n**פנוטיפ** = מה רואים בפועל (בריא / חולה).\n\nהקשר ביניהם הוא לא אחד-לאחד: **AA ו-Aa נראים אותו דבר מבחוץ.**","note":"לכן אי אפשר לדעת מהמראה אם מישהו נשא. בשביל זה קיימות בדיקות סקר גנטיות.","alt":[{"title":"בשפה של מרפאה","text":"**גנוטיפ** הוא מה שכתוב בתיק. **פנוטיפ** הוא מה שאתה רואה כשהמטופל נכנס לחדר.\n\nשני אנשים שנראים זהים לגמרי — אחד AA ואחד Aa — יכולים להיות שונים לחלוטין בתיק.\n\nוההבדל הזה לא משנה כלום עבורם. הוא משנה הכל עבור הילדים שלהם."}]},{"id":"m1-truefalse-screening","type":"truefalse","q":"בדיקת סקר גנטית לפני היריון מחפשת אנשים בריאים לגמרי.","correct":true,"why":"נכון, וזה נשמע מוזר עד שמבינים את המנגנון. הבדיקה מחפשת **נשאים** — Aa, בריאים לחלוטין, בלי שום סימן. הסיכון מתגלה רק כששני נשאים נפגשים."},{"id":"m1-setup-punnett","type":"example","text":"שני ההורים נשאים: **Aa** ו-**Aa**.\n\nכל הורה נותן לילד **אלל אחד בלבד** — או A או a, בהגרלה של חצי-חצי.\n\nאז מה יכול לצאת? במקום לנחש — בוא נסדר את זה.","work":["אמא יכולה לתת: A או a","אבא יכול לתת: A או a","כל שילוב אפשרי, ולכל אחד סיכוי שווה"]},{"id":"m1-punnett","type":"punnett","q":"מלא את ריבוע פאנט להכלאה Aa × Aa","help":"בחר משבצת, ואז בחר מה נכנס אליה. כל משבצת = האלל מהשורה + האלל מהעמודה.","top":["A","a"],"side":["A","a"],"chips":["AA","Aa","aa"],"solution":[["AA","Aa"],["Aa","aa"]],"pheno":{"AA":{"label":"בריא","kind":"ok"},"Aa":{"label":"בריא (נשא)","kind":"ok"},"aa":{"label":"חולה","kind":"no"}},"after":"שים לב: **Aa הופיע פעמיים** — פעם מאמא-A/אבא-a, ופעם הפוך. זה בדיוק למה היחס יוצא כמו שהוא יוצא."},{"id":"m1-mcq-quarter","type":"mcq","q":"לפי הריבוע שמילאת — כמה מתוך 4 יהיו חולים?","options":["אחד מתוך 4 — 25%","שניים מתוך 4 — 50%","שלושה מתוך 4 — 75%","אף אחד"],"correct":0,"why":["נכון. רק המשבצת aa. **25% חולים, 50% נשאים בריאים, 25% תקינים לגמרי.**","לא. 50% זה הנשאים (Aa) — הם בריאים.","לא. 75% הם הבריאים: AA ועוד שני Aa.","לא. משבצת aa קיימת — כשגם אמא וגם אבא נותנים את העותק הפגום."]},{"id":"m1-pitfall-independent","type":"pitfall","text":"**25% זה לכל היריון בנפרד.**\n\nזוג שכבר יש לו ילד חולה חושב לפעמים ש\"מיצינו את הרבע\" ושלושת הבאים בטוחים. זה לא עובד ככה.\n\nכל היריון הוא הגרלה חדשה. אפשר גם ארבעה ילדים חולים ברצף.","punch":"זה בדיוק מה שרופא גנטיקאי צריך להסביר להורים, וזה מופיע בשאלות במבחן."},{"id":"m1-concept-segregation","type":"concept","term":"חוק הסגרגציה — החוק הראשון של מנדל","text":"עכשיו שראית את זה קורה, הנה הניסוח הרשמי:\n\n**שני האללים של אותו גן נפרדים זה מזה בזמן יצירת תאי המין, וכל גמטה מקבלת אלל אחד בלבד — בסיכוי של חצי-חצי.**","note":"**גמטה** = תא מין (זרע או ביצית). היא מכילה רק חצי מהכרומוזומים, ולכן רק אלל אחד מכל גן.","alt":[{"title":"מה החוק הזה בעצם אומר","text":"יש לך שני אללים, ואתה מכניס **בדיוק אחד** לכל תא מין — בהגרלה הוגנת של חצי-חצי.\n\nאתה לא בוחר, לא מעדיף, ואין זיכרון מהפעם הקודמת.\n\nזו הסיבה שאח ואחות מאותם הורים יכולים לצאת שונים לגמרי."}]},{"id":"m1-cloze-terms","type":"mcq","q":"צמח שהוא **הומוזיגוט** לתכונה מסוימת — מה זה אומר?","options":["שני האללים שלו זהים (AA או aa)","שני האללים שלו שונים (Aa)","יש לו רק אלל אחד","הוא בהכרח דומיננטי"],"correct":0,"why":["נכון. הומו = זהה. AA וגם aa הם הומוזיגוטים.","זה **הטרוזיגוט** — הטרו = שונה. זה ה-Aa, כלומר הנשא.","לא. תמיד יש שני אללים, אחד מכל הורה.","לא. aa הוא הומוזיגוט רצסיבי. הומוזיגוט אומר רק שהשניים זהים."]},{"id":"m1-concept-generations","type":"concept","term":"השפה של מנדל: P, F1, F2","text":"עוד רגע נראה את הניסוי המקורי. לפני זה — שני מונחים שמופיעים בכל שאלת הכלאה בקורס, ובלעדיהם השאלה לא קריאה.\n\nכשעוקבים אחרי הכלאה לאורך דורות, נותנים לכל דור שם:","rows":[["P","דור ההורים שממנו מתחילים (מלשון parents)"],["F1","הדור הראשון של הצאצאים"],["F2","הדור הבא — הילדים של F1"]],"note":"והמונח השני: **זן טהור** הוא פשוט הומוזיגוט בתכונה שבודקים — AA או aa, אף פעם לא Aa. מנדל התעקש להתחיל דווקא מזנים טהורים, כי רק ככה הוא ידע בוודאות מה כל הורה תרם.","alt":[{"title":"למה בכלל צריך שמות לדורות","text":"כי בלעדיהם אי אפשר לנסח את השאלה.\n\n\"ההורים היו כאלה, הילדים יצאו ככה, והנכדים ככה\" — מסורבל וקל להתבלבל. עם P, F1, F2 זה משפט אחד קצר.\n\nזו לא תיאוריה, זו קיצור דרך בכתיבה. F זה מ-filial, צאצא."}]},{"id":"m1-example-mendel","type":"example","text":"עד עכשיו דיברנו על בריא וחולה. אותו מנגנון בדיוק עובד על **כל** תכונה — וכך הוא התגלה לראשונה.\n\nב-1865 נזיר בשם **גרגור מנדל** ספר פרחי אפונה, בלי לדעת מה זה גן, DNA או אלל. הפעם A הוא לא \"תקין\" אלא \"סגול\", ו-a הוא \"לבן\".\n\nהוא הכליא שני פרחים סגולים שהם Aa — בדיוק כמו שני נשאים — וספר את הצאצאים:","work":["929 פרחים בסך הכל","705 סגולים","224 לבנים"],"stat":{"value":"3 : 1","label":"בדיוק מה שהריבוע שלך חזה"},"note":"מנדל הגיע למספר הזה **מספירה בלבד**. הוא לא ידע על אללים כלום. כל התמונה של \"שני עותקים\" נבנתה אחר כך, כדי להסביר למה דווקא 3:1 ולא חצי-חצי."},{"id":"m1-mcq-f1","type":"mcq","q":"מנדל הכליא זן טהור סגול (AA) עם זן טהור לבן (aa). כל דור F1 יצא סגול. איפה נעלם הלבן?","options":["האלל הלבן נהרס בהכלאה","כל צמחי F1 הם Aa — הלבן שם, פשוט מכוסה","הלבן חוזר רק אם מכליאים עם צמח לבן","מנדל טעה בספירה"],"correct":1,"why":["לא. אללים לא נהרסים בהכלאה, הם רק עוברים.","בדיוק. AA × aa נותן **רק** Aa. כולם נשאים, כולם סגולים — ולכן ב-F2 הלבן חוזר ב-25%.","לא. הוא חוזר גם בהכלאה עצמית של F1 — וזה בדיוק הניסוי של מנדל.","לא. הספירה שלו הייתה מדויקת, וזו הסיבה שהיא שינתה את הביולוגיה."]},{"id":"m1-concept-conditional","type":"concept","term":"שני כללים שהופכים את זה לשאלת מבחן","text":"הריבוע נותן 25% / 50% / 25%. אבל שאלות מבחן כמעט אף פעם לא שואלות את זה ישירות — הן מוסיפות **מידע**, ואז המספרים משתנים.","rows":[["מידע מצמצם","אם ידוע שאדם **בריא**, המשבצת aa יורדת מהחשבון. נשארות 3 משבצות, לא 4"],["אירועים נכפלים","הסיכוי ששני דברים יקרו יחד = הכפלת הסיכויים"]],"note":"הכלל הראשון הוא המלכודת. ברגע שאתה יודע משהו על התוצאה, אתה כבר לא סופר מתוך 4 — אתה סופר מתוך מה שנשאר.","alt":[{"title":"הכלל הראשון בשורה אחת","text":"יש 4 משבצות: AA, Aa, Aa, aa.\n\nמישהו אומר לך \"הילד בריא\". aa יורד. נשארו **שלוש** משבצות: AA, Aa, Aa.\n\nמתוכן, שתיים הן נשא. אז הסיכוי שהוא נשא הוא 2 מתוך 3 — לא חצי, ולא 50%."}]},{"id":"m1-mcq-twothirds","type":"mcq","level":3,"q":"לזוג נשאים (Aa × Aa) נולדו שני ילדים. הבן חולה. הבת **בריאה**. מה הסיכוי שהבת נשאית?","options":["1/2","2/3","1/4","3/4"],"correct":1,"why":["כאן נופלים. 1/2 היה נכון אם לא היינו יודעים שהיא בריאה — אבל אנחנו יודעים.","נכון. היא בריאה, ולכן aa יורד. נשארו AA, Aa, Aa — ומתוכן **2 מתוך 3** הן נשא.","1/4 זה הסיכוי להיות AA מתוך כל ארבע המשבצות, לא מתוך השלוש שנשארו.","3/4 זה הסיכוי להיות בריא בכלל — וזה כבר ידוע לנו עליה, לא מה שנשאל."]},{"id":"m1-mcq-compound","type":"mcq","level":3,"q":"אותו זוג נשאים מתכנן שני ילדים נוספים. מה הסיכוי ש**שניהם** יהיו בריאים?","options":["3/4","9/16","1/2","6/8"],"correct":1,"why":["3/4 זה הסיכוי לילד **אחד** בריא. השאלה על שניים.","נכון. כל היריון עומד בפני עצמו: 3/4 × 3/4 = **9/16**.","לא. חצי לא מופיע כאן בכלל — הסיכוי לילד בריא הוא 3/4, לא 1/2.","6/8 זה 3/4 — חיברת במקום להכפיל. אירועים עצמאיים מוכפלים."]},{"id":"m1-recap","type":"recap","points":["מכל גן יש **שני אללים** — אחד מכל הורה. עותק תקין אחד מספיק, ולכן דומיננטי ≠ חזק.","**Aa = נשא**: בריא לגמרי, ומעביר הלאה. שני נשאים → 25% חולים, בכל היריון מחדש.","**ריבוע פאנט** מסדר את כל צירופי הגמטות. Aa × Aa נותן 1:2:1 בגנוטיפ, שזה 3:1 בפנוטיפ."],"next":"מכאן נפתחות שתי דרכים: **הכלאת מבחן** — איך לגלות אם צמח סגול הוא AA או Aa; ו**הורשה דיהיברידית** — שתי תכונות במקביל, ריבוע של 4×4. שתיהן ביחידה הזו."}]},{"id":"mendel-02","title":"הכלאת מבחן: לגלות גנוטיפ שמסתתר","estMinutes":10,"source":"שיעור 3, עמ' 5","cards":[{"id":"m2-hook","type":"hook","text":"לפניך שני צמחים סגולים. אחד מהם AA, השני Aa.","sub":"הם נראים זהים לחלוטין. אין מיקרוסקופ ואין בדיקת DNA. איך תדע מי מי?"},{"id":"m2-concept-problem","type":"concept","term":"הבעיה: הדומיננטי מסתיר","text":"עד עכשיו תמיד ידענו את הגנוטיפ, כי התחלנו מזנים טהורים.\n\nעכשיו הכיוון הפוך: יש לך פנוטיפ דומיננטי ביד, ואתה רוצה לדעת מה הגנוטיפ שמאחוריו.","rows":[["AA","סגול"],["Aa","סגול"],["aa","לבן — את זה כן אפשר לזהות במבט"]],"note":"הפנוטיפ הרצסיבי הוא היחיד שמסגיר את הגנוטיפ שלו בוודאות. **aa נראה שונה, ולכן אין לגביו ספק.** זה בדיוק מה שנשתמש בו."},{"id":"m2-anchor-testcross","type":"anchor","text":"הרעיון: **תכליא את הצמח המסתורי עם צמח aa.**\n\nלמה דווקא aa? כי הוא יכול לתת רק דבר אחד — a. הוא לא תורם שום הפתעה.","reveal":{"q":"אז מה קובע את מראה הצאצאים?","a":"רק מה שהצמח המסתורי נתן. הצאצאים מדווחים עליו ישירות."},"note":"זו **הכלאת מבחן** (test cross): מכליאים עם הומוזיגוט רצסיבי, והצאצאים חושפים את מה שלא רואים.","alt":[{"title":"למה זה עובד","text":"אם אחד הצדדים תורם רק a, אז כל צאצא הוא בעצם **חלון** אל מה שהצד השני תרם.\n\nיצא סגול? הצד המסתורי נתן A.\nיצא לבן? הוא נתן a — וזה מוכיח שהיה בו a להתחיל עם."}]},{"id":"m2-punnett-AA","type":"punnett","q":"מקרה ראשון: נניח שהצמח המסתורי הוא AA. מלא את ההכלאה עם aa.","help":"למעלה הגמטות של הצמח המסתורי, בצד הגמטות של aa.","top":["A","A"],"side":["a","a"],"chips":["AA","Aa","aa"],"solution":[["Aa","Aa"],["Aa","Aa"]],"pheno":{"Aa":{"label":"סגול","kind":"ok"}},"after":"**כל הצאצאים סגולים, בלי יוצא מן הכלל.** ל-AA אין בכלל a לתת, אז לבן לא יכול להופיע."},{"id":"m2-punnett-Aa","type":"punnett","q":"מקרה שני: נניח שהצמח המסתורי הוא Aa. מלא שוב את ההכלאה עם aa.","help":"שים לב מה השתנה בשורה העליונה.","top":["A","a"],"side":["a","a"],"chips":["AA","Aa","aa"],"solution":[["Aa","aa"],["Aa","aa"]],"pheno":{"Aa":{"label":"סגול","kind":"ok"},"aa":{"label":"לבן","kind":"no"}},"after":"**חצי סגולים, חצי לבנים.** כל צאצא לבן הוא הוכחה שהצמח המסתורי נשא a."},{"id":"m2-concept-reading","type":"concept","term":"איך קוראים את התוצאה","text":"שתי ההכלאות נותנות תמונות שונות לגמרי, וזה מה שהופך את זה לכלי:","rows":[["100% דומיננטי","הצמח היה **AA**"],["בערך 50/50","הצמח היה **Aa**"]],"note":"צאצא רצסיבי **אחד** כבר מספיק כדי לקבוע Aa — הוא לא היה יכול להגיע משום מקום אחר. הכיוון ההפוך פחות ודאי, וזה הנושא של הכרטיסייה הבאה."},{"id":"m2-mcq-read","type":"mcq","level":2,"q":"ביצעת הכלאת מבחן וקיבלת 40 צאצאים: 21 סגולים, 19 לבנים. מה היה הצמח המקורי?","options":["AA","Aa","aa","אי אפשר לדעת"],"correct":1,"why":["לא. אילו היה AA, לא היה מופיע ולו לבן אחד — ויש 19.","נכון. 21 מול 19 זה **בערך 50/50**, בדיוק מה שהטרוזיגוט נותן בהכלאת מבחן.","לא. הצמח המקורי היה סגול, ו-aa הוא לבן.","דווקא אפשר. הופעת לבנים בכלל כבר סוגרת את העניין."]},{"id":"m2-mcq-sample","type":"mcq","level":3,"q":"הכלאת מבחן אחרת הניבה **3 צאצאים בלבד, כולם סגולים**. האם אפשר לקבוע שהצמח הוא AA?","options":["כן — לא הופיע אף לבן","לא — גם Aa היה נותן את זה בסיכוי של 1/8","לא — צריך לפחות 10 צאצאים תמיד","כן, אבל רק אם ההורה השני היה זן טהור"],"correct":1,"why":["כאן נופלים. היעדר ראיה הוא לא ראיה להיעדר — במיוחד במדגם של שלושה.","נכון. אם הצמח Aa, כל צאצא הוא הגרלה של חצי. שלושה סגולים ברצף = ½ בשלישית = **1/8**, כלומר 12.5%. זה קורה.","אין מספר קסם. מה שקובע זה **כמה קטן הסיכוי לטעות** — עם 10 צאצאים הוא כבר פחות מאלפית.","ההורה השני תמיד aa בהכלאת מבחן, וזה לא פותר את בעיית המדגם הקטן."]},{"id":"m2-recap","type":"recap","points":["**הכלאת מבחן** = הכלאה עם הומוזיגוט רצסיבי (aa), שתורם רק a ולכן לא מסתיר כלום.","כל הצאצאים דומיננטיים → ההורה **AA**. בערך חצי־חצי → ההורה **Aa**.","צאצא רצסיבי אחד מוכיח Aa. אבל **היעדר** צאצא רצסיבי במדגם קטן לא מוכיח AA."],"next":"בשיעור הבא: מה קורה כשעוקבים אחרי **שתי תכונות במקביל** — ריבוע של 4×4, והיחס המפורסם 9:3:3:1."}]},{"id":"mendel-03","title":"שתי תכונות במקביל: היחס 9:3:3:1","estMinutes":13,"source":"שיעור 3, עמ' 6–8","cards":[{"id":"m3-hook","type":"hook","text":"עד עכשיו עקבנו אחרי תכונה אחת בכל פעם.","sub":"אבל אף אורגניזם אמיתי הוא לא תכונה אחת. מה קורה כששני גנים משחקים בו-זמנית — הם מפריעים זה לזה?"},{"id":"m3-concept-setup","type":"concept","term":"נקודת הפתיחה: טהור בשני הגנים","text":"כמו קודם, מנדל התחיל מזנים טהורים — אבל הפעם **הומוזיגוטים בשני הגנים** שנבדקים, לא רק באחד.\n\nהוא לקח אפונה **צהובה ומקומטת** והכליא אותה עם אפונה **ירוקה ועגולה**.","rows":[["Y / y","צבע הזרע: **צהוב** דומיננטי, ירוק רצסיבי"],["R / r","צורת הזרע: **עגול** דומיננטי, מקומט רצסיבי"]],"note":"כל תכונה מקבלת אות משלה. שני הגנים לא חייבים להיות דומיננטיים באותו הורה — הצהוב־מקומט הוא YYrr, והירוק־עגול הוא yyRR."},{"id":"m3-example-f1","type":"example","text":"כל הורה טהור יכול לתת גמטה אחת בלבד:","work":["**YYrr** יכול לתת רק **Yr**","**yyRR** יכול לתת רק **yR**","ולכן כל דור F1 יוצא **YyRr**"],"note":"בפועל מנדל קיבל ב-F1 אפונים **צהובות ועגולות** — תכונה אחת מכל הורה. מכאן הוא ידע מי הדומיננטי: צהוב ועגול. הגנוטיפ YyRr נקרא **הטרוזיגוט כפול**."},{"id":"m3-concept-gametes","type":"concept","term":"כמה סוגי גמטות יכול YyRr לתת?","text":"כל גמטה מקבלת **אלל אחד מכל גן**. יש שתי אפשרויות לצבע ושתיים לצורה, וכל שילוב חוקי:","rows":[["YR","צהוב + עגול"],["Yr","צהוב + מקומט"],["yR","ירוק + עגול"],["yr","ירוק + מקומט"]],"note":"**ארבעה סוגים, בסיכוי שווה.** זה הצעד שקובע את כל השאר — ומכאן מגיע ריבוע של 4×4 במקום 2×2.","alt":[{"title":"למה בדיוק ארבעה","text":"בחר אלל לצבע: 2 אפשרויות.\nבחר אלל לצורה: 2 אפשרויות.\n\n2 × 2 = **4** צירופים. אותו חשבון כמו שתי מטבעות — עץ־עץ, עץ־פלי, פלי־עץ, פלי־פלי."}]},{"id":"m3-mcq-gametes","type":"mcq","level":2,"q":"אילו גמטות יכול לתת צמח שהוא **YYRr**?","options":["YR, Yr, yR, yr — ארבע","YR, Yr — שתיים בלבד","YR בלבד","YY, Rr"],"correct":1,"why":["לא. אין לו בכלל אלל y, אז אף גמטה שלו לא תכיל y.","נכון. לצבע יש לו רק **Y** לתת, ולצורה או **R** או **r**. סה\"כ שתיים.","לא. הוא הטרוזיגוט לצורה (Rr), ולכן יכול לתת גם R וגם r.","גמטה מקבלת **אלל אחד מכל גן**, לא זוג. YY זה גנוטיפ, לא גמטה."]},{"id":"m3-punnett-dihybrid","type":"punnett","q":"ההכלאה של F1: YyRr × YyRr. הריבוע כבר מלא כמעט כולו — השלם את ארבע הפינות באלכסון.","help":"כל משבצת = האלל מהשורה + האלל מהעמודה, לכל גן בנפרד.","top":["YR","Yr","yR","yr"],"side":["YR","Yr","yR","yr"],"chips":["YYRR","YYrr","yyRR","yyrr","YyRr"],"prefill":{"1":"YYRr","2":"YyRR","3":"YyRr","4":"YYRr","6":"YyRr","7":"Yyrr","8":"YyRR","9":"YyRr","11":"yyRr","12":"YyRr","13":"Yyrr","14":"yyRr"},"solution":[["YYRR","YYRr","YyRR","YyRr"],["YYRr","YYrr","YyRr","Yyrr"],["YyRR","YyRr","yyRR","yyRr"],["YyRr","Yyrr","yyRr","yyrr"]],"pheno":{"YYRR":{"label":"צהוב עגול","kind":"ok"},"YYRr":{"label":"צהוב עגול","kind":"ok"},"YyRR":{"label":"צהוב עגול","kind":"ok"},"YyRr":{"label":"צהוב עגול","kind":"ok"},"YYrr":{"label":"צהוב מקומט","kind":"mid"},"Yyrr":{"label":"צהוב מקומט","kind":"mid"},"yyRR":{"label":"ירוק עגול","kind":"mid"},"yyRr":{"label":"ירוק עגול","kind":"mid"},"yyrr":{"label":"ירוק מקומט","kind":"no"}},"after":"עכשיו הסתכל על הצבעים: גוש ירוק גדול, שתי קבוצות ביניים, ומשבצת אדומה בודדת בפינה. **זה היחס 9:3:3:1** — והוא יצא מהריבוע, לא משננו אותו."},{"id":"m3-mcq-ratio","type":"mcq","level":2,"q":"לפי הריבוע — כמה מתוך 16 יהיו **ירוקים ומקומטים**?","options":["9","3","1","4"],"correct":2,"why":["9 זה צהוב ועגול — שתי התכונות הדומיננטיות.","3 זה כל אחת משתי קבוצות הביניים: צהוב־מקומט או ירוק־עגול.","נכון. **רק yyrr**, משבצת אחת מתוך 16. זו הפינה היחידה שבה שני הגנים רצסיביים.","4 לא מופיע ביחס בכלל. הפירוק הוא 9 + 3 + 3 + 1 = 16."]},{"id":"m3-concept-law2","type":"concept","term":"החוק השני של מנדל: אי-תלות בסגרגציה","text":"התוצאה הזו מוכיחה משהו לא מובן מאליו:\n\n**גנים שונים עוברים להורים לילדים באופן בלתי תלוי זה בזה.** האלל שקיבלת לצבע לא משפיע בכלל על האלל שתקבל לצורה.","note":"לכן YyRr נותן את כל ארבע הגמטות **בסיכוי שווה**. אילו הגנים היו תלויים זה בזה, היינו מקבלים יחס אחר לגמרי — וזה בדיוק מה שקורה בתאחיזה, ביחידה 14.","alt":[{"title":"מה זה \"בלתי תלוי\" בפועל","text":"זריקת שתי קוביות. מה שיצא בראשונה לא משנה כלום לגבי השנייה.\n\nכך בדיוק הגנים כאן: הגרלה נפרדת לכל תכונה, באותו רגע, בלי שאחת מושכת את השנייה."}]},{"id":"m3-pitfall-single","type":"pitfall","text":"**תסתכל על תכונה אחת בלבד, והיחס חוזר להיות 3:1.**\n\nמתוך 16: צהובים = 9 + 3 = **12**. ירוקים = 3 + 1 = **4**. כלומר 12:4, שזה 3:1.","punch":"9:3:3:1 הוא פשוט 3:1 כפול 3:1. אין כאן חוק חדש — יש שני חוקים ישנים שרצים במקביל."},{"id":"m3-concept-formula","type":"concept","term":"הנוסחה שחוסכת ציור","text":"כשמכליאים הטרוזיגוטים בכל הגנים הנבדקים, אפשר לדעת כמה אפשרויות יתקבלו בלי לצייר כלום.\n\nעבור **n** גנים:","rows":[["פנוטיפים","2 בחזקת n"],["גנוטיפים","3 בחזקת n"]],"note":"בדיהיברידי: 2² = 4 פנוטיפים (וזה ה-9:3:3:1), ו-3² = 9 גנוטיפים. תספור בריבוע למעלה — בדיוק 9 גנוטיפים שונים."},{"id":"m3-mcq-trihybrid","type":"mcq","level":3,"q":"בהכלאה **תריהיברידית** (AaBbDd × AaBbDd) — כמה גנוטיפים שונים אפשריים?","options":["8","27","64","9"],"correct":1,"why":["8 זה מספר ה**פנוטיפים**: 2 בחזקת 3. השאלה על גנוטיפים.","נכון. 3 בחזקת 3 = **27**. כל גן תורם שלוש אפשרויות (AA, Aa, aa), והן מוכפלות.","64 זה מספר המשבצות בריבוע (8 גמטות × 8), לא מספר הגנוטיפים השונים — הרבה משבצות חוזרות.","9 זה המצב הדיהיברידי, עם שני גנים בלבד."]},{"id":"m3-recap","type":"recap","points":["הטרוזיגוט כפול **YyRr** נותן **4 סוגי גמטות** בסיכוי שווה, ולכן הריבוע הוא 4×4.","היחס בפנוטיפ הוא **9:3:3:1** — וזה פשוט 3:1 כפול 3:1, כי שני הגנים עצמאיים.","**החוק השני של מנדל**: גנים שונים מתפצלים לגמטות בלי להשפיע זה על זה. עבור n גנים — 2ⁿ פנוטיפים, 3ⁿ גנוטיפים."],"next":"לשלושה גנים ומעלה הריבוע כבר בלתי אפשרי — 64 משבצות ומעלה. ביחידה הבאה נחליף אותו בשתי נוסחאות הסתברות שעושות את אותה עבודה בשורה אחת."}]}],"plan":3},{"id":"03-probability","title":"שיטת ההסתברויות","lectures":"4","pages":"9–10","lessons":[{"id":"prob-01","title":"להכפיל או לחבר: שתי נוסחאות במקום ריבוע","estMinutes":12,"source":"שיעור 4, עמ' 9–10","cards":[{"id":"p1-hook","type":"hook","text":"הכלאה שעוקבת אחרי חמש תכונות דורשת ריבוע פאנט של **1024 משבצות**.","sub":"אתה לא הולך לצייר את זה, ובמבחן אין לך זמן. אז מה עושים?"},{"id":"p1-concept-why","type":"concept","term":"למה הריבוע נשבר","text":"מספר הגמטות מכל צד הוא 2 בחזקת מספר הגנים ההטרוזיגוטיים. מספר המשבצות הוא זה בריבוע.","rows":[["גן אחד","2 × 2 = 4 משבצות"],["שני גנים","4 × 4 = 16 משבצות"],["שלושה גנים","8 × 8 = 64 משבצות"],["חמישה גנים","32 × 32 = 1024 משבצות"]],"note":"הריבוע לא טועה — הוא פשוט לא מעשי. במקומו נשתמש בשני חוקי הסתברות שנותנים את אותה תשובה בשורה אחת."},{"id":"p1-concept-product","type":"concept","term":"חוק המכפלה — \"וגם\"","text":"**ההסתברות ששני אירועים בלתי תלויים יקרו שניהם = מכפלת ההסתברויות שלהם.**\n\nאירועים בלתי תלויים הם כאלה שלא משפיעים זה על זה בכלל.","rows":[["6 בקובייה אחת","1/6"],["6 בשתי קוביות","1/6 × 1/6 = 1/36"]],"note":"הקובייה השנייה לא יודעת מה יצא בראשונה — גם אם זרקת אותן יחד. זה מה שהופך אותן לבלתי תלויות.","alt":[{"title":"למה מכפלה ולא חיבור","text":"כי כל תנאי נוסף **מצמצם** את מה שנשאר.\n\nמחצי המקרים שעברו את התנאי הראשון, רק חצי יעברו גם את השני. חצי מחצי זה רבע — פחות, לא יותר.\n\nמכפלה תמיד מקטינה. חיבור מגדיל, ולכן הוא לא יכול להתאים ל\"וגם\"."}]},{"id":"p1-mcq-product","type":"mcq","q":"מה ההסתברות שרצף DNA באורך 3 נוקלאוטידים יהיה **GGG**?","options":["3/4","1/4 בחזקת 3","1/4 × 3","1/12"],"correct":1,"why":["לא. 3/4 הוא הסיכוי ש\"לא G\" במיקום אחד.","נכון. לכל מיקום יש 4 אפשרויות (A, T, C, G), אז 1/4 לכל אחד, והם בלתי תלויים: **1/4 × 1/4 × 1/4**.","זה חיבור מוסווה. \"וגם\" דורש הכפלה, לא הכפלה במספר האירועים.","1/12 לא נובע משום חישוב כאן."]},{"id":"p1-concept-sum","type":"concept","term":"חוק הסכום — \"או\"","text":"**ההסתברות שיקרה אחד מתוך כמה אירועים זרים = סכום ההסתברויות שלהם.**\n\nאירועים זרים הם כאלה שלא יכולים לקרות יחד באותו אירוע.","rows":[["4 בקובייה","1/6"],["5 בקובייה","1/6"],["4 או 5","1/6 + 1/6 = 1/3"]],"note":"בזריקה אחת אי אפשר לקבל גם 4 וגם 5 — הם מוציאים זה את זה. **זה התנאי לחיבור.**"},{"id":"p1-pitfall-which","type":"pitfall","text":"**המילה בשאלה מסגירה את הפעולה.**\n\n\"גם וגם\" / \"שניהם\" / \"ברצף\" → **מכפלה**.\n\"או\" / \"לפחות אחד מהשניים\" → **חיבור**.","punch":"אם אתה מהסס — שאל את עצמך אם שני הדברים יכולים לקרות באותו אירוע. אם כן, זה \"וגם\". אם לא, זה \"או\"."},{"id":"p1-mcq-combined","type":"mcq","level":2,"q":"מה ההסתברות שברצף DNA באורך 10, **כל** מיקום יהיה C או G?","options":["1/2 בחזקת 10","1/4 בחזקת 10","1/2 × 10","1/4 + 1/4"],"correct":0,"why":["נכון. קודם **חיבור** בתוך מיקום: C או G = 1/4 + 1/4 = 1/2. אחר כך **מכפלה** על פני 10 מיקומים: **1/2 בחזקת 10**.","זה היה נכון לאות אחת ספציפית בכל מיקום, לא לשתי אפשרויות.","חיבור במקום מכפלה. עשרה תנאים שכולם חייבים להתקיים — מכפילים.","זה רק המיקום הראשון. השאלה על עשרה."]},{"id":"p1-concept-apply","type":"concept","term":"איך זה עובד על הכלאה","text":"החוק השני של מנדל אומר שהגנים עצמאיים. **בדיוק בגלל זה מותר להכפיל.**\n\nהשיטה:","rows":[["1","מפצלים לגן אחד בכל פעם"],["2","מחשבים את ההסתברות לגן הבודד"],["3","מכפילים את כל התוצאות"]],"note":"בלי החוק השני זה היה אסור — גנים תלויים זה בזה (תאחיזה) שוברים בדיוק את ההנחה הזו. נגיע לזה ביחידה 14."},{"id":"p1-example-five","type":"example","text":"הכלאה בין שני זנים:\n\n**AaBbCcDdEe** × **AabbCcddEe**\n\nמה הסיכוי לצאצא **הומוזיגוט רצסיבי בכל חמשת הגנים**? במקום 1024 משבצות — חמש שורות:","work":["גן A: Aa × Aa → **aa** בסיכוי 1/4","גן B: Bb × bb → **bb** בסיכוי 1/2","גן C: Cc × Cc → **cc** בסיכוי 1/4","גן D: Dd × dd → **dd** בסיכוי 1/2","גן E: Ee × Ee → **ee** בסיכוי 1/4"],"stat":{"value":"1 / 256","label":"¼ × ½ × ¼ × ½ × ¼"},"note":"שים לב לתבנית: **הטרוזיגוט × הטרוזיגוט נותן 1/4 לרצסיבי. הטרוזיגוט × רצסיבי נותן 1/2.** שתי התבניות האלה מכסות כמעט כל שאלה מהסוג הזה."},{"id":"p1-mcq-apply","type":"mcq","level":3,"q":"בהכלאה **AaBbCc × AaBbCc**, מה הסיכוי לצאצא שהוא **דומיננטי בפנוטיפ בכל שלושת הגנים**?","options":["27/64","1/64","3/4","9/16"],"correct":0,"why":["נכון. לכל גן, הטרוזיגוט × הטרוזיגוט נותן פנוטיפ דומיננטי בסיכוי **3/4**. שלושה גנים עצמאיים: 3/4 בחזקת 3 = **27/64**.","1/64 זה הסיכוי להיות רצסיבי בכל השלושה (1/4 בחזקת 3) — ההפך מהנשאל.","3/4 זה גן אחד בלבד. יש שלושה.","9/16 זה שני גנים (3/4 בריבוע). כאן שלושה."]},{"id":"p1-recap","type":"recap","points":["**\"וגם\" → מכפלה** (אירועים בלתי תלויים). **\"או\" → חיבור** (אירועים זרים שלא יכולים לקרות יחד).","בהכלאה מרובת גנים: מפצלים לגן אחד בכל פעם, מחשבים, ומכפילים. מותר רק כי הגנים עצמאיים.","שתי תבניות לזכור: **Aa × Aa → 1/4 רצסיבי, 3/4 דומיננטי.** **Aa × aa → 1/2 ו-1/2.**"],"next":"עד עכשיו אמרנו \"עותק תקין אחד מספיק\" בלי להסביר למה. בשיעור הבא נרד לרמת החלבון ונראה בדיוק מה קורה שם — דרך מחלה אמיתית."}]},{"id":"prob-02","title":"למה רצסיבי הוא רצסיבי: התשובה ברמת החלבון","estMinutes":11,"source":"שיעור 4, עמ' 10","cards":[{"id":"p2-hook","type":"hook","text":"אמרתי לך כבר בשיעור הראשון ש\"עותק תקין אחד מספיק\".","sub":"אבל למה בעצם? מה קורה שם באמת שגורם לזה לעבוד? הגיע הזמן לרדת רמה."},{"id":"p2-concept-protein","type":"concept","term":"מה גן באמת עושה","text":"גן הוא **הוראה לייצור חלבון**. הדרך מהוראה למוצר:","rows":[["1","ה-DNA בגרעין מועתק למולקולת **RNA**"],["2","ה-RNA יוצא מהגרעין ומגיע ל**ריבוזום**"],["3","הריבוזום קורא **3 אותיות בכל פעם**, וכל שלישייה = חומצה אמינית"],["4","החומצות האמיניות משתרשרות ויוצרות את **החלבון**"]],"note":"נלמד את זה לעומק ביחידה 15. כרגע מספיקה השורה התחתונה: **גן = חלבון. אלל שונה = חלבון קצת אחר.**"},{"id":"p2-concept-melanin","type":"concept","term":"לבקנות: מחלה עם מנגנון ידוע","text":"**מלאנין** הוא הפיגמנט שנותן צבע לעור, לשיער ולעיניים. מי שאין לו ייצור מלאנין נקרא **לבקן** — עור לבן, שיער לבן, עיניים בהירות.\n\nייצור המלאנין הוא שרשרת שלבים. אחד מהם: חומצת אמינו בשם **טירוזין** נחתכת על ידי אנזים בשם **טירוזינאז**.","note":"לבקנות היא פגם בגן שמייצר את הטירוזינאז. נוצר חלבון שלא מסוגל לחתוך את הטירוזין — ובלי החיתוך הזה, אין מלאנין.","alt":[{"title":"השרשרת בשורה אחת","text":"גן תקין ← אנזים טירוזינאז תקין ← טירוזין נחתך ← מלאנין ← צבע.\n\nשבור חוליה אחת בשרשרת, וכל מה שאחריה לא קורה. הצבע לא נעלם — הוא **פשוט לא נוצר**."}]},{"id":"p2-example-three","type":"example","text":"עכשיו שלושת הגנוטיפים, אבל הפעם **ברמת האנזים** ולא ברמת האותיות:","work":["**שני עותקים תקינים** — שני עותקים מייצרים טירוזינאז. מלאנין נוצר כרגיל","**עותק תקין אחד** — רק אחד מייצר טירוזינאז. **חצי מהכמות, וזה מספיק**. מלאנין נוצר, והאדם נראה רגיל לחלוטין","**שני עותקים פגומים** — שניהם מייצרים טירוזינאז פגום. אין חיתוך, אין מלאנין"],"note":"הנה התשובה שחיפשנו: **חצי מכמות האנזים מספיקה כדי לשמור על מצב תקין.** זה כל הסוד מאחורי \"עותק אחד מספיק\"."},{"id":"p2-pitfall-strong","type":"pitfall","text":"עכשיו אפשר לנסח את זה מדויק: **האלל התקין לא \"מנצח\" את הפגום.**\n\nשניהם עובדים במקביל, בכל תא. אחד מייצר אנזים תקין והשני מייצר אנזים פגום — והם לא נלחמים.","punch":"פשוט מספיקה כמות האנזים שהעותק התקין מייצר. \"דומיננטי\" מתאר תוצאה, לא מאבק."},{"id":"p2-mcq-hetero","type":"mcq","level":2,"q":"אצל הטרוזיגוט ללבקנות — האם מיוצר טירוזינאז פגום?","options":["לא. האלל התקין מונע את ייצורו","כן. שני העותקים פעילים, ואחד מהם מייצר חלבון פגום","כן, אבל רק בחלק מהתאים","לא, כי האלל הפגום שקט"],"correct":1,"why":["לא. שום אלל לא \"מכבה\" את השני. שניהם מתבטאים.","נכון. **מיוצרים שני סוגי חלבון בו-זמנית** — תקין ופגום. הפנוטיפ תקין כי הכמות התקינה מספיקה, לא כי הפגום נעלם.","לא. ההתבטאות היא בכל התאים, לא בחלקם.","\"שקט\" מתאר את הפנוטיפ, לא את הגן. הגן פעיל ומייצר."]},{"id":"p2-mcq-principle","type":"mcq","level":3,"q":"רוב המחלות שנגרמות מ**חוסר באנזים** הן רצסיביות. מה ההסבר הכי טוב?","options":["אנזימים הם חלבונים קטנים ולכן פחות חשובים","50% מפעילות האנזים בדרך כלל מספיקה לתפקוד תקין","מוטציות באנזימים נדירות יותר","אנזימים מיוצרים רק מעותק אחד ממילא"],"correct":1,"why":["גודל החלבון לא קשור. אנזימים חיוניים לגמרי.","נכון, וזה עיקרון שילווה אותך בכל הגנטיקה הרפואית: **המערכת בנויה עם מרווח ביטחון.** חצי אנזים מספיק, ולכן נשא לא חולה.","השכיחות של מוטציות לא קובעת אם מחלה דומיננטית או רצסיבית.","לא נכון. שני העותקים מתבטאים ומייצרים."]},{"id":"p2-recap","type":"recap","points":["**גן = הוראה לחלבון.** אלל רצסיבי הוא בדרך כלל גרסה שמייצרת חלבון שלא עובד.","אצל הטרוזיגוט **שני האללים פעילים** ומיוצרים שני סוגי חלבון. אין מאבק — פשוט מספיקה הכמות התקינה.","**חצי מפעילות האנזים מספיקה** בדרך כלל, ולכן מחלות של חוסר אנזים הן רצסיביות ונשאים בריאים."],"next":"עד עכשיו כל הגנים שראינו היו על כרומוזומים רגילים, ולכן ההורשה הייתה זהה לגברים ולנשים. ביחידה הבאה — מה משתנה כשהגן יושב על כרומוזום המין."}]}],"plan":2},{"id":"04-sex-chromosomes","title":"כרומוזומי מין והשתקת X","lectures":"5–6","pages":"11–16","lessons":[],"plan":3},{"id":"05-inheritance-patterns","title":"סוגי הורשה ואילנות יוחסין","lectures":"7–8","pages":"17–26","lessons":[],"plan":4},{"id":"06-gene-interactions","title":"אינטראקציות גנטיות וסוגי דם","lectures":"9–10","pages":"26–37","lessons":[],"plan":4},{"id":"07-cell-cycle","title":"מבנה כרומוזום ומיטוזה","lectures":"12","pages":"37–41","lessons":[],"plan":2},{"id":"08-meiosis","title":"מיוזה, שחלוף ושונות","lectures":"13","pages":"41–44","lessons":[],"plan":2},{"id":"09-chromosomal","title":"הפרעות כרומוזומליות","lectures":"13–16","pages":"44–51","lessons":[],"plan":3},{"id":"10-dna-structure","title":"מבנה ה-DNA","lectures":"16","pages":"52–54","lessons":[],"plan":2},{"id":"11-mitochondrial","title":"הורשה אימהית ומיטוכונדריאלית","lectures":"17","pages":"49–55","lessons":[],"plan":1},{"id":"12-diagnostics","title":"קריוטיפ, FISH וצ'יפ גנטי","lectures":"18","pages":"56–59","lessons":[],"plan":2},{"id":"13-prenatal","title":"אבחון טרום לידתי ובדיקות סקר","lectures":"19","pages":"59–62","lessons":[],"plan":2},{"id":"14-linkage","title":"תאחיזה ומיפוי גנים","lectures":"19–20","pages":"62–66","lessons":[],"plan":3},{"id":"15-dna-to-protein","title":"שעתוק ותרגום","lectures":"21","pages":"67–68","lessons":[],"plan":2},{"id":"16-mutations","title":"מוטציות ותסמונת X השביר","lectures":"21–22","pages":"68–73","lessons":[],"plan":3},{"id":"17-population","title":"גנטיקת אוכלוסיות והרדי-ויינברג","lectures":"22–24","pages":"74–79","lessons":[],"plan":3},{"id":"18-quantitative","title":"תכונות כמותיות ותורשתיות","lectures":"25","pages":"80–82","lessons":[],"optional":true,"optionalNote":"מסומן בסיכום: לא למבחן","plan":1}]}</script>

<script>
(function () {
  "use strict";

  document.documentElement.lang = "he";
  document.documentElement.dir = "rtl";

  var COURSE = JSON.parse(document.getElementById("course-data").textContent);
  var app = document.getElementById("app");

  /* ---------------- flat card list ---------------- */

  var ALL = [];
  COURSE.units.forEach(function (u) {
    (u.lessons || []).forEach(function (les) {
      les.cards.forEach(function (c, i) {
        ALL.push({
          card: c,
          unitId: u.id,
          unitTitle: u.title,
          lessonId: les.id,
          lessonTitle: les.title,
          idxInLesson: i,
          lessonLen: les.cards.length
        });
      });
    });
  });
  var BY_ID = {};
  ALL.forEach(function (e, i) { e.pos = i; BY_ID[e.card.id] = e; });

  var QUIZ = { mcq: 1, truefalse: 1, punnett: 1 };
  function isQuiz(c) { return !!QUIZ[c.type]; }

  /* ---------------- state ---------------- */

  var DEFAULT = { v: 1, cards: {}, days: [], history: [], lessonsDone: [] };
  var state = JSON.parse(JSON.stringify(DEFAULT));
  var KEY = "genetics-progress-v1";

  function today() { return new Date().toISOString().slice(0, 10); }

  function dayDiff(a, b) {
    return Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
  }

  function loadLocal() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) merge(JSON.parse(raw));
    } catch (e) { /* private mode — carry on with defaults */ }
  }

  function merge(data) {
    if (!data || data.v !== 1) return;
    Object.keys(DEFAULT).forEach(function (k) {
      if (data[k] !== undefined) state[k] = data[k];
    });
  }

  var saveFailed = false;
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); saveFailed = false; }
    catch (e) { saveFailed = true; }
  }

  /* ---- העברת התקדמות בין מכשירים: ייצוא לקובץ, ייבוא ממנו ---- */

  function exportProgress() {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "genetics-progress-" + today() + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function importProgress(file, done) {
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var data = JSON.parse(fr.result);
        if (data.v !== 1) return done("הקובץ לא בפורמט המוכר.");
        merge(data);
        save();
        done(null);
      } catch (e) { done("לא הצלחתי לקרוא את הקובץ."); }
    };
    fr.onerror = function () { done("לא הצלחתי לפתוח את הקובץ."); };
    fr.readAsText(file);
  }

  function markDay() {
    var t = today();
    if (state.days.indexOf(t) === -1) state.days.push(t);
  }

  function currentStreak() {
    if (!state.days.length) return 0;
    var days = state.days.slice().sort();
    var last = days[days.length - 1];
    var gap = dayDiff(last, today());
    if (gap > 1) return 0;
    var run = 1;
    for (var i = days.length - 1; i > 0; i--) {
      if (dayDiff(days[i - 1], days[i]) === 1) run++;
      else break;
    }
    return run;
  }

  /* ---------------- spaced repetition (SM-2 lite) ---------------- */

  var STEPS = [1, 3, 7, 16, 35];

  function grade(id, good) {
    var s = state.cards[id] || { n: 0, due: null, seen: 0 };
    s.seen++;
    if (good) s.n = Math.min(s.n + 1, STEPS.length - 1);
    else s.n = 0;
    var d = new Date();
    d.setDate(d.getDate() + STEPS[s.n]);
    s.due = d.toISOString().slice(0, 10);
    s.last = good ? "ok" : "no";
    state.cards[id] = s;
  }

  // המיקום נגזר מהכרטיסיות שכבר נראו, ולא נשמר כאינדקס. כך אפשר להוסיף
  // שיעורים באמצע הקורס בלי שההתקדמות הקיימת תזוז למקום הלא נכון.
  function nextNewIndex() {
    for (var i = 0; i < ALL.length; i++) {
      if (!state.cards[ALL[i].card.id]) return i;
    }
    return ALL.length;
  }

  // כמה הכרטיסייה הזו "חלשה" אצלי — מזין את סדר התרגול
  function weakness(e) {
    var s = state.cards[e.card.id] || {};
    var w = Math.max(0, 5 - (s.n || 0)) * 10;
    if (s.last === "no") w += 100;
    if (s.due && s.due <= today()) w += 30;
    w += ((e.card.level || 1) - 1) * 8;
    return w;
  }

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function drillPool() {
    return ALL.filter(function (e) { return isQuiz(e.card) && state.cards[e.card.id]; });
  }

  function dueCards() {
    var t = today();
    return ALL.filter(function (e) {
      var s = state.cards[e.card.id];
      return s && s.due && s.due <= t;
    });
  }

  function masteryOf(unit) {
    var unitId = unit.id || unit;
    var cards = ALL.filter(function (e) { return e.unitId === unitId; });
    if (!cards.length) return null;
    // יחידה שנבנתה חלקית לא יכולה להיות "שולט" — עוד לא ראית את כל החומר שלה
    var partial = unit.plan && (unit.lessons || []).length < unit.plan;
    // "שולט" חייב להיות רף אמיתי: כל שאלה נענתה נכון, ושרדה חזרה מרווחת.
    // זה קורס ליבה לקבלה — "ראיתי את זה פעם" לא נחשב.
    var quiz = cards.filter(function (e) { return isQuiz(e.card); });
    var seen = 0, quizOk = 0, deep = 0;
    cards.forEach(function (e) { if (state.cards[e.card.id]) seen++; });
    quiz.forEach(function (e) {
      var s = state.cards[e.card.id];
      if (!s) return;
      if (s.last === "ok") quizOk++;
      if (s.n >= 3) deep++;
    });
    if (!seen) return { k: "none", label: "לא נגעתי" };
    if (seen < cards.length) return { k: "start", label: "באמצע" };
    if (quizOk < quiz.length) return { k: "start", label: "יש פערים" };
    if (deep < quiz.length) return { k: "solid", label: "יציב" };
    return partial
      ? { k: "solid", label: "שולט בנבנה" }
      : { k: "mast", label: "שולט" };
  }

  /* ---------------- session ---------------- */

  var S = null; // {queue, i, results:{}, startedAt}

  function buildSession(minutes, mode) {
    var budget = minutes === 0 ? 9999 : Math.max(1, Math.round(minutes * 2.2));

    // תרגול: רק שאלות, רק מחומר שכבר נלמד, החלשות קודם — ואז מערבבים.
    // השזירה מכוונת: במבחן צריך לזהות איזה כלי מתאים, לא רק להפעיל אותו.
    if (mode === "drill") {
      var pool = drillPool().sort(function (a, b) { return weakness(b) - weakness(a); });
      return shuffle(pool.slice(0, Math.max(1, Math.round(budget / 1.6))));
    }

    var picked = [], used = {};

    if (budget > 3) {
      dueCards().slice(0, Math.floor(budget * 0.35)).forEach(function (e) {
        picked.push(e); used[e.card.id] = 1;
      });
    }
    for (var i = nextNewIndex(); i < ALL.length && picked.length < budget; i++) {
      if (!used[ALL[i].card.id]) { picked.push(ALL[i]); used[ALL[i].card.id] = 1; }
    }
    // סיימת הכל — הסשן נהיה חזרה טהורה
    if (!picked.length) {
      picked = dueCards().slice(0, budget);
      if (!picked.length) picked = ALL.slice(Math.max(0, ALL.length - budget));
    }
    return picked;
  }

  function startSession(minutes, mode) {
    S = {
      queue: buildSession(minutes, mode),
      i: 0, results: {}, seq: [], requeued: {},
      given: {},              // מה נענה בכל כרטיסייה — כדי שחזרה אחורה תשחזר את המצב
      mode: mode || "learn"
    };
    markDay();
    render();
  }

  function advance(outcome) {
    var e = S.queue[S.i];
    if (outcome) S.results[e.card.id] = outcome;
    // השמה לפי אינדקס ולא push — אחרת חזרה אחורה וקדימה מכפילה רשומות
    S.seq[S.i] = outcome || "done";

    // "לא הבנתי" או תשובה שגויה — הכרטיסייה חוזרת בהמשך הסשן, לא נעלמת
    if ((outcome === "wrong" || outcome === "confused") && !S.requeued[e.card.id]) {
      S.requeued[e.card.id] = 1;
      var at = Math.min(S.i + 4, S.queue.length);
      S.queue.splice(at, 0, e);
      S.seq.splice(at, 0, undefined);
    }

    S.i++;
    save();
    render();
  }

  function back() {
    if (S.i > 0) { S.i--; render(); }
  }

  function endSession() {
    var right = 0, wrong = 0;
    Object.keys(S.results).forEach(function (k) {
      if (S.results[k] === "right") right++;
      if (S.results[k] === "wrong") wrong++;
    });
    state.history.push({
      d: today(),
      cards: S.seq.length,
      right: right,
      wrong: wrong
    });
    if (state.history.length > 60) state.history = state.history.slice(-60);

    // שיעור שהושלם במלואו נרשם לסיכומים
    var lessons = {};
    S.queue.slice(0, S.i).forEach(function (e) { lessons[e.lessonId] = 1; });
    Object.keys(lessons).forEach(function (lid) {
      var cards = ALL.filter(function (e) { return e.lessonId === lid; });
      var allSeen = cards.every(function (e) { return state.cards[e.card.id]; });
      if (allSeen && state.lessonsDone.indexOf(lid) === -1) state.lessonsDone.push(lid);
    });
    save();
  }

  /* ---------------- text ---------------- */

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  // מונחים לטיניים וגנוטיפים נשברים ב-RTL — מבודדים אותם.
  // החלופה הראשונה בתבנית מגינה על ישויות HTML (&quot; וחברותיה) מפני העטיפה.
  function markup(s) {
    var t = esc(s);
    t = t.replace(/&[a-zA-Z]+;|([A-Za-z][A-Za-z0-9']*)/g, function (m, word) {
      return word ? '<span class="ltr">' + word + "</span>" : m;
    });
    return t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }

  function fmt(s) {
    if (!s) return "";
    return markup(s).split(/\n\n+/).map(function (p) {
      return "<p>" + p.replace(/\n/g, "<br>") + "</p>";
    }).join("");
  }

  function inline(s) {
    return s ? markup(s) : "";
  }

  /* ---------------- tutor ---------------- */

  /* ---------------- "תסביר אחרת" ----------------
     ההסברים החלופיים כתובים מראש בתוך התוכן: עובדים אופליין, מיידית,
     ובאיכות שנבדקה. עדיף על קריאה ל-AI שדורשת רשת, חשבון והמתנה. */

  function tutorBar(entry) {
    var alts = entry.card.alt;
    if (!alts || !alts.length) return "";
    return '<div class="tutor"><div class="tutor-btns">' +
      '<button class="tutor-btn" data-alt="1">תסביר אחרת</button>' +
      '</div><div class="tutor-slot"></div></div>';
  }

  function wireTutor(root, entry) {
    var slot = root.querySelector(".tutor-slot");
    if (!slot) return;
    var alts = entry.card.alt || [];
    var i = 0;
    var btn = root.querySelector("[data-alt]");
    if (!btn) return;

    btn.addEventListener("click", function () {
      var a = alts[i % alts.length];
      i++;
      slot.innerHTML =
        '<div class="tutor-out"><div class="who">' + esc(a.title || "זווית אחרת") + "</div>" +
        fmt(a.text) + "</div>";
      btn.textContent = i % alts.length === 0 && alts.length > 1
        ? "חזרה להסבר הראשון"
        : alts.length > 1 ? "עוד דרך אחרת" : "תסביר אחרת";
    });
  }

  /* ---------------- card renderers ---------------- */

  var EYEBROW = {
    hook: "רגע",
    anchor: "התמונה",
    concept: "המושג",
    pitfall: "טעות נפוצה",
    example: "דוגמה",
    recap: "סיכום השיעור",
    mcq: "בדיקה",
    truefalse: "נכון או לא",
    punnett: "תרגול"
  };

  function renderCard(entry) {
    var c = entry.card;
    var wrap = document.createElement("div");
    wrap.className = "card " + c.type;
    var lvl = c.level >= 3 ? "רמת מבחן" : c.level === 2 ? "יישום" : "";
    var h = '<div class="eyebrow">' + (EYEBROW[c.type] || "") +
      (lvl ? '<span class="lvl' + (c.level >= 3 ? " exam" : "") + '">' + lvl + "</span>" : "") +
      "</div>";

    if (c.type === "hook") {
      h += '<h2 class="q">' + inline(c.text) + "</h2>";
      if (c.sub) h += '<div class="body">' + fmt(c.sub) + "</div>";
      wrap.innerHTML = h;
      return { el: wrap, actions: [{ t: "בוא נגלה", go: function () { grade(c.id, true); advance(); } }] };
    }

    if (c.type === "anchor" || c.type === "concept" || c.type === "example" || c.type === "pitfall") {
      if (c.term) h += '<h2 class="q">' + inline(c.term) + "</h2>";
      h += '<div class="body">' + fmt(c.text) + "</div>";
      if (c.rows) {
        h += '<div class="rows">' + c.rows.map(function (r) {
          return '<div class="row"><span class="key">' + esc(r[0]) + '</span><span class="val">' + inline(r[1]) + "</span></div>";
        }).join("") + "</div>";
      }
      if (c.work) {
        // העטיפה ב-span חיונית: ה-li הוא flex, ובלעדיה כל <strong> נהיה
        // פריט flex נפרד והמשפט מתפרק למילים מרוחקות
        h += '<ul class="work">' + c.work.map(function (w) {
          return "<li><span>" + inline(w) + "</span></li>";
        }).join("") + "</ul>";
      }
      if (c.stat) {
        h += '<div class="stat"><div class="v">' + esc(c.stat.value) + '</div><div class="l">' + inline(c.stat.label) + "</div></div>";
      }
      if (c.punch) h += '<div class="punch">' + inline(c.punch) + "</div>";
      if (c.note) h += '<div class="note">' + inline(c.note) + "</div>";

      var rec = S.given[c.id] || (S.given[c.id] = {});
      if (c.reveal) {
        h += '<div class="reveal"><div class="reveal-q">' + inline(c.reveal.q) + '</div><div class="reveal-slot"></div></div>';
      }
      h += tutorBar(entry);
      wrap.innerHTML = h;
      wireTutor(wrap, entry);

      function showReveal() {
        wrap.querySelector(".reveal-slot").innerHTML =
          '<div class="reveal-a">' + inline(c.reveal.a) + "</div>";
      }
      if (c.reveal && rec.revealed) showReveal();

      // חזרה אחורה וקדימה לא אמורה לנפח את מרווח החזרה — מדרגים רק על שינוי
      function mark(ok) {
        if (rec.graded !== ok) { rec.graded = ok; grade(c.id, ok); }
      }

      var acts;
      if (c.reveal) {
        acts = [{
          t: rec.revealed ? "הבנתי, הלאה" : "תשובה?",
          go: function (btn) {
            if (rec.revealed) { mark(true); advance(); return; }
            rec.revealed = true;
            showReveal();
            btn.textContent = "הבנתי, הלאה";
          }
        }];
      } else {
        acts = [{ t: "הבנתי, הלאה", go: function () { mark(true); advance(); } }];
      }
      acts.push({
        t: "לא הבנתי — תחזיר לי את זה", ghost: true,
        go: function () { mark(false); advance("confused"); }
      });
      return { el: wrap, actions: acts };
    }

    if (c.type === "recap") {
      h += '<h2 class="q">מה שלמדת עכשיו</h2>';
      h += '<ul class="recap-list">' + c.points.map(function (p) {
        return "<li><span>" + inline(p) + "</span></li>";
      }).join("") + "</ul>";
      if (c.next) h += '<div class="note">' + inline(c.next) + "</div>";
      wrap.innerHTML = h;
      return { el: wrap, actions: [{ t: "סיימתי את השיעור", go: function () { grade(c.id, true); advance(); } }] };
    }

    if (c.type === "mcq" || c.type === "truefalse") {
      var opts = c.type === "truefalse" ? ["נכון", "לא נכון"] : c.options;
      var correct = c.type === "truefalse" ? (c.correct ? 0 : 1) : c.correct;
      h += '<h2 class="q">' + inline(c.q) + "</h2>";
      h += '<div class="opts">' + opts.map(function (o, i) {
        return '<button class="opt" data-i="' + i + '"><span class="mark"></span><span>' + inline(o) + "</span></button>";
      }).join("") + '</div><div class="fb-slot"></div>';
      wrap.innerHTML = h;
      var rec = S.given[c.id] || (S.given[c.id] = {});

      function reveal(picked, replay) {
        var good = picked === correct;

        wrap.querySelectorAll(".opt").forEach(function (x) {
          var xi = +x.dataset.i;
          x.disabled = true;
          if (xi === correct) { x.classList.add("correct"); x.querySelector(".mark").textContent = "✓"; }
          else if (xi === picked) { x.classList.add("incorrect"); x.querySelector(".mark").textContent = "✕"; }
          else x.classList.add("dim");
        });

        var slot = wrap.querySelector(".fb-slot");
        slot.innerHTML = "";
        var why = c.type === "truefalse" ? c.why : c.why[picked];
        var fb = document.createElement("div");
        fb.className = "feedback " + (good ? "good" : "bad");
        fb.innerHTML = '<div class="head">' + (good ? "✓ נכון" : "✕ לא") + "</div>" + fmt(why);
        slot.appendChild(fb);

        if (!good && c.type !== "truefalse") {
          var right = document.createElement("div");
          right.className = "feedback good";
          right.innerHTML = '<div class="head">✓ התשובה הנכונה</div>' + fmt(c.why[correct]);
          slot.appendChild(right);
        }

        if (!wrap.querySelector(".tutor")) {
          var tb = document.createElement("div");
          tb.innerHTML = tutorBar(entry);
          if (tb.firstChild) { wrap.appendChild(tb.firstChild); wireTutor(wrap, entry); }
        }

        if (!replay) grade(c.id, good);
        setActions([{ t: "הלאה", go: function () { advance(good ? "right" : "wrong"); } }]);
      }

      wrap.querySelectorAll(".opt").forEach(function (b) {
        b.addEventListener("click", function () {
          if (rec.picked !== undefined) return;
          rec.picked = +b.dataset.i;
          reveal(rec.picked, false);
        });
      });

      // חזרת אחורה מציגה שוב את התשובה וההסבר, לא שאלה ריקה
      if (rec.picked !== undefined) setTimeout(function () { reveal(rec.picked, true); }, 0);

      return { el: wrap, actions: [] };
    }

    if (c.type === "punnett") {
      h += '<h2 class="q">' + inline(c.q) + "</h2>";
      var COLS = c.top.length, ROWS = c.side.length, N = COLS * ROWS;
      var fixed = c.prefill || {};   // אינדקסים שמגיעים ממולאים ולא ניתנים לעריכה
      h += '<div class="pn-wrap"><div class="pn' + (COLS > 2 ? " wide" : "") +
        '" style="grid-template-columns:34px repeat(' + COLS + ',1fr)">';
      h += '<div class="hd"></div>';
      c.top.forEach(function (t) { h += '<div class="hd">' + esc(t) + "</div>"; });
      c.side.forEach(function (sd, r) {
        h += '<div class="hd">' + esc(sd) + "</div>";
        c.top.forEach(function (t, col) {
          var i = r * COLS + col;
          h += '<button class="cell' + (fixed[i] ? " fixed" : "") + '" data-i="' + i + '"' +
            (fixed[i] ? " disabled" : "") + "></button>";
        });
      });
      h += "</div></div>";
      h += '<div class="chips">' + c.chips.map(function (ch) {
        return '<button class="chip" data-chip="' + esc(ch) + '">' + esc(ch) + "</button>";
      }).join("") + "</div>";
      h += '<div class="help">' + inline(c.help || "") + '</div><div class="fb-slot"></div>';
      wrap.innerHTML = h;

      var cells = wrap.querySelectorAll(".cell");
      var rec = S.given[c.id] || (S.given[c.id] = {});
      var vals = rec.vals ? rec.vals.slice() : new Array(N).fill(null);
      Object.keys(fixed).forEach(function (i) { vals[i] = fixed[i]; });
      var sel = 0;
      while (sel < N && fixed[sel]) sel++;
      var checked = false;

      function paint() {
        cells.forEach(function (el, i) {
          el.classList.toggle("sel", i === sel && !checked);
          el.classList.toggle("filled", !!vals[i]);
          if (!checked) el.textContent = vals[i] || "";
        });
        if (checked) return;
        var full = vals.every(Boolean);
        setActions(full && !checked
          ? [{ t: "בדוק את הריבוע", go: function () { check(false); } }]
          : [{ t: "בדוק את הריבוע", disabled: true, go: function () {} }]);
      }

      function nextEmpty(from) {
        for (var k = 1; k <= N; k++) {
          var i = (from + k) % N;
          if (!vals[i]) return i;
        }
        return from;
      }

      cells.forEach(function (el, i) {
        el.addEventListener("click", function () {
          if (checked || fixed[i]) return;
          sel = i;
          paint();
        });
      });

      wrap.querySelectorAll("[data-chip]").forEach(function (b) {
        b.addEventListener("click", function () {
          if (checked) return;
          vals[sel] = b.dataset.chip;
          sel = nextEmpty(sel);
          paint();
        });
      });

      function check(replay) {
        checked = true;
        rec.vals = vals.slice();
        rec.checked = true;
        var allRight = true;
        cells.forEach(function (el, i) {
          var r = Math.floor(i / COLS), col = i % COLS;
          var want = c.solution[r][col];
          var got = vals[i];
          var ph = c.pheno[want];
          el.classList.remove("sel");
          el.innerHTML = '<span>' + esc(want) + '</span><span class="ph">' + esc(ph.label) + "</span>";
          el.classList.add(ph.kind === "no" ? "no" : ph.kind === "mid" ? "mid" : "ok");
          if (!fixed[i] && got !== want) { allRight = false; el.classList.add("err"); }
          if (fixed[i]) el.classList.add("fixed");
        });
        wrap.querySelectorAll("[data-chip]").forEach(function (b) { b.disabled = true; });
        wrap.querySelector(".help").textContent = allRight
          ? "מילאת את כולן נכון."
          : "המשבצות המסומנות היו שונות ממה שמילאת — הריבוע המלא למעלה.";

        var slot = wrap.querySelector(".fb-slot");
        slot.innerHTML = "";
        var fb = document.createElement("div");
        fb.className = "feedback " + (allRight ? "good" : "bad");
        fb.innerHTML = '<div class="head">' + (allRight ? "✓ מדויק" : "כמעט") + "</div>" + fmt(c.after);
        slot.appendChild(fb);

        if (!wrap.querySelector(".tutor")) {
          var tb = document.createElement("div");
          tb.innerHTML = tutorBar(entry);
          if (tb.firstChild) { wrap.appendChild(tb.firstChild); wireTutor(wrap, entry); }
        }

        if (!replay) grade(c.id, allRight);
        setActions([{ t: "הלאה", go: function () { advance(allRight ? "right" : "wrong"); } }]);
      }

      // חזרה אחורה מציגה את הריבוע הפתור, לא ריבוע ריק
      setTimeout(function () { if (rec.checked) check(true); else paint(); }, 0);
      return { el: wrap, actions: [{ t: "בדוק את הריבוע", disabled: true, go: function () {} }] };
    }

    wrap.innerHTML = h + '<div class="body">' + fmt(c.text || "") + "</div>";
    return { el: wrap, actions: [{ t: "הלאה", go: function () { advance(); } }] };
  }

  /* ---------------- screens ---------------- */

  var actionsEl = null;

  function setActions(list) {
    if (!actionsEl) return;
    actionsEl.innerHTML = "";
    list.forEach(function (a) {
      var b = document.createElement("button");
      b.className = "btn" + (a.ghost ? " ghost" : "");
      b.textContent = a.t;
      if (a.disabled) b.disabled = true;
      b.addEventListener("click", function () { a.go(b); });
      actionsEl.appendChild(b);
    });
  }

  function screenHome() {
    var at = nextNewIndex();
    var next = ALL[Math.min(at, ALL.length - 1)];
    var done = at >= ALL.length;
    var due = dueCards().length;
    var seen = Object.keys(state.cards).length;

    var h = '<div class="hero">' +
      '<div class="kicker">' + esc(COURSE.title) + "</div>" +
      "<h1>מסלול גנטיקה</h1>" +
      '<div class="where">' + (seen
        ? "ראית " + seen + " כרטיסיות מתוך " + ALL.length + " שנבנו עד כה."
        : "18 כרטיסיות מוכנות. אפשר להתחיל עם אחת.") +
      "</div></div>";

    h += '<div class="resume">' +
      '<div class="lbl">' + (done ? "חזרה על" : at > 0 ? "ממשיכים מ" : "מתחילים ב") + "</div>" +
      '<div class="ttl">' + esc(next.lessonTitle) + "</div>" +
      '<div class="meta">' + esc(next.unitTitle) +
        (at > 0 && !done ? " · כרטיסייה " + (next.idxInLesson + 1) + " מתוך " + next.lessonLen : "") +
        (due ? " · " + due + " לחזרה" : "") +
      "</div>" +
      '<button class="btn" id="go-one">רק כרטיסייה אחת</button>' +
      '<div class="times">' +
        '<button class="time" data-min="5"><span class="n">5</span><span class="u">דקות</span></button>' +
        '<button class="time" data-min="15"><span class="n">15</span><span class="u">דקות</span></button>' +
        '<button class="time" data-min="30"><span class="n">30</span><span class="u">דקות</span></button>' +
        '<button class="time" data-min="0"><span class="n">∞</span><span class="u">עד שנמאס</span></button>' +
      "</div></div>";

    var pool = drillPool();
    if (pool.length >= 4) {
      var shaky = pool.filter(function (e) {
        var st = state.cards[e.card.id];
        return st && (st.last === "no" || st.n < 2);
      }).length;
      h += '<div class="resume">' +
        '<div class="lbl">תרגול בלבד</div>' +
        '<div class="ttl">' + pool.length + " שאלות מכל מה שלמדת</div>" +
        '<div class="meta">בלי כרטיסיות הוראה, מעורבב בין נושאים' +
          (shaky ? " · " + shaky + " עדיין לא יציבות" : "") + "</div>" +
        '<div class="row2">' +
        '<button class="btn ghost" data-drill="10">10 דקות</button>' +
        '<button class="btn ghost" data-drill="0">הכל</button>' +
        "</div></div>";
    }

    var streak = currentStreak();
    function tile(n, label) {
      return '<div><div class="n">' + n + '</div><div class="l">' + label + "</div></div>";
    }
    h += '<div class="streak">' +
      tile(streak, streak === 1 ? "יום ברצף" : "ימים ברצף") +
      tile(state.days.length, "ימי לימוד") +
      tile(seen, "כרטיסיות שראית") +
      "</div>";

    h += '<div class="section-title">מפת הקורס</div><div id="map"></div>';

    h += '<div class="section-title">העברת התקדמות</div>' +
      '<p class="fineprint">ההתקדמות נשמרת במכשיר הזה בלבד. כדי להמשיך במכשיר אחר — ' +
      'ייצא קובץ כאן, וייבא אותו שם.</p>' +
      '<div class="row2">' +
      '<button class="btn ghost" id="exp">ייצא לקובץ</button>' +
      '<button class="btn ghost" id="imp">ייבא מקובץ</button>' +
      '</div><input type="file" id="impfile" accept="application/json,.json" hidden>' +
      '<p class="fineprint" id="iomsg"></p>';

    if (saveFailed) {
      h += '<p class="fineprint warn">הדפדפן חוסם שמירה מקומית, אז ההתקדמות לא נשמרת ' +
        'בין ביקורים. קורה בגלישה פרטית.</p>';
    }

    h += '<div style="height:28px"></div>';

    app.innerHTML = h;

    app.querySelector("#go-one").addEventListener("click", function () { startSession(0.46); });
    app.querySelectorAll("[data-min]").forEach(function (b) {
      b.addEventListener("click", function () { startSession(+b.dataset.min); });
    });
    app.querySelectorAll("[data-drill]").forEach(function (b) {
      b.addEventListener("click", function () { startSession(+b.dataset.drill, "drill"); });
    });

    var msg = app.querySelector("#iomsg");
    var picker = app.querySelector("#impfile");
    app.querySelector("#exp").addEventListener("click", function () {
      exportProgress();
      msg.textContent = "הקובץ ירד. העבר אותו למכשיר השני וייבא שם.";
    });
    app.querySelector("#imp").addEventListener("click", function () { picker.click(); });
    picker.addEventListener("change", function () {
      if (!picker.files || !picker.files[0]) return;
      importProgress(picker.files[0], function (err) {
        if (err) { msg.textContent = err; msg.classList.add("warn"); return; }
        render();
      });
    });

    renderMap(app.querySelector("#map"));
  }

  function renderMap(el) {
    var h = "";
    COURSE.units.forEach(function (u, i) {
      var n = (u.lessons || []).length;
      var plan = u.plan || n;
      var m = n ? masteryOf(u) : null;
      var badge = n
        ? '<span class="st ' + m.k + '">' + m.label + "</span>"
        : '<span class="st none">טרם נבנה</span>';
      h += '<div class="unit">' +
        '<span class="idx">' + String(i + 1).padStart(2, "0") + "</span>" +
        '<span class="nm">' + esc(u.title) +
          "<small>" + (n < plan
            ? '<span class="partial">' + n + " מתוך " + plan + " שיעורים נבנו</span> · "
            : "") +
          "עמ' " + esc(u.pages) +
          (u.optional ? " · " + esc(u.optionalNote) : "") + "</small></span>" +
        badge + "</div>";
    });
    el.innerHTML = h;

    if (state.lessonsDone.length) {
      var box = document.createElement("div");
      var parts = "";
      state.lessonsDone.forEach(function (lid) {
        var entry = ALL.filter(function (e) { return e.lessonId === lid; })[0];
        if (!entry) return;
        var recap = ALL.filter(function (e) {
          return e.lessonId === lid && e.card.type === "recap";
        })[0];
        if (!recap) return;
        parts += '<div class="learned"><h3>' + esc(entry.lessonTitle) + "</h3><ul>" +
          recap.card.points.map(function (p) { return "<li>" + inline(p) + "</li>"; }).join("") +
          "</ul></div>";
      });
      if (parts) {
        box.innerHTML = '<div class="section-title">מה שלמדתי עד עכשיו</div>' + parts;
        el.parentNode.insertBefore(box, el.nextSibling);
      }
    }
  }

  function screenSession() {
    if (S.i >= S.queue.length) { endSession(); return screenRecap(); }

    var entry = S.queue[S.i];
    var rendered = renderCard(entry);

    var h = '<div class="topbar">' +
      '<button class="iconbtn" id="quit" aria-label="סיום">✕</button>' +
      '<div class="grow"><h1>' + esc(S.mode === "drill" ? "תרגול" : entry.lessonTitle) + "</h1>" +
      '<div class="sub">' + esc(S.mode === "drill" ? entry.lessonTitle : entry.unitTitle) + "</div></div>" +
      '<div class="sub counter">' + (S.i + 1) + " / " + S.queue.length + "</div>" +
      '<button class="iconbtn" id="back" aria-label="הכרטיסייה הקודמת"' +
        (S.i === 0 ? " disabled" : "") + ">→</button></div>";

    h += '<div class="strip">' + S.queue.map(function (_, i) {
      var cls = "seg";
      if (i === S.i) cls += " current";
      else if (i < S.i) {
        var o = S.seq[i];
        cls += o === "right" ? " right" : (o === "wrong" || o === "confused") ? " wrong" : " done";
      }
      return '<div class="' + cls + '"></div>';
    }).join("") + "</div>";

    h += '<main id="slot"></main><div class="actions" id="acts"></div>';
    app.innerHTML = h;

    app.querySelector("#slot").appendChild(rendered.el);
    actionsEl = app.querySelector("#acts");
    setActions(rendered.actions);

    app.querySelector("#quit").addEventListener("click", function () {
      if (S.i > 0) { endSession(); screenRecap(); }
      else { S = null; render(); }
    });
    app.querySelector("#back").addEventListener("click", back);

    // חצים במקלדת — נוח בלימוד ארוך במחשב
    document.onkeydown = function (ev) {
      if (ev.key === "ArrowRight" && S && S.i > 0) back();
    };

    window.scrollTo(0, 0);
  }

  function screenRecap() {
    var right = 0, wrong = 0, topics = {};
    S.queue.slice(0, S.i).forEach(function (e) {
      var o = S.results[e.card.id];
      if (o === "right") right++;
      if (o === "wrong") wrong++;
      topics[e.lessonTitle] = 1;
    });

    var weak = S.queue.slice(0, S.i).filter(function (e) {
      var o = S.results[e.card.id];
      return o === "wrong" || o === "confused";
    });

    var h = '<div class="topbar"><div class="grow"><h1>סיכום הסשן</h1>' +
      '<div class="sub">' + esc(today()) + "</div></div></div>";

    h += '<main><div class="card">';
    h += '<div class="eyebrow">מה עשית עכשיו</div>';
    h += '<h2 class="q">' + S.i + " כרטיסיות" + (right + wrong ? ", " + right + " מתוך " + (right + wrong) + " נכון" : "") + "</h2>";

    h += '<div class="body"><p>כיסית: <strong>' + Object.keys(topics).map(esc).join(", ") + "</strong></p></div>";

    if (weak.length) {
      h += '<div class="note"><strong>מה שכדאי לחזור עליו:</strong><br>' +
        weak.slice(0, 3).map(function (e) {
          var raw = e.card.term || e.card.q || e.card.text || "";
          if (raw.length > 110) raw = raw.slice(0, 110).replace(/\s\S*$/, "") + "…";
          return "· " + inline(raw);
        }).join("<br>") +
        "<br><br>הכרטיסיות האלה כבר מתוזמנות לחזרה — הן יחזרו אליך מעצמן.</div>";
    } else if (right) {
      h += '<div class="note">לא פספסת כלום. הכרטיסיות האלה יחזרו לחזרה בעוד כמה ימים, כדי שהחומר יישאר.</div>';
    }

    var streak = currentStreak();
    h += '<div class="stat"><div class="v">' + streak + '</div><div class="l">' +
      (streak === 1 ? "היום התחלת" : "ימים ברצף") + "</div></div>";

    h += "</div></main>";
    h += '<div class="actions">' +
      '<button class="btn" id="more">עוד 5 דקות</button>' +
      '<button class="btn ghost" id="home">סיימתי להיום</button></div>';

    app.innerHTML = h;
    app.querySelector("#more").addEventListener("click", function () { startSession(5); });
    app.querySelector("#home").addEventListener("click", function () { S = null; render(); });
    window.scrollTo(0, 0);
  }

  function render() {
    if (S) screenSession();
    else screenHome();
  }

  /* ---------------- go ---------------- */

  loadLocal();
  render();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {
        /* בלי service worker האפליקציה עדיין עובדת, פשוט לא אופליין */
      });
    });
  }
})();
</script>
</body>
</html>
