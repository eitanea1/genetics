מו כל חולה אחר.**","alt":[{"title":"למה זה לא שובר את הכלל","text":"הכלל אומר: לחולה יש הורה חולה. הוא נכון כי המחלה **עוברת**.\n\nדה-נובו זה הרגע שבו המחלה **מתחילה** — הפרט הראשון בשושלת. אצלו אין הורה חולה כי לפניו לא היה כלום.\n\nכל צאצא שלו כבר יציית לכלל."}]},{"id":"d1-example-achondroplasia","type":"example","text":"**אכונדרופלזיה** (גמדות) היא אוטוזומלית דומיננטית — מוטציה שפוגעת בהתפתחות העצמות.\n\nמה שמיוחד בה: הגנוטיפ **AA קטלני**. עובר עם שני עותקים פגומים לא מגיע ללידה.","work":["**AA** — לא נולד כלל","**Aa** — גמד","**aa** — גובה רגיל"],"note":"ולכן בהכלאה בין שני גמדים (Aa × Aa) התוצאה על הנייר היא 25% / 50% / 25% — אבל רבע מהעוברים אינם מגיעים ללידה."},{"id":"d1-mcq-lethal","type":"mcq","level":3,"q":"שני גמדים (Aa × Aa) מביאים ילדים. מבין **הילדים שנולדו**, מה היחס?","options":["1/4 גמד, 3/4 בגובה רגיל","2/3 גמד, 1/3 בגובה רגיל","1/2 גמד, 1/2 בגובה רגיל","3/4 גמד, 1/4 בגובה רגיל"],"correct":1,"why":["היחס הפוך, וגם לא לוקח בחשבון את המשבצת הקטלנית.","נכון. מארבע המשבצות, AA לא נולד ויורד מהחשבון. נשארות שלוש: **שני Aa (גמד) ואחד aa** — כלומר 2/3 ו-1/3.","חצי-חצי היה מתקבל בהכלאת מבחן, לא כאן.","3/4 היה היחס אילו AA היה בר-קיימא — 3 חולים מתוך 4."]},{"id":"d1-pitfall-stats","type":"pitfall","text":"**50% הוא הסתברות, לא מכסה.**\n\nבאילן יוחסין אמיתי תראה לעיתים משפחה עם ארבעה ילדים שכולם חולים, או כולם בריאים. זה לא סותר את הדפוס.","punch":"לכל היריון בנפרד יש 50%. משפחות אנושיות קטנות מדי מכדי שהיחס התיאורטי יתגלה בהן — הוא מופיע רק על פני אוכלוסייה גדולה."},{"id":"d1-mcq-screening","type":"mcq","level":2,"q":"למה בדיקות סקר גנטיות באוכלוסייה מחפשות מחלות **רצסיביות** ולא דומיננטיות?","options":["מחלות דומיננטיות פחות חמורות","במחלה דומיננטית יש כבר היסטוריה משפחתית ידועה, אז בודקים ממוקד","אי אפשר לזהות מחלות דומיננטיות בבדיקה","מחלות דומיננטיות נדירות מדי"],"correct":1,"why":["חומרה לא קשורה. יש מחלות דומיננטיות קשות מאוד.","נכון. מחלה דומיננטית **מופיעה בכל דור וידועה למשפחה**, ולכן היא מטופלת בבדיקה ממוקדת. סקר נועד למנוע דווקא את **ההפתעה** — ילד חולה לשני הורים בריאים, שזו התבנית הרצסיבית.","בהחלט אפשר, ועושים זאת כשיש חשד.","נדירות אינה השיקול. מחלות רצסיביות שבודקים בסקר נדירות אף הן."]},{"id":"d1-recap","type":"recap","points":["**אוטוזומלי דומיננטי**: האלל הפגום דומיננטי, עותק אחד מספיק. AA/Aa חולים, aa בריא.","סימני הזיהוי: **חולים בכל דור**, לכל חולה יש **הורה חולה**, ו**גברים ונשים באותה שכיחות**. הורה הטרוזיגוט → 50%.","**דה-נובו** מסביר חולה יחיד להורים בריאים — מוטציה חדשה בתא מין. כשהגנוטיפ הכפול קטלני (אכונדרופלזיה), היחס בין הנולדים הוא 2/3 ל-1/3."],"next":"עכשיו הדפוס ההפוך: מחלה שמדלגת על דורות שלמים ומופיעה פתאום במשפחה בלי היסטוריה."}]},{"id":"pat-02","title":"אוטוזומלי רצסיבי: המחלה שמדלגת","estMinutes":12,"source":"שיעור 7, עמ' 19–21","cards":[{"id":"d2-hook","type":"hook","text":"אין במשפחה אף חולה. לא בדור הקודם, לא בזה שלפניו.","sub":"ואז נולד ילד חולה. איך משהו מופיע יש מאין — ולמה זה קורה יותר כששני ההורים בני משפחה?"},{"id":"d2-concept-ar","type":"concept","term":"אוטוזומלי רצסיבי","text":"כאן המצב הרגיל שהתרגלנו אליו: **האלל הפגום רצסיבי**, וצריך שניים כדי לחלות.","rows":[["AA","בריא"],["Aa","בריא — **נשא**"],["aa","חולה"]],"note":"יש כאן ודאות שאין בהורשה דומיננטית: **פרט חולה הוא בהכרח aa.** בהורשה דומיננטית חולה יכול להיות AA או Aa, וכאן אין ספק בכלל."},{"id":"d2-concept-skip","type":"concept","term":"למה זה מדלג על דורות","text":"כדי שייוולד ילד חולה צריך ש**שני** ההורים יתרמו את האלל הפגום. שניהם בריאים לגמרי, ואף אחד מהם לא יודע.\n\nהאלל יכול לעבור בשקט דורות שלמים בלי להתבטא — עד שנשא פוגש נשאית.","rows":[["שני נשאים","25% חולים · 50% נשאים · 25% תקינים"],["נשא × תקין","**אף ילד חולה**, 50% נשאים"],["חולה × נשא","50% חולים"],["חולה × חולה","100% חולים"]],"note":"**הורים בריאים לילד חולה הם בהכרח נשאים — שניהם.** זו מסקנה ודאית, ומשתמשים בה כל הזמן בייעוץ גנטי."},{"id":"d2-concept-signs","type":"concept","term":"סימני הזיהוי","text":"התבנית ההפוכה בדיוק לזו של הדומיננטי:","rows":[["1","המחלה **מדלגת על דורות**"],["2","**להורים של חולה אין את המחלה** — הם נשאים"],["3","**גברים ונשים באותה שכיחות** — הגן אוטוזומלי"],["4","לרוב **אין היסטוריה משפחתית** כלל"],["5","**נישואי קרובים מעלים את הסיכון** משמעותית"]],"note":"סימנים 1 ו-2 הם ההפך הגמור מאוטוזומלי דומיננטי. **סימן 3 זהה בשניהם** — ובדיוק הוא זה שיפריד בהמשך בין אוטוזומלי לתפוס X."},{"id":"d2-mcq-carriers","type":"mcq","q":"לזוג בריא נולד ילד עם מחלה אוטוזומלית רצסיבית. מה בהכרח נכון לגבי ההורים?","options":["אחד מהם נשא","שניהם נשאים","אחד מהם חולה בצורה קלה","קרתה מוטציה חדשה"],"correct":1,"why":["לא מספיק. הילד חייב **שני** אללים פגומים, אחד מכל הורה.","נכון. **שניהם Aa בהכרח** — אין דרך אחרת שהילד יקבל שני אללים פגומים.","אין \"מחלה קלה\" בהורשה רצסיבית. נשא בריא לחלוטין.","דה-נובו אפשרי תיאורטית אך נדיר מאוד, וכאן שני האללים היו צריכים להשתנות בו-זמנית."]},{"id":"d2-concept-consanguinity","type":"concept","term":"למה נישואי קרובים מעלים סיכון","text":"אלל רצסיבי נדיר מסתובב במשפחה מסוימת. הסיכוי שאדם אקראי מהאוכלוסייה נושא אותו — קטן.\n\nאבל **בן משפחה נושא אותו בסיכוי גבוה בהרבה**, כי הוא מגיע מאותו מאגר גנים.","note":"ולכן הסיכון להולדת ילד חולה במחלה רצסיבית גבוה משמעותית בנישואין בין קרובי משפחה. **זה נכון רק למחלות רצסיביות** — בדומיננטיות אין לזה משמעות, שם ממילא מספיק אלל אחד.","alt":[{"title":"החשבון בקצרה","text":"כדי שייוולד ילד חולה, צריך ששני ההורים יישאו את **אותו אלל נדיר** בדיוק.\n\nעם זר מהרחוב זה צירוף מקרים. עם בן דוד — שניכם שאבתם מאותה סבתא, וזה כבר לא מקרי בכלל."}]},{"id":"d2-example-pku","type":"example","text":"**פנילקטונוריה (PKU)** — אוטוזומלית רצסיבית, ומקרה יוצא דופן שכדאי להכיר.\n\nהאנזים **פנילאלאנין הידרוקסילאז** אמור לפרק את חומצת האמינו פנילאלאנין לטירוזין. במחלה האנזים פגום:","work":["הפנילאלאנין לא מתפרק ו**מצטבר**","ההצטברות הורסת תאי עצב","התוצאה: **פיגור שכלי** — והנזק מתחיל בימים הראשונים לחיים"],"note":"וכאן הפינה המיוחדת: **הנזק נגרם מגורם סביבתי — מה שאוכלים.** אם מונעים כניסת פנילאלאנין לגוף, אין הצטברות ואין נזק. בישראל עושים לכל תינוק בדיקת סקר, ומי שנמצא חולה מתחיל **מהיום הראשון** דיאטה נטולת פנילאלאנין, לכל החיים."},{"id":"d2-mcq-pku","type":"mcq","level":3,"q":"מה עושה את PKU יוצאת דופן בין המחלות הגנטיות?","options":["היא נרפאת עם הזמן","הנזק ניתן למניעה מלאה על ידי שינוי סביבתי, למרות שהגנוטיפ לא משתנה","היא היחידה שמאובחנת בבדיקת סקר","היא עוברת רק מהאם"],"correct":1,"why":["לא. הגנוטיפ נשאר, והדיאטה נדרשת לכל החיים.","נכון. **הגנוטיפ לא מטופל — הפנוטיפ נמנע.** בלי פנילאלאנין במזון אין הצטברות ואין נזק. זו דוגמה מושלמת לכך שפנוטיפ אינו נקבע רק על ידי גנים.","יש בדיקות סקר לילודים למחלות נוספות.","היא אוטוזומלית — עוברת משני ההורים במידה שווה."]},{"id":"d2-example-tay-sachs","type":"example","text":"**טיי־זקס** — אוטוזומלית רצסיבית, והפעם בלי סוף טוב.\n\nהאנזים **הקסוזאמינידאז** אמור לפרק סוג מסוים של שומן בליזוזום. במחלה הוא פגום:","work":["השומן **מצטבר** בתאים, בעיקר בנוירונים","התאים מתים","נסיגה התפתחותית שמתחילה סביב **גיל חצי שנה** — מוטורית ושכלית"],"note":"שים לב לתבנית החוזרת: **אנזים פגום ← חומר מצטבר ← נזק.** ראית אותה בלבקנות, ב-PKU וכאן. זו התבנית של רוב מחלות המטבוליזם, וכולן רצסיביות מאותה סיבה — חצי אנזים מספיק."},{"id":"d2-mcq-quarter","type":"mcq","level":2,"q":"אישה חולה במחלה אוטוזומלית רצסיבית מתחתנת עם גבר שהוא נשא. מה הסיכון לכל ילד?","options":["25%","50%","75%","100%"],"correct":1,"why":["25% מתקבל כששני ההורים נשאים. כאן אחד מהם חולה.","נכון. האם aa ונותנת a תמיד. האב Aa ונותן a בחצי מהמקרים. **התוצאה: 50% aa.**","75% לא מתקבל בשום צירוף בהורשה רצסיבית.","100% היה נכון אילו שני ההורים היו חולים."]},{"id":"d2-recap","type":"recap","points":["**אוטוזומלי רצסיבי**: חולה הוא תמיד **aa**, והוריו הבריאים הם בהכרח **שני נשאים**.","סימני הזיהוי: **מדלג על דורות**, אין היסטוריה משפחתית, **גברים ונשים בשווה**, ו**נישואי קרובים מעלים סיכון**.","התבנית של מחלות מטבוליות: **אנזים פגום ← חומר מצטבר ← נזק.** ב-PKU אפשר למנוע את הנזק בדיאטה, למרות שהגן לא משתנה."],"next":"שני הדפוסים שראינו פוגעים בגברים ובנשים בשווה. בשיעור הבא נחזור לכרומוזום X — ושם השוויון הזה נשבר."}]},{"id":"pat-03","title":"תפוס X: רצסיבי ודומיננטי","estMinutes":13,"source":"שיעור 7–8, עמ' 21–24","cards":[{"id":"d3-hook","type":"hook","text":"באילן היוחסין כל החולים הם גברים. אף אישה חולה, לאורך ארבעה דורות.","sub":"ובעץ אחר, ההפך הגמור: אב חולה שכל בנותיו חולות ואף בן שלו אינו. שני דפוסים שונים — שניהם על X."},{"id":"d3-concept-xr","type":"concept","term":"תפוס X רצסיבי","text":"האלל הפגום רצסיבי ויושב על X. וכאן ההמיזיגוטיות של הגבר משנה הכל:","rows":[["XR Y","גבר בריא"],["Xr Y","גבר **חולה** — עותק אחד מספיק, אין גיבוי"],["XR XR","אישה בריאה"],["XR Xr","אישה **נשאית** — בריאה"],["Xr Xr","אישה חולה — דורש אלל פגום **משני** ההורים"]],"note":"כדי שאישה תחלה, אביה חייב להיות חולה **וגם** אמה נשאית לפחות. הצירוף הזה נדיר — ולכן נראה כמעט רק גברים חולים.","alt":[{"title":"למה זה כל כך לא מאוזן","text":"לגבר צריך לקרות דבר אחד: לקבל Xr מאמא.\nלאישה צריכים לקרות **שני** דברים: Xr מאמא **וגם** Xr מאבא.\n\nשני תנאים במקום אחד. לפי חוק המכפלה, זה הרבה פחות סביר — וזו כל האסימטריה."}]},{"id":"d3-concept-xr-signs","type":"concept","term":"סימני הזיהוי של תפוס X רצסיבי","text":"שלושה סימנים, והשלישי הוא הכי חד:","rows":[["1","**הרבה יותר גברים חולים** מנשים"],["2","המחלה מגיעה לבן **תמיד מהאם**"],["3","**אין העברה מאב לבן**, לעולם"]],"note":"סימן 3 הוא כלי הפסילה החזק ביותר בכל הפרק. **ראית אב חולה ובן חולה? זו אינה הורשה תפוסת X.** האב נותן לבן Y בלבד.","alt":[{"title":"התבנית שקופצת לעין","text":"המחלה מדלגת בזיגזג: **סבא חולה ← בת נשאית ← נכד חולה.**\n\nהיא עוברת דרך הנשים ומתבטאת אצל הגברים. אם ראית את הקפיצה הזו בעץ, אתה כמעט בטוח בתשובה."}]},{"id":"d3-punnett-xr","type":"punnett","q":"גבר עיוור צבעים (XrY) ואישה שאינה נשאית (XRXR). מלא את הריבוע.","help":"למעלה הגמטות של האב, בצד של האם.","top":["Xr","Y"],"side":["XR","XR"],"chips":["XRXr","XRY","XrY","XRXR"],"solution":[["XRXr","XRY"],["XRXr","XRY"]],"pheno":{"XRXr":{"label":"בת נשאית","kind":"mid"},"XRY":{"label":"בן בריא","kind":"ok"}},"after":"**כל הבנות נשאיות, כל הבנים בריאים.** האב מעביר את ה-Xr שלו לכל בנותיו — ולאף אחד מבניו. לכן המחלה תדלג על הדור הזה ותופיע אצל הנכדים."},{"id":"d3-mcq-xr","type":"mcq","level":2,"q":"אם נשאית לעיוורון צבעים (XRXr) ואב בריא. מה הסיכוי שהבן הבא יהיה עיוור צבעים?","options":["25%","50%","75%","100%"],"correct":1,"why":["25% מתקבל אם שואלים על **כלל הילדים** — חצי מהם בנים, וחצי מהבנים חולים. אבל השאלה מנוסחת על בן.","נכון. הבן מקבל Y מאבא ו-X מאמא. לאם יש XR ו-Xr בסיכוי שווה — **50% לבן חולה.**","75% לא מופיע בדפוס הזה.","100% היה נכון אילו האם הייתה חולה (XrXr)."]},{"id":"d3-example-xr-diseases","type":"example","text":"שלוש מחלות דגל תפוסות X רצסיביות, וכולן מדגימות את אותו דפוס:","work":["**עיוורון צבעים** (אדום־ירוק) — הנפוצה ביותר, כ-8% מהגברים","**דושן** — פגיעה בחלבון ששומר על שלמות תאי השריר","**חוסר G6PD** (רגישות לפול) — חוסר באנזים, עם רמות ביטוי משתנות"],"note":"בדושן, בזכות השתקת X, **נשאיות לפעמים סובלות מחולשה מסוימת** ולא בריאות לגמרי. אבל ברמת הקורס ובשאלות המבחן — **נקבה הטרוזיגוטית במחלה רצסיבית תפוסת X נחשבת בריאה.**"},{"id":"d3-concept-xd","type":"concept","term":"תפוס X דומיננטי","text":"עכשיו הגן על X, אבל האלל הפגום **דומיננטי**. מספיק עותק אחד — ולכן גם אישה הטרוזיגוטית תהיה חולה.","rows":[["XA Y","גבר חולה"],["XA Xa","אישה **חולה** — עותק אחד מספיק"],["Xa Y","גבר בריא"],["Xa Xa","אישה בריאה"]],"note":"כאן **אין מצב של נשאית**. אישה שנושאת את האלל — חולה. זה ההבדל המהותי מהדפוס הקודם."},{"id":"d3-concept-xd-signs","type":"concept","term":"החתימה הייחודית של תפוס X דומיננטי","text":"בדפוס הזה **חשוב מאוד איזה הורה חולה** — כל אפשרות נותנת תוצאה אחרת לגמרי:","rows":[["אב חולה","**כל** בנותיו חולות · **אף** בן אינו חולה"],["אם חולה (הטרוזיגוטית)","50% מהילדים חולים — בנים ובנות בשווה"],["אם חולה הומוזיגוטית","כל הילדים חולים"]],"note":"השורה הראשונה היא **הסימן הכי מובהק בכל הפרק**. אב חולה שכל בנותיו חולות ואף בן שלו אינו — זו חתימה שאין לה תחליף. הסיבה פשוטה: הוא נותן את ה-X היחיד שלו לכל בנותיו, ולבנים רק Y."},{"id":"d3-mcq-xd","type":"mcq","level":3,"q":"אב חולה, אם בריאה. יש להם 3 בנות — כולן חולות, ו-2 בנים — שניהם בריאים. איזה דפוס?","options":["אוטוזומלי דומיננטי","תפוס X דומיננטי","תפוס X רצסיבי","אוטוזומלי רצסיבי"],"correct":1,"why":["באוטוזומלי דומיננטי היינו מצפים ל-50% בכל אחד מהמינים, לא ל-100% בבנות ו-0% בבנים.","נכון. **כל הבנות חולות ואף בן אינו** — זו החתימה המדויקת של אב חולה בתפוס X דומיננטי.","ברצסיבי תפוס X בנות של אב חולה יוצאות **נשאיות בריאות**, לא חולות.","ברצסיבי אוטוזומלי לא הייתה מתקבלת הפרדה כזו לפי מין כלל."]},{"id":"d3-example-xd-diseases","type":"example","text":"שתי דוגמאות לתפוס X דומיננטי, ושתיהן מלמדות משהו:","work":["**היפופוספטמיק ריקטס** — פגיעה בנשא שמעביר פוספט. פיגור גדילה ופגיעה בכליות. פרט עם עותקים פגומים בלבד **כן בר-קיימא**","**תסמונת רט** — פגיעה נוירולוגית קשה. כאן המצב ההומוזיגוטי־חולה **אינו בר-קיימא**"],"note":"ולכן בתסמונת רט **לא נמצא גברים חולים כלל** (יש להם X אחד, ואם הוא פגום אין חיים) ולא נשים הומוזיגוטיות. נשים חולות בדרך כלל אינן מולידות, ולכן המחלה נגרמת כמעט תמיד ממוטציית **דה-נובו**."},{"id":"d3-recap","type":"recap","points":["**תפוס X רצסיבי**: בעיקר גברים חולים, המחלה מגיעה מהאם, ו**אין העברה מאב לבן** — כלי הפסילה החזק ביותר.","**תפוס X דומיננטי**: אין נשאיות. **אב חולה → כל בנותיו חולות ואף בן אינו** — החתימה המובהקת ביותר.","כשהמצב הפגום הבלעדי אינו בר-קיימא (תסמונת רט), **לא יימצאו גברים חולים כלל**, והמחלה נובעת ממוטציות חדשות."],"next":"יש לך עכשיו את כל ארבעת הדפוסים. בשיעור הבא נהפוך אותם לכלי אחד: עץ משפחה נכנס, תשובה יוצאת."}]},{"id":"pat-04","title":"לזהות דפוס הורשה: עץ נכנס, תשובה יוצאת","estMinutes":14,"source":"שיעור 7–8, עמ' 17–26 — סיכום ותרגול","cards":[{"id":"d4-hook","type":"hook","text":"עץ משפחה על השולחן, ארבע אפשרויות מתחתיו.","sub":"זו שאלה שחוזרת כמעט בכל מבחן. יש לה שיטה קבועה, ואפשר להגיע לתשובה תוך פחות מדקה."},{"id":"d4-concept-tree","type":"concept","term":"שתי שאלות, ארבע תשובות","text":"כל האבחון מתמצה בשתי שאלות. **תשאל אותן תמיד באותו סדר:**","rows":[["שאלה 1","האם המחלה **מדלגת על דורות**?"],["מדלגת","→ **רצסיבי**"],["בכל דור","→ **דומיננטי**"],["שאלה 2","האם **גברים ונשים** חולים באותה שכיחות?"],["בשווה","→ **אוטוזומלי**"],["לא בשווה","→ **תפוס X**"]],"note":"שתי שאלות בינאריות = ארבעה שילובים = בדיוק ארבעת הדפוסים. אם ענית על שתיהן, יש לך תשובה.","alt":[{"title":"אותו דבר בשורה אחת","text":"**דילוג ← רצסיבי. הבדל בין המינים ← X.**\n\nזהו. כל השאר הוא אימות.\n\nמדלג + שוויון = אוטוזומלי רצסיבי. מדלג + רק גברים = תפוס X רצסיבי. כל דור + שוויון = אוטוזומלי דומיננטי. כל דור + הטיה לנשים = תפוס X דומיננטי."}]},{"id":"d4-concept-killers","type":"concept","term":"שלוש הפסילות המהירות","text":"לפני שאתה סופר משהו — חפש את שלושת הסימנים האלה. כל אחד מהם **מוחק אפשרויות מיידית**:","rows":[["אב חולה → בן חולה","**לא תפוס X.** האב נותן לבן Y בלבד"],["אב חולה → כל הבנות חולות, אף בן לא","**תפוס X דומיננטי**, כמעט בוודאות"],["שני הורים בריאים → ילד חולה","**רצסיבי** (או דה-נובו)"]],"note":"הפסילה הראשונה היא היעילה ביותר: היא מורידה בבת אחת **שני** מארבעת הדפוסים. חפש אותה קודם."},{"id":"d4-mcq-1","type":"mcq","level":3,"q":"בעץ: חולים מופיעים בכל דור. מספר הגברים והנשים החולים דומה. יש אב חולה עם בן חולה. איזה דפוס?","options":["אוטוזומלי דומיננטי","אוטוזומלי רצסיבי","תפוס X דומיננטי","תפוס X רצסיבי"],"correct":0,"why":["נכון. **כל דור → דומיננטי. שוויון בין המינים → אוטוזומלי.** ואב-לבן חולה סוגר את שתי אפשרויות ה-X.","רצסיבי היה מדלג על דורות. כאן יש חולים בכל דור.","אב-לבן חולה פוסל כל הורשה תפוסת X. וגם היינו מצפים ליותר נשים חולות.","רצסיבי תפוס X היה נותן כמעט רק גברים חולים, ולא היה עובר מאב לבן."]},{"id":"d4-mcq-2","type":"mcq","level":3,"q":"בעץ: המחלה נעדרת בדור II ומופיעה שוב בדור III. חולים: 3 גברים ו-3 נשים. ההורים של כל החולים בריאים.","options":["אוטוזומלי דומיננטי","אוטוזומלי רצסיבי","תפוס X דומיננטי","תפוס X רצסיבי"],"correct":1,"why":["דומיננטי לא מדלג על דור שלם, ולכל חולה היה צריך להיות הורה חולה.","נכון. **דילוג על דור → רצסיבי. 3 מול 3 → אוטוזומלי.** והורים בריאים לחולה מאשרים: כולם נשאים.","בתפוס X דומיננטי אין דילוג, ואין נשאים בריאים בכלל.","רצסיבי תפוס X היה נותן הטיה חזקה לגברים. 3 מול 3 הוא שוויון."]},{"id":"d4-mcq-3","type":"mcq","level":3,"q":"בעץ: 7 חולים, כולם גברים. שני מקרים שבהם סבא חולה, בתו בריאה, ונכדו חולה.","options":["אוטוזומלי רצסיבי","תפוס X רצסיבי","תפוס X דומיננטי","אוטוזומלי דומיננטי"],"correct":1,"why":["אוטוזומלי היה פוגע גם בנשים. שבעה מתוך שבעה גברים הוא לא מקרה.","נכון. **רק גברים חולים**, והתבנית **סבא ← בת נשאית ← נכד** היא החתימה הקלאסית. המחלה עוברת דרך הנשים ומתבטאת בגברים.","בתפוס X דומיננטי הבנות של אב חולה היו **חולות**, לא בריאות.","דומיננטי לא מדלג, וגם היה פוגע בשני המינים."]},{"id":"d4-mcq-4","type":"mcq","level":3,"q":"בעץ: אב חולה, אם בריאה. 4 בנות — כולן חולות. 3 בנים — כולם בריאים. בדור הבא, אישה חולה מעבירה ל-50% מילדיה, ללא הבדל בין בנים לבנות.","options":["אוטוזומלי דומיננטי","תפוס X רצסיבי","תפוס X דומיננטי","אוטוזומלי רצסיבי"],"correct":2,"why":["באוטוזומלי דומיננטי אב חולה היה מעביר ל-50% מהילדים **בלי קשר למין** — לא 100% לבנות ו-0% לבנים.","ברצסיבי תפוס X הבנות היו יוצאות נשאיות בריאות.","נכון. **אב חולה → כל הבנות ואף בן** היא החתימה. והמשך הדפוס מאשר: אם חולה הטרוזיגוטית מעבירה ל-50% מילדיה משני המינים, כי היא נותנת X לכולם.","רצסיבי לא מייצר מצב שבו כל בנותיו של חולה חולות."]},{"id":"d4-pitfall-small","type":"pitfall","text":"**משפחות אנושיות קטנות מדי בשביל סטטיסטיקה.**\n\nעץ עם 4 ילדים שכולם חולים לא מוכיח הורשה דומיננטית, ועץ שבו במקרה כל החולים גברים לא מוכיח תאחיזה ל-X.","punch":"לכן במבחן מסתמכים על **פסילות לוגיות** — אב-לבן, כל־הבנות — ולא על ספירה. פסילה היא ודאית, ספירה היא סטטיסטיקה."},{"id":"d4-mcq-risk-mix","type":"mcq","level":3,"q":"זוג בריא שכבר יש לו בן עם מחלה **אוטוזומלית רצסיבית**. מה הסיכוי שהילד הבא יהיה **בן חולה**?","options":["25%","12.5%","50%","6.25%"],"correct":1,"why":["25% הוא הסיכוי לילד **חולה**, בלי התניה על מין.","נכון. שני אירועים בלתי תלויים: להיות חולה (1/4) **וגם** להיות בן (1/2). מכפלה: **1/8 = 12.5%.**","50% הוא הסיכוי שהילד יהיה בן, בלי קשר למחלה.","6.25% הוא 1/16 — היה מתקבל אילו סיכוי המחלה היה 1/8."]},{"id":"d4-recap","type":"recap","points":["**שאלה 1: מדלג על דורות?** כן → רצסיבי. לא → דומיננטי. **שאלה 2: הבדל בין המינים?** לא → אוטוזומלי. כן → תפוס X.","שלוש פסילות מהירות: **אב-לבן חולה פוסל X**. **כל הבנות של אב חולה = תפוס X דומיננטי**. **הורים בריאים לילד חולה = רצסיבי**.","בשאלות שמשלבות מין ומחלה — **הכפל**: סיכוי המחלה כפול 1/2 למין."],"next":"סיימת את ארבעת הדפוסים. ביחידה הבאה נשבור אותם: מה קורה כשיש יותר משני אללים, כששני גנים מתערבים זה בזה, וכשלהטרוזיגוט יש פנוטיפ משלו."}]}],"plan":4},{"id":"06-gene-interactions","title":"אינטראקציות גנטיות וסוגי דם","lectures":"9–10","pages":"26–37","lessons":[{"id":"int-01","title":"כשלהטרוזיגוט יש פנוטיפ משלו","estMinutes":13,"source":"שיעור 8–9, עמ' 26–29","cards":[{"id":"g1-hook","type":"hook","text":"פרח סגול טהור מוכלא עם פרח לבן טהור. כל דור F1 יוצא **ורוד**.","sub":"מנדל אמר שהצאצאים ייראו כמו ההורה הדומיננטי. אז מי טעה כאן — מנדל או הפרח?"},{"id":"g1-concept-full","type":"concept","term":"מה שהיה עד עכשיו: דומיננטיות מלאה","text":"בכל מה שלמדנו, לשני אללים היו **שני פנוטיפים**: הפנוטיפ של ההטרוזיגוט זהה לחלוטין לזה של ההומוזיגוט הדומיננטי.\n\nאחרי מותו של מנדל התגלה שזה רק מקרה אחד מתוך כמה.","note":"בטבע יש גנים עם **טווח רחב של פנוטיפים**. השאלה שנפתח בה: איך גן אחד מייצר יותר משני מראים?"},{"id":"g1-concept-incomplete","type":"concept","term":"דומיננטיות חלקית","text":"בפרחי לילנית: הכלאה של סגול טהור עם לבן טהור נותנת **ורוד** בכל דור F1.\n\nוכשמכליאים שני ורודים מקבלים **סגול : ורוד : לבן** ביחס **1:2:1**.","rows":[["AA","סגול"],["Aa","**ורוד** — מצב ביניים"],["aa","לבן"]],"note":"**גן אחד, שני אללים, שלושה פנוטיפים.** וההסבר מולקולרי: הסגול מייצר צבע והלבן לא. אצל ההטרוזיגוט יש צבע — אבל **רק אלל אחד מייצר, ולכן לא מספיק כדי לצבוע במלואו**.","alt":[{"title":"למה זה בעצם אותו סיפור מהיחידה הקודמת","text":"אמרנו שחצי מכמות האנזים בדרך כלל **מספיקה**, ולכן נשא בריא.\n\nכאן חצי הכמות **לא מספיקה**. אותו מנגנון בדיוק, סף אחר.\n\nזו לא תופעה חדשה — זה מה שקורה כשמרווח הביטחון קטן יותר."}]},{"id":"g1-mcq-ratio","type":"mcq","level":2,"q":"בדומיננטיות חלקית, מה היחס **בפנוטיפ** בהכלאה Aa × Aa?","options":["3:1","1:2:1","9:3:3:1","2:1"],"correct":1,"why":["3:1 מתקבל בדומיננטיות מלאה, כי AA ו-Aa נראים זהים ונספרים יחד.","נכון. **1:2:1** — כאן כל גנוטיפ נראה אחרת, ולכן יחס הפנוטיפים **זהה ליחס הגנוטיפים**.","9:3:3:1 שייך לשני גנים, לא לאחד.","2:1 יופיע כשיש אלל לטלי — נגיע לזה בשיעור הבא."]},{"id":"g1-concept-codominance","type":"concept","term":"קו-דומיננטיות","text":"מצב שלישי, ושונה מהותית מדומיננטיות חלקית: **שני האללים באים לידי ביטוי במלואם, זה לצד זה.**\n\nאין ממוצע, אין מיזוג — שניהם פשוט נוכחים.","rows":[["דומיננטיות מלאה","ההטרוזיגוט נראה כמו הדומיננטי"],["דומיננטיות חלקית","ההטרוזיגוט **באמצע** בין השניים"],["קו-דומיננטיות","ההטרוזיגוט מציג את **שני** האללים במקביל"]],"note":"שלוש ההגדרות האלה חוזרות בשאלות. ההבדל בין השתיים האחרונות: **ורוד** הוא ממוצע של אדום ולבן. **סגול עם כתמים לבנים** הוא קו-דומיננטיות."},{"id":"g1-concept-abo","type":"concept","term":"סוגי דם: הדוגמה הקלאסית","text":"לגן שקובע סוג דם יש **שלושה אללים באוכלוסייה** — אבל לכל אדם יש רק שניים מהם.","rows":[["IA","מוסיף סוכר מסוג A על פני התא"],["IB","מוסיף סוכר מסוג B"],["i","לא מוסיף כלום — **רצסיבי** ביחס לשניהם"]],"note":"**IA ו-IB קו-דומיננטיים זה לזה, ושניהם דומיננטיים על i.** זה גן אחד שמדגים שני סוגי יחסים בו-זמנית — ובדיוק לכן הוא הדוגמה הנפוצה במבחנים."},{"id":"g1-concept-abo-table","type":"concept","term":"מגנוטיפ לסוג דם","text":"שישה גנוטיפים אפשריים, וארבעה סוגי דם:","rows":[["IA IA · IA i","סוג **A**"],["IB IB · IB i","סוג **B**"],["IA IB","סוג **AB** — קו-דומיננטיות"],["i i","סוג **O**"]],"note":"שים לב: אדם מסוג A יכול להיות IA IA או IA i — **ולא תדע מהמראה**. זו בדיוק בעיית הגנוטיפ שמסתתר, שראית בהכלאת מבחן."},{"id":"g1-punnett-abo","type":"punnett","q":"אב מסוג AB (IA IB) ואם מסוג A שהיא הטרוזיגוטית (IA i). מלא את הריבוע.","help":"למעלה הגמטות של האב, בצד של האם.","top":["IA","IB"],"side":["IA","i"],"chips":["IAIA","IAIB","IAi","IBi","ii"],"solution":[["IAIA","IAIB"],["IAi","IBi"]],"pheno":{"IAIA":{"label":"סוג A","kind":"ok"},"IAIB":{"label":"סוג AB","kind":"mid"},"IAi":{"label":"סוג A","kind":"ok"},"IBi":{"label":"סוג B","kind":"no"}},"after":"**חצי מהילדים מסוג A, רבע AB, רבע B. אף ילד לא יהיה O** — כי אין לאב אלל i לתת."},{"id":"g1-concept-antibodies","type":"concept","term":"למה זה משנה בעירוי דם","text":"מערכת החיסון מייצרת **נוגדנים נגד הסוכרים שאינם קיימים אצלך**. זה החלק שהופך את הנושא מגנטיקה לרפואה.","rows":[["סוג A","נוגדנים נגד B"],["סוג B","נוגדנים נגד A"],["סוג AB","**אין נוגדנים** — מקבל אוניברסלי"],["סוג O","נוגדנים נגד A **וגם** נגד B — תורם אוניברסלי"]],"note":"אם מקבלים דם שיש נגדו נוגדנים, מערכת החיסון תוקפת ונוצרים **גושים בדם** שיכולים לסתום כלי דם ולהרוג. לכן O תורם לכולם (אין עליו סוכר לתקוף), ו-AB מקבל מכולם (אין לו נוגדנים)."},{"id":"g1-mcq-transfusion","type":"mcq","level":2,"q":"למה אדם מסוג O הוא **תורם** אוניברסלי אבל לא **מקבל** אוניברסלי?","options":["כי דמו חלש יותר","אין על תאיו סוכרים שיותקפו, אבל בדמו יש נוגדנים נגד A וגם נגד B","כי O הוא האלל הדומיננטי","כי סוג O נדיר יותר"],"correct":1,"why":["אין \"חוזק\" בדם. השאלה היא איזה סוכרים נמצאים ואילו נוגדנים.","נכון. **שני כיוונים נפרדים:** מה שהוא נותן נקי מסוכרים ולכן בטוח לכולם. אבל מה שהוא מקבל חייב להיות נקי גם כן, כי יש לו נוגדנים נגד שניהם.","i הוא דווקא **רצסיבי** ביחס לשני האחרים.","שכיחות לא קשורה לתאימות."]},{"id":"g1-mcq-paternity","type":"mcq","level":3,"q":"לאם מסוג O נולד ילד מסוג B. מה סוג הדם של האב?","options":["בהכרח B","B או AB","בהכרח AB","כל סוג דם אפשרי"],"correct":1,"why":["לא בהכרח. גם אב מסוג AB יכול לתת IB.","נכון. האם ii ונותנת i, ולכן הילד הוא **IB i**. את ה-IB הוא קיבל מהאב — כלומר לאב יש IB, והוא **B או AB**.","AB אפשרי, אבל B אפשרי בדיוק באותה מידה.","לא. אב מסוג O או A לא יכול לתרום IB כלל."]},{"id":"g1-recap","type":"recap","points":["**דומיננטיות חלקית**: ההטרוזיגוט באמצע, והיחס הופך ל-**1:2:1** כי כל גנוטיפ נראה אחרת.","**קו-דומיננטיות**: שני האללים מתבטאים במקביל, בלי מיצוע.","**סוגי דם** מדגימים את שניהם: IA ו-IB קו-דומיננטיים זה לזה ודומיננטיים על i. O תורם לכולם, AB מקבל מכולם."],"next":"בשיעור הבא: מה קורה כשלגן יש **חמישה** אללים ולא שלושה, ומה קורה כשאחד מהם פשוט הורג את מי שנושא שניים ממנו."}]},{"id":"int-02","title":"אללים לטליים וסוגי מוטציות","estMinutes":12,"source":"שיעור 9, עמ' 26, 29–30","cards":[{"id":"g2-hook","type":"hook","text":"הכלאה בין שני עכברים צהובים. שניהם הטרוזיגוטים.","sub":"אתה מצפה ל-3:1. בפועל יצא 2:1, והמלטות היו קטנות מהרגיל. מה קרה לרבע החסר?"},{"id":"g2-concept-multiple","type":"concept","term":"אללים מרובים","text":"עד עכשיו הנחנו שני אללים לגן. בטבע זה לרוב לא המצב — **לגן אחד יכולים להיות אללים רבים באוכלוסייה**.\n\nבארנבות, למשל, חמישה אללים שונים לאותו גן צבע מייצרים חמישה פנוטיפים שונים.","note":"אבל **לפרט דיפלואידי יש תמיד רק שניים מהם**. ככל שיש יותר אללים באוכלוסייה — יותר פנוטיפים אפשריים, אבל לא יותר אללים לאדם."},{"id":"g2-example-yellow","type":"example","text":"בעכברים, זן הבר הוא **אגוטי** (חום־שחור). מוטציה יוצרת פרווה **צהובה**.","work":["אגוטי הומוזיגוט × צהוב → **חצי צהובים, חצי אגוטי**. מסקנה: הצהוב הטרוזיגוט, והצהוב דומיננטי","צהוב × צהוב → **2/3 צהובים, 1/3 אגוטי**"],"note":"השורה השנייה היא החריגה. הכלאה בין שני הטרוזיגוטים אמורה לתת **3:1**, וכאן יצא **2:1**. בנוסף החוקר שם לב שכמות הצאצאים בהמלטות האלה קטנה יותר."},{"id":"g2-concept-lethal","type":"concept","term":"אלל לטלי","text":"ההסבר: הגנוטיפ **ההומוזיגוטי הצהוב אינו בר-קיימא**. העוברים האלה מתים לפני הלידה.","rows":[["הומוזיגוט צהוב","מת ברחם — לא נספר"],["הטרוזיגוט","צהוב, חי"],["הומוזיגוט אגוטי","אגוטי, חי"]],"note":"מארבע המשבצות, אחת יורדת מהחשבון. נשארות שלוש: **שני הטרוזיגוטים ואחד אגוטי — 2:1.** וזה גם מסביר את ההמלטות הקטנות: רבע מהעוברים אינם מגיעים ללידה.","alt":[{"title":"הכלל בשורה אחת","text":"**יחס 2:1 במקום 3:1 = אלל לטלי בהומוזיגוט.**\n\nזה סימן זיהוי חד. אם בשאלה מופיע 2:1, אתה כמעט תמיד מסתכל על משבצת שלא שרדה.\n\nראית את זה כבר באכונדרופלזיה — אותו מנגנון בדיוק."}]},{"id":"g2-mcq-lethal","type":"mcq","level":2,"q":"בהכלאה בין שני הטרוזיגוטים התקבל יחס של **2:1** במקום 3:1. מה ההסבר?","options":["אחד הגנוטיפים אינו בר-קיימא","מדובר בדומיננטיות חלקית","יש שני גנים ולא אחד","המדגם היה קטן מדי"],"correct":0,"why":["נכון. **משבצת אחת מתוך ארבע לא הגיעה ללידה**, ולכן היחס מחושב מתוך שלוש. זה אלל לטלי בהומוזיגוט.","דומיננטיות חלקית הייתה נותנת 1:2:1 — **שלושה** פנוטיפים, לא שניים.","שני גנים היו נותנים יחס מסוג 9:3:3:1.","מדגם קטן מייצר סטייה אקראית, לא יחס עקבי וחוזר של בדיוק 2:1."]},{"id":"g2-concept-lof","type":"concept","term":"מוטציית איבוד תפקוד (LOF)","text":"**LOF** = loss of function. המוטציה גורמת לחלבון לאבד את פעילותו.\n\n**רוב המוטציות מהסוג הזה הן רצסיביות** — כי 50% מפעילות החלבון בדרך כלל מספיקה.","note":"לפעמים הגוף אפילו **מגביר את הביטוי של האלל התקין** כדי להשלים את הכמות החסרה. זו הסיבה העמוקה שנשאים בריאים."},{"id":"g2-concept-haplo","type":"concept","term":"הפלואינספישנסי: כש-50% לא מספיק","text":"יש גנים שבהם חצי מכמות החלבון **אינה** מספיקה לפנוטיפ תקין. המצב הזה נקרא **הפלואינספישנסי**.\n\nובמקרה כזה, מוטציית LOF תהיה **דומיננטית**.","rows":[["50% מספיק","המוטציה **רצסיבית** — הנשא בריא"],["50% לא מספיק","המוטציה **דומיננטית** — הנשא חולה"]],"note":"וזו התשובה השלמה לשאלה \"למה יש בכלל מחלות דומיננטיות\". **לא כל מערכת בנויה עם מרווח ביטחון של פי שניים.**"},{"id":"g2-concept-gof","type":"concept","term":"מוטציית הוספת תפקוד (GOF)","text":"**GOF** = gain of function. כאן החלבון לא מאבד פעילות — הוא **רוכש פעילות חדשה שלא קיימת בזן הבר**, ולרוב מזיקה.\n\n**מוטציות GOF יהיו כמעט תמיד דומיננטיות.**","note":"ההיגיון פשוט: ברגע שמיוצרת פעילות מזיקה, היא מופיעה בפנוטיפ. **אין מה שיכסה על נזק שנעשה בפועל** — בניגוד לחוסר, שאפשר להשלים.","alt":[{"title":"ההבדל בשורה אחת","text":"**LOF = חסר.** אפשר לפצות עליו מהעותק השני, ולכן בדרך כלל רצסיבי.\n\n**GOF = נזק פעיל.** אי אפשר לפצות עליו, ולכן כמעט תמיד דומיננטי.\n\nחוסר אפשר להשלים. הרס לא."}]},{"id":"g2-mcq-gof","type":"mcq","level":3,"q":"מוטציה חדשה גורמת לחלבון לרכוש פעילות שלא הייתה לו קודם. איזה דפוס הורשה צפוי?","options":["רצסיבי, כי העותק השני תקין","דומיננטי, כי הפעילות המזיקה קיימת בפועל","תלוי אם הגן על X","לא ניתן לקבוע"],"correct":1,"why":["העותק התקין לא מבטל את הפעילות החדשה — הוא רק ממשיך לעשות את שלו לצידה.","נכון. זו מוטציית **GOF**. עותק תקין יכול להשלים **חוסר**, אבל לא לנטרל **נזק פעיל** — ולכן הפנוטיפ מופיע גם בהטרוזיגוט.","מיקום הגן קובע את אופן ההעברה, לא את היחס בין האללים.","דווקא ניתן: סוג המוטציה חוזה את דפוס ההורשה די היטב."]},{"id":"g2-mcq-lof-dominant","type":"mcq","level":3,"q":"מוטציית LOF שהיא **דומיננטית**. מה בהכרח נכון לגבי הגן?","options":["החלבון שלו רעיל","50% מכמות החלבון אינה מספיקה — הפלואינספישנסי","הגן יושב על כרומוזום X","יש לגן אלל שלישי"],"correct":1,"why":["ב-LOF החלבון מאבד פעילות, לא רוכש רעילות. רעילות שייכת ל-GOF.","נכון. אם עותק תקין אחד **היה** מספיק, המוטציה הייתה רצסיבית. העובדה שהיא דומיננטית מלמדת ש**חצי הכמות אינה מספיקה** — וזו ההגדרה של הפלואינספישנסי.","מיקום על X היה משנה את דפוס ההעברה בין המינים, לא את הדומיננטיות.","מספר האללים לא קשור לשאלה."]},{"id":"g2-recap","type":"recap","points":["**אללים מרובים** קיימים באוכלוסייה, אבל לכל פרט יש רק שניים. יותר אללים = יותר פנוטיפים אפשריים.","**יחס 2:1 במקום 3:1 = אלל לטלי** בהומוזיגוט. המשבצת החסרה פשוט לא נולדה.","**LOF** (איבוד תפקוד) — לרוב רצסיבי, אלא אם יש **הפלואינספישנסי**. **GOF** (פעילות חדשה מזיקה) — כמעט תמיד דומיננטי."],"next":"עד עכשיו כל גן פעל לבדו. בשיעור הבא: שני גנים על אותו מסלול — ומה שקורה ליחסים המוכרים כשהם מתחילים להפריע זה לזה."}]},{"id":"int-03","title":"שני גנים, מסלול אחד: קומפלמנטציה ואפיסטזיס","estMinutes":14,"source":"שיעור 9–10, עמ' 31–34","cards":[{"id":"g3-hook","type":"hook","text":"מצאת בשדה שני פרחים לבנים. הכלאת ביניהם.","sub":"כל הצאצאים יצאו **כחולים**. שני הורים לבנים, ילדים כחולים. איך?"},{"id":"g3-concept-pathway","type":"concept","term":"תכונה אחת, מסלול שלם","text":"עד עכשיו הנחנו: גן אחד = תכונה אחת. בפועל, רוב התכונות נוצרות ב**מסלול** — שרשרת שלבים, וכל שלב מופעל על ידי חלבון אחר.\n\nפגיעה **בכל אחד** מהשלבים עוצרת את התוצאה הסופית.","note":"לדוגמה, הפיכת גלוקוז לפירובאט בגליקוליזה עוברת שלבים רבים. זו לא תכונה של גן אחד — היא תלויה בעשרות חלבונים, כלומר בעשרות גנים."},{"id":"g3-example-complementation","type":"example","text":"בפרחי פעמונית הצבע התקין הוא כחול. המסלול:\n\n**חומר X (לבן) → [גן A] → חומר Y (לבן) → [גן B] → פיגמנט כחול**","work":["מוטציה ב-**A** — התהליך נעצר בשלב הראשון. פרח לבן","מוטציה ב-**B** — התהליך נעצר בשלב השני. פרח לבן","שתי מוטציות שונות, **אותו פנוטיפ בדיוק**"],"note":"ולכן כשמכליאים שני פרחים לבנים מזנים שונים — אחד **aaBB** והשני **AAbb** — הצאצאים יוצאים **AaBb**: יש להם עותק תקין של שני הגנים, המסלול שלם, והפרח כחול."},{"id":"g3-concept-complementation","type":"concept","term":"קומפלמנטציה","text":"**קומפלמנטציה** = היכולת של שני גנים שונים לפצות זה על זה.\n\nכל הורה מביא עותק תקין של הגן שנפגע אצל השני, והתוצאה היא פנוטיפ תקין.","rows":[["יש קומפלמנטציה","המוטציות ב**גנים שונים** — הצאצאים תקינים"],["אין קומפלמנטציה","המוטציות ב**אותו גן** — כל הצאצאים מוטנטים"]],"note":"וזה הופך את התופעה ל**מבחן**: יש לך שני מוטנטים עם אותו מראה, ואתה רוצה לדעת אם הפגם באותו גן. **תכליא ביניהם.** צאצאים תקינים → גנים שונים. צאצאים מוטנטים → אותו גן.","alt":[{"title":"למה זה עובד","text":"כל הורה תורם עותק אחד תקין ועותק אחד פגום — אבל **בגנים שונים**.\n\nהצאצא מקבל: עותק תקין של A מהורה אחד, עותק תקין של B מההורה השני.\n\nיש לו את שני החלקים, והמסלול רץ מקצה לקצה. השניים משלימים זה את החסר של זה."}]},{"id":"g3-mcq-complementation","type":"mcq","level":3,"q":"הכלאת שני מוטנטים לבנים. **כל** הצאצאים יצאו לבנים. מה המסקנה?","options":["המוטציות בגנים שונים","המוטציות באותו גן","אחת המוטציות דומיננטית","לא ניתן להסיק"],"correct":1,"why":["אילו היו בגנים שונים, כל הורה היה מספק את החלק החסר של השני והצאצאים היו תקינים.","נכון. **אין קומפלמנטציה** — ולכן שני ההורים פגומים ב**אותו גן**. אין מי שיתרום עותק תקין שלו, והמסלול נשאר חסום.","המוטציות כאן רצסיביות. גם אם אחת הייתה דומיננטית, זה לא היה מסביר את היעדר ההשלמה.","דווקא אפשר — זו בדיוק מטרתו של מבחן הקומפלמנטציה."]},{"id":"g3-mcq-97","type":"mcq","level":2,"q":"בהכלאה בין שני הטרוזיגוטים כפולים (AaBb × AaBb) במסלול שדורש **את שני הגנים** — מה היחס?","options":["9:3:3:1","9:7","12:3:1","1:2:1"],"correct":1,"why":["9:3:3:1 מתקבל כששני הגנים עצמאיים ומייצרים ארבעה פנוטיפים נפרדים.","נכון. רק **A_B_** נותן פנוטיפ תקין — 9 משבצות. כל השאר (3+3+1) חסרים לפחות גן אחד ונראים **זהים**: 7 משבצות. היחס **9:7**.","12:3:1 שייך לאפיסטזיס דומיננטי.","1:2:1 שייך לדומיננטיות חלקית בגן אחד."]},{"id":"g3-concept-epistasis","type":"concept","term":"אפיסטזיס: כשגן אחד ממסך את השני","text":"בקומפלמנטציה, שני חומרי הביניים היו לבנים — ולכן כל פגיעה נראתה אותו דבר.\n\nאבל אם **חומר הביניים נראה אחרת**, נקבל תמונה שונה. בפרח קולינסיה:\n\n**לבן → [גן A] → ורוד → [גן B] → כחול**","rows":[["A_B_","כחול — המסלול שלם"],["A_bb","**ורוד** — נעצר בשלב הביניים"],["aaB_","לבן — לא התחיל בכלל"],["aabb","לבן"]],"note":"היחס: **9 כחול : 3 ורוד : 4 לבן.** שים לב ש-aaB_ ו-aabb נראים זהים — **כשגן A פגום, לא משנה בכלל מה קורה ב-B.**"},{"id":"g3-concept-epistasis-def","type":"concept","term":"ההגדרה: מיסוך","text":"**אפיסטזיס** = מצב שבו גן אחד **ממסך** את הביטוי של גן אחר.\n\nבדוגמה: אם A תקין, הפנוטיפ נקבע לפי B. אבל אם A פגום — **לא משנה מה קורה ב-B**, הפנוטיפ נקבע לפי A.","note":"אומרים ש**גן A אפיסטטי על גן B**. וההיגיון פיזי לגמרי: אם השלב הראשון במסלול לא רץ, אין חומר גלם לשלב השני. הוא יכול להיות תקין לחלוטין ופשוט אין לו על מה לעבוד.","alt":[{"title":"ההבדל מקומפלמנטציה","text":"**קומפלמנטציה** = 9:7. שני הגנים נחוצים, וכל כישלון נראה זהה.\n\n**אפיסטזיס** = 9:3:4. שני הגנים נחוצים, אבל **כישלון בשלב מוקדם נראה אחרת** מכישלון בשלב מאוחר.\n\nאותו רעיון, ההבדל הוא רק אם חומר הביניים גלוי לעין."}]},{"id":"g3-concept-dominant-epistasis","type":"concept","term":"אפיסטזיס דומיננטי","text":"בשתי הדוגמאות הקודמות המוטציות היו רצסיביות. בפרח דיגיטליס המוטציה הממסכת היא **דומיננטית**:","rows":[["גן D","קובע כמה פיגמנט נוצר — D הרבה (סגול כהה), d מעט (סגול בהיר)"],["גן W","המוטציה W חוסמת את **פיזור** הפיגמנט → פרח לבן"]],"note":"מספיק **אלל W אחד** כדי לחסום, ולכן היחס הוא **12 לבן : 3 סגול כהה : 1 סגול בהיר**. שים לב ששני הגנים כאן לא באותו מסלול — הם פועלים במקביל, אחד יוצר את הצבע והשני מפזר אותו."},{"id":"g3-mcq-ratios","type":"mcq","level":3,"q":"התקבל יחס של **12:3:1** בהכלאה דיהיברידית. מה זה מעיד?","options":["קומפלמנטציה","אפיסטזיס רצסיבי","אפיסטזיס דומיננטי","אלל לטלי"],"correct":2,"why":["קומפלמנטציה נותנת **9:7** — שני פנוטיפים בלבד.","אפיסטזיס רצסיבי נותן **9:3:4**, כלומר 9 ראשון והשאר מתחלק ל-3 ו-4.","נכון. **12:3:1** — הקבוצה של 12 היא 9+3, כלומר כל מי שנושא אלל דומיננטי אחד ממסך. **מספיק עותק אחד כדי למסך = אפיסטזיס דומיננטי.**","אלל לטלי משנה יחסים בגן אחד (3:1 → 2:1), לא בהכלאה דיהיברידית."]},{"id":"g3-recap","type":"recap","points":["רוב התכונות נוצרות ב**מסלול** של כמה גנים. פגיעה בכל שלב עוצרת את התוצאה.","**קומפלמנטציה** (9:7): שני מוטנטים בגנים שונים משלימים זה את זה. מבחן: הכלאה — צאצאים תקינים = גנים שונים.","**אפיסטזיס**: גן אחד ממסך את השני. **9:3:4** רצסיבי · **12:3:1** דומיננטי. כל היחסים האלה הם 16 משבצות שנקבצו אחרת."],"next":"נשאר מקרה אחד מטריד: אנשים עם אותו גנוטיפ בדיוק, שאחד מהם חולה קשה והשני בכלל לא."}]},{"id":"int-04","title":"חדירות וביטוי וריאבילי","estMinutes":11,"source":"שיעור 10, עמ' 35–36","cards":[{"id":"g4-hook","type":"hook","text":"שני אנשים, אותה מוטציה בדיוק, באותו גן.","sub":"אחד חולה קשה. השני בריא לחלוטין ולא ידע על כך כל חייו. אותו גנוטיפ — תוצאות הפוכות."},{"id":"g4-concept-penetrance","type":"concept","term":"חדירות","text":"**חדירות** היא האחוז מבין נושאי האלל שאצלם המחלה **מופיעה בכלל**.\n\nכשהחדירות אינה מלאה, יש נושאים שיישארו בריאים לגמרי.","note":"הסיבה: **יש עוד גנים שמשפיעים**, ולפעמים גם גורמים סביבתיים. יש צירופים גנטיים שבהם המחלה מתבטאת וצירופים שבהם לא — והגן ה\"ראשי\" הוא רק אחד מהמשתתפים.","alt":[{"title":"חדירות היא הכל או כלום","text":"**נושא את האלל ← או חולה, או בריא.** אין אמצע.\n\nחדירות של 70% פירושה: מתוך 100 נושאים, 70 יחלו ו-30 לא יחלו כלל.\n\nהיא לא מתארת **כמה** חולים — רק **אם**."}]},{"id":"g4-example-brca","type":"example","text":"**BRCA1 ו-BRCA2** הם הדוגמה המוכרת ביותר. מוטציות בהם מעלות משמעותית את הסיכון לסרטן שד ושחלות.","work":["החדירות שלהן **גבוהה יחסית: 60–80%**","כלומר גם עם המוטציה, חלק מהנשאיות **לא יפתחו** את המחלה","ולכן קיים מעקב רפואי, ולעיתים המלצה לכריתה מונעת"],"note":"המחלה קיימת גם בגברים — הם יכולים לפתח סרטן שד, בשכיחות נמוכה בהרבה, ולהעביר את המוטציה הלאה. **סרטן שחלות** הם כמובן לא יכולים לפתח."},{"id":"g4-concept-sex-limited","type":"concept","term":"מוטציה מוגבלת למין","text":"המצב שראית עכשיו — מין אחד יכול לחלות והשני לא — נקרא **מוטציה מוגבלת למין**.\n\nחשוב להבחין: הגן אוטוזומלי לחלוטין. הוא עובר לשני המינים בשווה.","note":"**רק ההזדמנות להתבטא חסרה**, כי אין את האיבר הרלוונטי. גבר שנושא BRCA מעביר אותו לבנותיו בסיכוי של 50% בדיוק כמו אישה. **אל תבלבל את זה עם תאחיזה ל-X** — שם ההעברה עצמה שונה בין המינים, וכאן היא זהה."},{"id":"g4-mcq-sex-limited","type":"mcq","level":3,"q":"גבר נושא מוטציה ב-BRCA1. מה הסיכוי שיעביר אותה לבתו?","options":["0%","50%","100%","25%"],"correct":1,"why":["כאן נופלים. העובדה שהוא בעצמו בסיכון נמוך לא משנה כלום לגבי ההעברה.","נכון. **הגן אוטוזומלי**, והוא הטרוזיגוט — 50% לכל ילד, בן או בת. \"מוגבל למין\" מתאר את **ההתבטאות**, לא את ההורשה.","100% היה נכון לגן על X שעובר מאב לבת — וזה לא המקרה.","25% דורש ששני ההורים יהיו נשאים ושהמחלה תהיה רצסיבית."]},{"id":"g4-concept-expressivity","type":"concept","term":"ביטוי וריאבילי","text":"מצב דומה אך שונה: **כל** מי שנושא את האלל **כן** מבטא את התכונה — אבל **בעוצמה שונה**.\n\nשני אנשים עם אותו גנוטיפ יכולים להיות במצב קליני רחוק מאוד זה מזה.","rows":[["חדירות חלקית","**האם** התכונה תופיע — הכל או כלום"],["ביטוי וריאבילי","**באיזו עוצמה** תופיע — כולם מבטאים, בדרגות שונות"]],"note":"ההבחנה הזו נבחנת. **חדירות = כן או לא. ביטוי וריאבילי = כמה.**"},{"id":"g4-mcq-difference","type":"mcq","level":2,"q":"במחלה מסוימת, **כל** נושאי האלל חולים — אבל חלקם בקושי מרגישים וחלקם מוגבלים קשות. מה זה?","options":["חדירות חלקית","ביטוי וריאבילי","אפיסטזיס","דומיננטיות חלקית"],"correct":1,"why":["בחדירות חלקית היו נושאים שכלל **אינם** חולים. כאן כולם חולים.","נכון. **כולם מבטאים, השאלה היא רק באיזו רמה.** זו ההגדרה המדויקת של ביטוי וריאבילי.","אפיסטזיס מתאר מיסוך בין שני גנים, לא שונות בעוצמה בין נושאי אותו אלל.","דומיננטיות חלקית מתארת פנוטיפ ביניים קבוע להטרוזיגוט — לא טווח משתנה בין אנשים."]},{"id":"g4-example-nf1","type":"example","text":"**נוירופיברומטוזיס 1 (NF1)** — מחלה אוטוזומלית דומיננטית, והדוגמה הקלאסית לביטוי וריאבילי.\n\nכל מי שנושא את הגן **חולה**. אבל צורת הביטוי משתנה במידה קיצונית:","work":["אצל חלק — רק כמה **כתמי \"קפה בחלב\"** על העור, וזהו","אצל אחרים — גידולים מרובים ופגיעה משמעותית"],"note":"המחשה יפה נוספת: עשרה כלבים עם **גנוטיפ זהה** ופנוטיפ שונה זה מזה. ההבדלים נובעים מאינטראקציות עם גנים אחרים ומתנאי סביבה."},{"id":"g4-pitfall-counseling","type":"pitfall","text":"**שתי התופעות האלה שוברות את הייעוץ הגנטי.**\n\nבחדירות חלקית אי אפשר לומר להורים אם הילד יחלה — רק שהוא נושא. בביטוי וריאבילי אי אפשר לומר **כמה** קשה יהיה.","punch":"ולכן בשאלות מבחן, נוכחות של חדירות חלקית היא הסיבה שאילן יוחסין \"מדלג\" בלי שההורשה תהיה רצסיבית. שים לב לזה."},{"id":"g4-mcq-pedigree","type":"mcq","level":3,"q":"באילן יוחסין של מחלה **אוטוזומלית דומיננטית** מופיע אדם בריא שאביו חולה ובנו חולה. מה ההסבר?","options":["מוטציית דה-נובו אצל הבן","חדירות חלקית — האדם נושא את האלל אך אינו מבטא אותו","המחלה בעצם רצסיבית","טעות ברישום"],"correct":1,"why":["דה-נובו אפשרית תיאורטית, אבל צירוף המקרים שהיא תיפול דווקא במשפחה שכבר נושאת את המחלה אינו סביר.","נכון. הוא **נושא את האלל והעביר אותו**, אך אצלו הוא לא בא לידי ביטוי. זה נקרא לעיתים \"דילוג\" — והוא הסימן הקלאסי לחדירות חלקית.","אילו הייתה רצסיבית, אשתו הייתה צריכה להיות נשאית גם היא — פחות סביר, ולא מתיישב עם שאר העץ.","אין סיבה להניח טעות כשיש הסבר ביולוגי מוכר."]},{"id":"g4-recap","type":"recap","points":["**חדירות** = כמה מנושאי האלל חולים בכלל. הכל או כלום. ב-BRCA היא 60–80%.","**ביטוי וריאבילי** = כולם חולים, אך בעוצמה שונה. NF1 היא הדוגמה — מכתם על העור ועד פגיעה קשה.","**מוגבל למין** ≠ תפוס X: הגן אוטוזומלי ועובר בשווה, רק ההתבטאות מוגבלת למין אחד."],"next":"סיימת את כל מה שקורה **בין אללים**. ביחידה הבאה נרד לרמה הפיזית: איך כרומוזום בנוי, ומה קורה לו בכל פעם שתא מתחלק."}]}],"plan":4},{"id":"07-cell-cycle","title":"מבנה כרומוזום ומיטוזה","lectures":"12","pages":"37–41","lessons":[{"id":"cell-01","title":"מבנה הכרומוזום וקריוטיפ","estMinutes":11,"source":"שיעור 11–12, עמ' 37–39","cards":[{"id":"c1-hook","type":"hook","text":"רופא כותב בתיק: **47,XY+21**.","sub":"שמונה תווים שמכילים אבחנה מלאה. עד סוף השיעור תדע לקרוא אותם — ולכתוב אותם בעצמך."},{"id":"c1-concept-parts","type":"concept","term":"חלקי הכרומוזום","text":"כל כרומוזום מחולק על ידי אזור צר יותר, ומכאן מקבל שני חלקים באורך שונה:","rows":[["זרוע ארוכה","מסומנת **q**"],["זרוע קצרה","מסומנת **p**"],["צנטרומר","אזור ההיצרות שמפריד ביניהן"]],"note":"דרך לזכור מי הארוך: **HIGH Q** — ציון גבוה, זרוע ארוכה. ולצנטרומר יש תפקיד קריטי מעבר לחלוקה הזו: הוא **נקודת האחיזה** שדרכה נמשך הכרומוזום לתא הבת בזמן החלוקה."},{"id":"c1-concept-telomeres","type":"concept","term":"טלומרים: הקצוות","text":"בשני קצוות כל כרומוזום יש **טלומרים**, ותפקידם לשמור על תקינותו:","rows":[["מניעת הידבקות","מונעים מהכרומוזום להידבק לכרומוזומים אחרים"],["העתקה תקינה","נחוצים לשכפול נכון של ה-DNA עד הקצה"]],"note":"יש מנגנון שמתחזק את הטלומרים, אבל **הוא נשחק עם השנים**. הטלומרים מתקצרים, הכרומוזומים נעשים פחות יציבים, והתאים מתפקדים פחות טוב. זה אחד המנגנונים המרכזיים של הזדקנות ברמת התא.","alt":[{"title":"למה בכלל צריך קצה מוגן","text":"לתא יש מנגנוני תיקון שמזהים **קצה שבור של DNA** ומדביקים אותו למשהו.\n\nאבל לכרומוזום יש קצה **באופן טבעי**. בלי סימון מיוחד, מנגנון התיקון היה מדביק כרומוזומים זה לזה בטעות.\n\nהטלומר הוא התג שאומר: זה קצה תקין, אל תיגע."}]},{"id":"c1-concept-shapes","type":"concept","term":"איך מבדילים בין כרומוזומים","text":"שני מאפיינים עיקריים: **האורך** ו**מיקום הצנטרומר**. לפי המיקום מסווגים לשלושה סוגים:","rows":[["מטהצנטרי","הצנטרומר **במרכז** — שתי הזרועות דומות באורכן"],["סאבמטהצנטרי","הצנטרומר **בצד** — זרוע ארוכה וזרוע קצרה"],["אקרוצנטרי","הצנטרומר **קרוב מאוד לקצה** — הזרוע הקצרה זעירה"]],"note":"הסיווג הזה יחזור ביחידה 9: **טרנסלוקציה רוברטסונית** מתרחשת דווקא בכרומוזומים אקרוצנטריים, וזו הסיבה שאחת הצורות של תסמונת דאון עוברת בתורשה."},{"id":"c1-mcq-shapes","type":"mcq","q":"כרומוזום שבו הצנטרומר יושב כמעט בקצה נקרא:","options":["מטהצנטרי","סאבמטהצנטרי","אקרוצנטרי","טלומרי"],"correct":2,"why":["מטהצנטרי הוא ההפך — הצנטרומר במרכז.","בסאבמטהצנטרי הצנטרומר בצד אך לא בקצה, ונשארת זרוע קצרה משמעותית.","נכון. **אקרוצנטרי** — הצנטרומר קרוב לקצה והזרוע הקצרה כמעט אינה קיימת.","טלומר הוא הקצה עצמו, לא סוג של כרומוזום."]},{"id":"c1-concept-banding","type":"concept","term":"צביעת פסים","text":"כדי לחקור כרומוזומים משתמשים בטכניקת צביעה שיוצרת עליהם **דגם פסים** קבוע, כמו זברה.\n\nהדגם קבוע וידוע לכל כרומוזום — ולכן **סטייה ממנו מסגירה בעיה**.","note":"אם פתאום יש פסים נוספים או חסרים, אפשר לזהות זאת מיד. ובזכות הקביעות, הפסים מגדירים **אזורים ממוספרים**: אמירה כמו \"האזור q34.4\" מציינת מיקום מדויק, ויוצרת שפה משותפת לכל החוקרים."},{"id":"c1-concept-karyotype","type":"concept","term":"קריוטיפ: מערך הכרומוזומים","text":"**קריוטיפ** הוא מערך הכרומוזומים המלא: 22 זוגות אוטוזומליים (ממוספרים 1–22) ועוד זוג כרומוזומי מין.\n\nהסימון בנוי משני חלקים ועוד תוספת אופציונלית:","rows":[["46,XX","נקבה תקינה"],["46,XY","זכר תקין"],["47,XY+21","זכר עם **כרומוזום 21 עודף**"]],"note":"**המספר בהתחלה הוא סך כל הכרומוזומים**, אחריו כרומוזומי המין, ואז מה שנוסף או חסר. 47 במקום 46 מסגיר מיד שיש כרומוזום מיותר, וה-**+21** אומר איזה."},{"id":"c1-mcq-karyotype","type":"mcq","level":2,"q":"מה מתאר הקריוטיפ **45,X**?","options":["זכר עם כרומוזום חסר","פרט עם 45 כרומוזומים וכרומוזום מין יחיד — X","נקבה תקינה","פרט עם שני כרומוזומי X"],"correct":1,"why":["אין כאן Y כלל, ולכן לא מדובר בזכר.","נכון. **45 סך הכל** — אחד פחות מהתקין — ו**X בודד** במקום זוג כרומוזומי מין. חסר כרומוזום מין שלם.","נקבה תקינה היא 46,XX. כאן חסר כרומוזום.","שני X היו נכתבים XX. כאן כתוב X אחד."]},{"id":"c1-concept-homologous","type":"concept","term":"הומולוגיים — זהים אבל לא זהים","text":"כל זוג כרומוזומים נקרא **הומולוגי**. חשוב לדייק מה זה אומר:","rows":[["מה זהה","**אותם גנים**, באותם מיקומים בדיוק"],["מה שונה","**האללים** עצמם — אחד מאמא, אחד מאבא"]],"note":"כלומר בשני הכרומוזומים יש גן לצבע עיניים באותו לוקוס — אבל האלל יכול להיות שונה. **הומולוגי ≠ זהה**, וזו ההבחנה שכל הגנטיקה שלמדת עומדת עליה."},{"id":"c1-concept-ploidy","type":"concept","term":"שני סוגי תאים בגוף","text":"ההבחנה הזו תלווה אותך לאורך כל היחידות הבאות:","rows":[["תא סומטי","**דיפלואידי** — שני עותקים מכל כרומוזום. רוב תאי הגוף"],["תא מין","**הפלואידי** — עותק אחד מכל כרומוזום"]],"note":"יש גם יוצאי דופן: **תאי דם אדומים אין להם גרעין כלל**, ולכן אין בהם חומר גנטי. בזמן חיי התא הכרומוזומים מפוזרים בגרעין; רק לקראת חלוקה הם נארזים לצורה הדחוסה שמוכרת מהתמונות."},{"id":"c1-recap","type":"recap","points":["כרומוזום: **זרוע ארוכה q, זרוע קצרה p**, מופרדות ב**צנטרומר** שדרכו הוא נמשך בחלוקה. ב**טלומרים** שבקצוות תלויה יציבותו.","**קריוטיפ**: מספר הכרומוזומים, כרומוזומי המין, ואז חריגות. 47,XY+21 = זכר עם כרומוזום 21 עודף.","**הומולוגיים = אותם גנים, אללים אפשריים שונים.** תא סומטי דיפלואידי, תא מין הפלואידי."],"next":"עכשיו נראה מה קורה לכרומוזומים האלה בכל פעם שתא מתחלק — ולמה החלוקה חייבת להיות מדויקת לחלוטין."}]},{"id":"cell-02","title":"מחזור התא ומיטוזה","estMinutes":11,"source":"שיעור 12, עמ' 39–41","cards":[{"id":"c2-hook","type":"hook","text":"כל יום מתחלקים בגופך מיליארדי תאים.","sub":"בכל חלוקה צריך לחלק 46 כרומוזומים לשני תאים, בלי לאבד ובלי להכפיל אף אחד. איך זה לא משתבש?"},{"id":"c2-concept-cycle","type":"concept","term":"מחזור חיי התא","text":"לפני שתא מתחלק הוא חייב **להכפיל את ה-DNA שלו**. השלב הזה נקרא **שלב S**.\n\nאחריו יש בתא כמות כפולה של חומר גנטי — **4n** — וכל כרומוזום מורכב כעת משני עותקים זהים.","rows":[["לפני S","2n — כל כרומוזום עותק אחד"],["אחרי S","4n — כל כרומוזום שני עותקים מחוברים"]],"note":"שני העותקים הזהים נקראים **כרומטידות אחיות**, והם מחוברים זה לזה **דרך הצנטרומר**. זה בדיוק התפקיד שלו שהזכרנו בשיעור הקודם."},{"id":"c2-concept-g0","type":"concept","term":"G0: תאים שיצאו מהמעגל","text":"לא כל תא מתחלק. יש תאים שנכנסים לשלב **G0** — מצב המתנה ללא הגבלת זמן, מחוץ למחזור חיי התא.","note":"לפעמים המצב **הפיך**: רקמה שנפגעה יכולה להחזיר תאים מ-G0 לחלוקה כדי לתקן את הנזק. בתרבית תאים, מצב של סטרס יעצור את החלוקה — וכשהסטרס יחלוף, התאים יחזרו להתחלק.","alt":[{"title":"שלושה סוגי תאים","text":"**לא מתחלקים בכלל** — כמו נוירונים בוגרים.\n**מתחלקים לפי צורך** — תאי כבד, שמחכים ב-G0 עד שנדרש תיקון.\n**מתחלקים כל הזמן** — עור, מעי, מח עצם.\n\nהחלוקה הזו מסבירה למה סוגי סרטן שונים מתנהגים אחרת: הם מתחילים ברקמות עם קצב חלוקה שונה."}]},{"id":"c2-concept-mitosis","type":"concept","term":"מיטוזה","text":"**מיטוזה** היא החלוקה שבה תא סומטי אחד הופך לשני תאים סומטיים נפרדים — **כל אחד עם 2n כרומוזומים**, זהים למקור.\n\nהיא מתחילה אחרי שלב S, כשבתא כבר יש 4n.","note":"המטרה: **שני תאים זהים לחלוטין למקור ולזה לזה.** זה ההבדל המהותי ממיוזה, שנלמד בשיעור הבא ושבה המטרה הפוכה — ליצור שונות."},{"id":"c2-concept-stages","type":"concept","term":"ארבעת השלבים","text":"כל שלב עושה דבר אחד, וזה מה שמקל על הזכירה:","rows":[["פרופאזה","הכרומוזומים **נדחסים**, וממברנת הגרעין **מתפרקת**"],["מטאפאזה","הכרומוזומים **מסתדרים על מישור המשווה** — קו האמצע של התא"],["אנאפאזה","הכרומטידות **נמשכות ונפרדות** לשני הקצוות"],["טלופאזה","ממברנת הגרעין **נבנית מחדש**, והתא מתחלק סופית לשניים"]],"note":"במטאפאזה נוצרים שני מוקדים בקצוות מנוגדים של התא, ומכל אחד יוצאים סיבים שנקשרים לכרומטידה אחת. **כל אחת מהאחיות נקשרת לצד אחר** — וזה מה שמבטיח חלוקה מדויקת."},{"id":"c2-order-mitosis","type":"order","q":"סדר את שלבי המיטוזה מהראשון לאחרון.","items":["פרופאזה — הכרומוזומים נדחסים וממברנת הגרעין מתפרקת","מטאפאזה — הכרומוזומים מסתדרים על מישור המשווה","אנאפאזה — הכרומטידות האחיות נפרדות לקצוות","טלופאזה — הגרעין נבנה מחדש והתא מתחלק"],"why":"**פרו → מטא → אנא → טלו.** דרך לזכור: קודם מתארגנים (פרו), אז מסתדרים בשורה (מטא), אז נפרדים (אנא), ואז מסיימים (טלו)."},{"id":"c2-mcq-anaphase","type":"mcq","level":2,"q":"בסוף האנאפאזה במיטוזה, כמה כרומוזומים יש בכל קצה של התא?","options":["23","46","92","תלוי בסוג התא"],"correct":1,"why":["23 הוא מספר הכרומוזומים בגמטה, שנוצרת במיוזה — לא במיטוזה.","נכון. הכרומטידות האחיות נפרדו, וכל קצה קיבל **סט מלא של 46**. שני התאים שייווצרו יהיו זהים למקור.","92 היה בתא כולו אחרי שלב S, לפני ההפרדה — לא בכל קצה בנפרד.","בכל התאים הסומטיים התוצאה זהה: 46 בכל צד."]},{"id":"c2-pitfall-independent","type":"pitfall","text":"**במיטוזה הכרומוזומים ההומולוגיים לא נפגשים בכלל.**\n\nכל כרומוזום מתנהג לגמרי בנפרד. הוא לא מחפש את בן הזוג שלו, ואין ביניהם שום אינטראקציה לאורך התהליך.","punch":"וזו בדיוק הנקודה שתשתנה במיוזה — שם ההומולוגיים **כן** נפגשים, וזה משנה הכל."},{"id":"c2-mcq-purpose","type":"mcq","level":3,"q":"תא סומטי עבר שלב S אך **לא** השלים את המיטוזה, ולא התחלק. מה מצבו?","options":["יש בו 46 כרומוזומים כרגיל","יש בו כמות כפולה של חומר גנטי — 4n","הוא הפך לתא מין","הוא ימות בהכרח"],"correct":1,"why":["לא. שלב S כבר הכפיל את ה-DNA, והחלוקה שהייתה מחזירה אותו ל-2n לא קרתה.","נכון. **שלב S מכפיל, המיטוזה מחלקת בחזרה.** אם החלוקה לא הושלמה, הכמות הכפולה נשארת בתא אחד.","תא סומטי לא הופך לתא מין. מיוזה מתרחשת רק בגונדות.","לא בהכרח מיידית — אבל מצב כזה הוא אחד המקורות לאי-יציבות גנומית ולסרטן."]},{"id":"c2-recap","type":"recap","points":["**שלב S מכפיל את ה-DNA** ל-4n. שני העותקים הזהים הם **כרומטידות אחיות**, מחוברות בצנטרומר.","**פרופאזה → מטאפאזה → אנאפאזה → טלופאזה.** דחיסה, הסתדרות בשורה, הפרדה, סיום.","התוצאה: **שני תאים זהים למקור, 2n כל אחד.** הכרומוזומים ההומולוגיים אינם נפגשים כלל."],"next":"עכשיו החלוקה השנייה — זו שמייצרת תאי מין. שם ההומולוגיים כן נפגשים, ומשם מגיעה כל השונות בין אחים."}]}],"plan":2},{"id":"08-meiosis","title":"מיוזה, שחלוף ושונות","lectures":"13","pages":"41–44","lessons":[{"id":"mei-01","title":"מיוזה: שתי חלוקות, ארבעה תאים","estMinutes":12,"source":"שיעור 13, עמ' 41–43","cards":[{"id":"e1-hook","type":"hook","text":"במיטוזה יצאו שני תאים זהים למקור.","sub":"כאן המטרה הפוכה: ארבעה תאים, **כולם שונים זה מזה ומהמקור**. וזו לא תקלה — זו כל הנקודה."},{"id":"e1-concept-why","type":"concept","term":"המשימה: מ-2n ל-n","text":"מיוזה מתרחשת רק ב**גונדות** — השחלות אצל נשים והאשכים אצל גברים. המטרה שלה אחת: להפוך תא דיפלואידי לתאי מין **הפלואידיים**.","note":"אם הגמטה הייתה נשארת 2n, לצאצא היו 4n כרומוזומים. **אפילו כרומוזום אחד מיותר יוצר בעיה קשה** — נראה את זה ביחידה 9 — ולכן המספר חייב להיות מדויק."},{"id":"e1-concept-two-divisions","type":"concept","term":"שתי חלוקות, ולא אחת","text":"גם כאן מתחילים אחרי שלב S, כשבתא יש **4n**. אבל במקום חלוקה אחת, יש שתיים — וכל אחת מפרידה משהו אחר:","rows":[["מיוזה I","מפרידה בין **הכרומוזומים ההומולוגיים**"],["מיוזה II","מפרידה בין **הכרומטידות האחיות** — כמו מיטוזה"]],"note":"**זו ההבחנה החשובה ביותר בפרק.** בחלוקה הראשונה נפרדים בני הזוג — האחד מאמא, השני מאבא. בשנייה נפרדים העותקים הזהים.","alt":[{"title":"למה צריך דווקא שתיים","text":"שלב S הכפיל את הכמות ל-4n. כדי להגיע ל-n צריך **לחלק בארבע** — וזה לא אפשרי בחלוקה אחת.\n\nחלוקה ראשונה: 4n → 2n בכל תא.\nחלוקה שנייה: 2n → n בכל תא.\n\n4n מתחלק לארבעה תאי n. החשבון פשוט, וממנו נובע כל המבנה."}]},{"id":"e1-concept-synapsis","type":"concept","term":"פרופאזה I: הכרומוזומים מוצאים זה את זה","text":"כאן קורה הדבר שלא קורה במיטוזה כלל. כל כרומוזום **מוצא את בן הזוג ההומולוגי שלו** ונצמד אליו:","rows":[["זיווג","כל כרומוזום מאתר את ההומולוג שלו"],["סינפסיס","השניים נצמדים לכל אורכם"],["התוצאה","**ארבעה** כרומוזומים מחוברים — שני הומולוגים והכרומטידות האחיות שלהם"]],"note":"ההצמדה נעשית על ידי קומפלקס חלבוני. יש לו שני תפקידים: **להבטיח שכל הומולוג יגיע לתא בת אחר**, ו**לאפשר את השחלוף**. אם ההצמדה נכשלת — שני ההומולוגים עלולים להגיע לאותו תא, ואחד יישאר ריק."},{"id":"e1-concept-crossover","type":"concept","term":"שחלוף וכיאזמות","text":"בזמן שההומולוגים צמודים, **אזורים שלמים עוברים ביניהם**. זה נקרא **שחלוף** (crossing over).\n\nהאזורים שמוחלפים הם הומולוגיים — כלומר מכילים את אותם הגנים, אך אללים אחרים.","rows":[["מה מוחלף","אזורים מקבילים, אותם גנים"],["כיאזמה","**נקודת ההצטלבות** שבה בוצע השחלוף"],["התוצאה","כרומוזומים עם **צירופי אללים חדשים** שלא היו בהורים"]],"note":"אחרי השחלוף הקומפלקס מתפרק, והכרומוזומים נשארים מחוברים **רק בכיאזמות** — עד האנאפאזה, שבה הם נפרדים סופית. **כל ארבעת הכרומוזומים נשארים באותו אורך** ומכילים את אותם גנים, רק בשילובים אחרים."},{"id":"e1-order-meiosis1","type":"order","q":"סדר את האירועים בפרופאזה I של המיוזה.","items":["כל כרומוזום מאתר את ההומולוג שלו","השניים נצמדים זה לזה לכל אורכם — סינפסיס","מתרחש שחלוף, ואזורים עוברים בין ההומולוגים","הקומפלקס מתפרק והכרומוזומים נשארים מחוברים רק בכיאזמות"],"why":"**זיווג → הצמדה → שחלוף → כיאזמות.** ההצמדה חייבת לקדום לשחלוף, כי בלי מגע צמוד אין החלפה. והכיאזמות הן מה שנשאר **אחרי** שההחלפה כבר בוצעה."},{"id":"e1-mcq-meiosis1","type":"mcq","level":2,"q":"מה נפרד באנאפאזה של **מיוזה I**?","options":["הכרומטידות האחיות","הכרומוזומים ההומולוגיים","הצנטרומרים","הגרעין לשניים"],"correct":1,"why":["הכרומטידות האחיות נפרדות רק ב**מיוזה II**. במיוזה I הן עדיין מחוברות.","נכון. **מיוזה I מפרידה בין בני הזוג** — הכרומוזום מאמא הולך לתא אחד, זה מאבא לשני. זה הרגע שבו התא הופך מדיפלואידי להפלואידי.","הצנטרומר לא מתפצל במיוזה I. הוא נשאר שלם ומחזיק את שתי האחיות יחד.","חלוקת הגרעין היא תוצאה של התהליך, לא מה שנפרד."]},{"id":"e1-pitfall-vs-mitosis","type":"pitfall","text":"**רק במיוזה יש שחלוף. במיטוזה — אף פעם.**\n\nבמיטוזה כל כרומוזום מתפצל בפני עצמו, בלי קשר להומולוג שלו. אין זיווג, אין הצמדה, ואין החלפת אזורים.","punch":"זו שאלת מבחן קלאסית, ולכן שווה לקבע: **זיווג הומולוגים ושחלוף = מיוזה בלבד.**"},{"id":"e1-concept-result","type":"concept","term":"התוצאה","text":"מתא אחד שנכנס למיוזה יוצאים **ארבעה תאי מין** — וכל אחד מהם עם גנום **שונה** מהאחרים.","rows":[["מיטוזה","2 תאים · **זהים** למקור · 2n"],["מיוזה","4 תאים · **שונים** זה מזה · n"]],"note":"שים לב עד כמה שתי המטרות הפוכות: מיטוזה נועדה **לשכפל בדיוק**, מיוזה נועדה **לייצר שונות**. אותם כרומוזומים, שני תהליכים עם כוונות מנוגדות."},{"id":"e1-mcq-count","type":"mcq","level":3,"q":"תא אנושי נכנס למיוזה. כמה כרומוזומים יהיו בכל אחד מארבעת התאים הסופיים?","options":["46","23","92","4"],"correct":1,"why":["46 הוא המספר בתא הסומטי — ובגמטה זה היה יוצר עובר עם 92.","נכון. **23 בכל תא.** התא התחיל ב-46, הכפיל ל-92 בשלב S, ואז שתי חלוקות הביאו אותו ל-23.","92 היה בתא כולו אחרי שלב S, לפני שתי החלוקות.","4 הוא מספר התאים שנוצרים, לא מספר הכרומוזומים בכל אחד."]},{"id":"e1-recap","type":"recap","points":["מיוזה מתרחשת ב**גונדות** בלבד ומייצרת **4 תאי מין הפלואידיים** מתא דיפלואידי אחד.","**מיוזה I מפרידה בין ההומולוגים. מיוזה II מפרידה בין הכרומטידות האחיות.** זו ההבחנה הנבחנת ביותר.","בפרופאזה I: **זיווג → סינפסיס → שחלוף → כיאזמות.** שחלוף מתרחש **רק במיוזה**, לעולם לא במיטוזה."],"next":"עכשיו נחשב כמה שונות המנגנון הזה באמת מייצר — והתשובה גדולה בהרבה ממה שנראה."}]},{"id":"mei-02","title":"מאיפה מגיעה השונות בין אחים","estMinutes":11,"source":"שיעור 13–14, עמ' 42–44","cards":[{"id":"e2-hook","type":"hook","text":"לשני אחים אותם הורים בדיוק, ואותו מאגר גנים.","sub":"ובכל זאת הם לעולם לא זהים. שני מנגנונים במיוזה אחראים לזה — ואפשר לחשב בדיוק כמה שונות הם מייצרים."},{"id":"e2-concept-source1","type":"concept","term":"מקור ראשון: שחלוף","text":"בשחלוף, ההומולוגים **מערבבים ביניהם אזורים**. התוצאה היא כרומוזום שלא היה קיים אצל אף אחד מההורים.","note":"הכרומוזום שאתה מעביר לילד שלך אינו \"הכרומוזום של אמא\" או \"הכרומוזום של אבא\" — הוא **פסיפס של שניהם**. וכל מיוזה מייצרת פסיפס אחר."},{"id":"e2-concept-source2","type":"concept","term":"מקור שני: התפצלות בלתי תלויה","text":"כל זוג כרומוזומים מתחלק בין שני התאים **בלי קשר** לזוגות האחרים.\n\nלא שולחים את כל הכרומוזומים של אמא לתא אחד ואת של אבא לשני. **כל זוג מגריל בנפרד.**","rows":[["3 כרומוזומים","2³ = 8 חלוקות אפשריות"],["23 כרומוזומים","**2²³** — יותר מ-8 מיליון"]],"note":"וזה **לפני** שהוספנו שחלוף. הנוסחה הכללית: **2 בחזקת מספר זוגות הכרומוזומים.**"},{"id":"e2-mcq-independent","type":"mcq","level":2,"q":"ליצור מסוים יש 4 זוגות כרומוזומים. כמה צירופים אפשריים של כרומוזומים בגמטה — **בלי** להתחשב בשחלוף?","options":["4","8","16","24"],"correct":2,"why":["4 הוא מספר הזוגות, לא מספר הצירופים.","8 היה נכון ל-3 זוגות (2³).","נכון. **2⁴ = 16.** כל זוג תורם החלטה בינארית עצמאית — מאמא או מאבא — וההחלטות מוכפלות.","24 הוא 4 עצרת, ולא רלוונטי כאן. אין כאן סידור, יש בחירה בינארית לכל זוג."]},{"id":"e2-concept-why-matters","type":"concept","term":"למה השונות חשובה","text":"השונות אינה תופעת לוואי — היא **הסיבה** שהמיוזה בנויה כך.\n\nהיא פועלת ברמת המין, לא ברמת הפרט:","note":"אם כל הפרטים היו זהים גנטית, אסון אחד — מגפה, שינוי אקלים — היה יכול למחוק את כולם יחד. **שונות גנטית מבטיחה שתמיד יהיו פרטים ששורדים** תנאים שמחסלים את האחרים. זו הסיבה שרבייה מינית קיימת בכלל.","alt":[{"title":"התמורה של רבייה מינית","text":"רבייה לא מינית פשוטה יותר: מעתיקים את עצמך, וזהו.\n\nרבייה מינית דורשת בן זוג, מיוזה מסובכת, ומעבירה רק חצי מהגנים שלך.\n\nהמחיר הזה משתלם **רק** בגלל השונות. זה מה שקונים בו."}]},{"id":"e2-concept-sex-chrom","type":"concept","term":"ומה עם X ו-Y?","text":"המיוזה דורשת שכל כרומוזום יזדווג עם הומולוג. אצל נקבה אין בעיה — שני X. **אבל אצל גבר, X ו-Y שונים לגמרי.**","note":"הפתרון: בקצוות של X ו-Y יש **אזורים פסאודו-אוטוזומליים** — קטעים שכן מכילים את אותם גנים. דרכם השניים מזדווגים בפרופאזה I, ואפילו מבצעים שחלוף. בלי האזורים האלה, החלוקה של כרומוזומי המין לא הייתה מתאפשרת כלל."},{"id":"e2-mcq-compare","type":"mcq","level":3,"q":"איזו אמירה נכונה לגבי ההבדל בין מיטוזה למיוזה?","options":["בשתיהן מתרחש שחלוף, אבל במיוזה יותר","רק במיוזה יש זיווג הומולוגים ושחלוף","רק במיטוזה נפרדות הכרומטידות האחיות","בשתיהן נוצרים תאים הפלואידיים"],"correct":1,"why":["במיטוזה **אין שחלוף כלל**. ההומולוגים אפילו לא נפגשים.","נכון. **זיווג ושחלוף הם ייחודיים למיוזה.** במיטוזה כל כרומוזום מתפצל בפני עצמו.","הכרומטידות האחיות נפרדות בשתיהן — במיטוזה, וגם במיוזה II.","מיטוזה מייצרת תאים **דיפלואידיים** זהים למקור. רק מיוזה מייצרת הפלואידיים."]},{"id":"e2-concept-nondisjunction","type":"concept","term":"כשההפרדה נכשלת: אי-הפרדה","text":"באנאפאזה, חוטים מושכים כל כרומוזום לצד אחר. **לפעמים זה משתבש** — שני הכרומוזומים נמשכים לאותו צד.\n\nהמצב הזה נקרא **אי-הפרדה** (non-disjunction).","rows":[["תא אחד","מקבל **שני** עותקים במקום אחד"],["התא השני","לא מקבל **אף** עותק"]],"note":"זהו אירוע נדיר, אבל הוא קיים. הוא יכול לקרות **בשתי האנאפאזות של המיוזה** וגם במיטוזה — ולכל אחת מהאפשרויות האלה תוצאה שונה. זה כל הנושא של היחידה הבאה.","alt":[{"title":"איפה זה מתחיל","text":"אמרנו שהקומפלקס בפרופאזה I נועד **להבטיח** שכל הומולוג יגיע לתא אחר.\n\nכשההצמדה לא נעשית היטב, ההבטחה הזו נשברת. שני ההומולוגים נמשכים יחד, ותא הבת השני נשאר בלי כלום.\n\nמכאן הדרך לתסמונת דאון קצרה מאוד."}]},{"id":"e2-mcq-nondisjunction","type":"mcq","level":3,"q":"אי-הפרדה במיוזה I. מה יהיה מצב **ארבעת** תאי המין שייווצרו?","options":["כולם תקינים","שניים עם כרומוזום עודף, שניים חסרים","אחד עודף, שלושה תקינים","כולם עם כרומוזום עודף"],"correct":1,"why":["אי-הפרדה בהגדרה מייצרת תאים לא תקינים.","נכון. אחרי מיוזה I יש תא אחד עם שני העותקים ותא אחד בלי אף אחד. **מיוזה II מחלקת כל אחד מהם לשניים** — ולכן שניים עודפים ושניים חסרים.","זה היה מצב אפשרי לו התקלה קרתה במיוזה **II**, שם רק אחד מהתאים מושפע.","התא שנשאר בלי עותק מייצר תאים **חסרים**, לא עודפים."]},{"id":"e2-recap","type":"recap","points":["**שני מקורות לשונות**: שחלוף מערבב אזורים בין הומולוגים, והתפצלות בלתי תלויה מגרילה כל זוג בנפרד — **2²³ צירופים** אצל אדם.","אצל גבר, X ו-Y מזדווגים דרך **אזורים פסאודו-אוטוזומליים** בקצוות.","**אי-הפרדה** = שני כרומוזומים נמשכים לאותו צד. תא אחד מקבל עודף, השני נשאר חסר."],"next":"וזה בדיוק הנושא של היחידה הבאה: מה קורה לעובר שנוצר מגמטה כזו — ולמה חלק מהמצבים ברי-קיימא וחלק לא."}]}],"plan":2},{"id":"09-chromosomal","title":"הפרעות כרומוזומליות","lectures":"13–16","pages":"44–51","lessons":[{"id":"chr-01","title":"טריזומיות: כרומוזום אחד יותר מדי","estMinutes":11,"source":"שיעור 14, עמ' 44–45","cards":[{"id":"h1-hook","type":"hook","text":"כרומוזום אחד עודף. לא מוטציה, לא אלל פגום — פשוט עותק שלישי.","sub":"וזה מספיק כדי לשנות התפתחות שלמה. למה תוספת של גנים תקינים גורמת נזק בכלל?"},{"id":"h1-concept-aneuploidy","type":"concept","term":"אנאופלואידיה","text":"**אנאופלואידיה** = מספר כרומוזומים חריג. היא נובעת מ**אי-הפרדה** באחת מחלוקות המיוזה.","rows":[["טריזומיה","שלושה עותקים במקום שניים"],["מונוזומיה","עותק אחד במקום שניים"]],"note":"**כרומוזום שלם מכיל מאות גנים.** תוספת שלו משבשת את הכמויות של כל אחד מהם בבת אחת — ולכן הנזק כה נרחב, גם כשכל הגנים עצמם תקינים לחלוטין.","alt":[{"title":"למה תקין־אבל־עודף זה נזק","text":"אמרנו כבר שגנים עובדים **לפי כמות**. פי 1.5 חלבון מכל גן על כרומוזום שלם זה שיבוש רוחבי.\n\nזו בדיוק הבעיה שהשתקת X נועדה למנוע — ושם הפתרון היה לכבות עותק שלם.\n\nלכרומוזומים אוטוזומליים אין מנגנון כזה."}]},{"id":"h1-concept-viable","type":"concept","term":"שלוש בלבד ברות-קיימא","text":"מבין כל 22 הטריזומיות האוטוזומליות האפשריות, **רק שלוש מאפשרות לידה**. כל השאר לטליות בשלב העובר.","rows":[["טריזומיה 21","**תסמונת דאון** — היחידה שמאפשרת חיים ארוכים"],["טריזומיה 18","**תסמונת אדוארדס** — רוב התינוקות נפטרים עד גיל שנה"],["טריזומיה 13","**תסמונת פאטו** — נדירה עוד יותר, לרוב מוות עד גיל חודש"]],"note":"הקריוטיפ נכתב **47,XX,+18** או **47,XY,+13**. שים לב לתבנית: **ככל שהכרומוזום גדול יותר, כך יש עליו יותר גנים — והפגיעה קשה יותר.** 21 הוא מהקטנים בגנום, ולכן הוא היחיד שמאפשר חיים ארוכים."},{"id":"h1-mcq-karyotype","type":"mcq","level":2,"q":"מה מתאר הקריוטיפ **47,XY,+21**?","options":["זכר עם תסמונת אדוארדס","זכר עם תסמונת דאון","נקבה עם כרומוזום מין עודף","זכר עם 21 כרומוזומים"],"correct":1,"why":["אדוארדס היא טריזומיה **18**, לא 21.","נכון. 47 כרומוזומים, XY (זכר), והכרומוזום העודף הוא **21** — כלומר טריזומיה 21, תסמונת דאון.","XY מציין זכר, והעודף הוא אוטוזומלי ולא כרומוזום מין.","המספר 47 בהתחלה הוא **סך הכל**. ה-21 מציין איזה כרומוזום עודף."]},{"id":"h1-concept-maternal-age","type":"concept","term":"למה גיל האם משנה","text":"שכיחות תסמונת דאון — וכל האנאופלואידיות — **עולה עם גיל האם**, ומגיל 35 הסיכוי מזנק. ההסבר נמצא בעיתוי של המיוזה הנשית:","rows":[["בעוברות","כל תאי הביצית מתחילים מיוזה — ו**נעצרים בפרופאזה**"],["מגיל ההתבגרות","מדי חודש תא אחד בלבד משלים את התהליך"],["בינתיים","כל שאר התאים **ממתינים בשחלות** — שנים על גבי שנים"]],"note":"והנה הנקודה: **הקומפלקס החלבוני שמחזיק את ההומולוגים צמודים נחלש עם הזמן.** ככל שהתא ממתין יותר, כך גדל הסיכוי שההפרדה תשתבש. ביצית של אישה בת 40 המתינה 40 שנה בפרופאזה.","alt":[{"title":"ההבדל מגברים","text":"אצל גבר תאי הזרע מיוצרים **מחדש כל הזמן**, לאורך כל החיים. כל תא עובר מיוזה מלאה תוך שבועות.\n\nאצל אישה, המלאי נוצר פעם אחת לפני הלידה, ומשם רק ממתין.\n\n**זה ההסבר לכל אפקט גיל האם.** לא איכות הביצית באופן כללי — אלא משך ההמתנה של קומפלקס חלבוני."}]},{"id":"h1-mcq-age","type":"mcq","level":3,"q":"למה אפקט הגיל על אנאופלואידיות בולט הרבה יותר אצל נשים מאשר אצל גברים?","options":["כי נשים מבוגרות נחשפות ליותר מוטגנים","כי ביציות ממתינות עצורות בפרופאזה עשרות שנים, והקומפלקס שמחזיק את ההומולוגים נחלש","כי לנשים יש שני כרומוזומי X","כי המיוזה אצל נשים כוללת שחלוף ואצל גברים לא"],"correct":1,"why":["חשיפה סביבתית גורמת למוטציות נקודתיות, לא לכשל בהפרדת כרומוזומים.","נכון. **התאים לא מתחדשים — הם ממתינים.** ככל שההמתנה ארוכה יותר, ההצמדה נחלשת והסיכוי לאי-הפרדה עולה.","מספר כרומוזומי ה-X לא קשור לאי-הפרדה של כרומוזומים אוטוזומליים.","שחלוף מתרחש בשני המינים. זו לא ההבחנה."]},{"id":"h1-pitfall-not-mutation","type":"pitfall","text":"**טריזומיה היא לא מוטציה.**\n\nאין כאן אף גן פגום. כל הגנים על שלושת העותקים תקינים לחלוטין — הבעיה היא **הכמות**, לא האיכות.","punch":"ולכן גם אין \"נשא\" של טריזומיה, ואין לה דפוס הורשה מנדלי. היא נוצרת מחדש בכל מקרה, מתקלה בחלוקה."},{"id":"h1-mcq-monosomy","type":"mcq","level":2,"q":"אי-הפרדה במיוזה מייצרת גמטה עם כרומוזום עודף — **וגם** גמטה שחסר בה כרומוזום. למה כמעט לא רואים מונוזומיות אוטוזומליות?","options":["כי גמטות חסרות לא נוצרות","כי חוסר בכרומוזום שלם קשה יותר מעודף, והעובר אינו בר-קיימא","כי הן מתוקנות על ידי התא","כי הן קיימות אך אינן מאובחנות"],"correct":1,"why":["הן בהחלט נוצרות — בכל אירוע אי-הפרדה נוצרות גם וגם.","נכון. **חוסר מוחלט של מאות גנים הרסני יותר מעודף שלהם.** העוברים האלה כמעט תמיד אינם שורדים, ולכן לא מגיעים ללידה.","אין מנגנון שמייצר כרומוזום חסר מחדש.","הן פשוט לא מגיעות ללידה, ולכן אין את מי לאבחן."]},{"id":"h1-recap","type":"recap","points":["**אנאופלואידיה** = מספר כרומוזומים חריג, מ**אי-הפרדה**. הבעיה היא כמות של גנים תקינים, לא גן פגום.","רק **שלוש טריזומיות אוטוזומליות** ברות-קיימא: **21 (דאון), 18 (אדוארדס), 13 (פאטו)** — וככל שהכרומוזום גדול יותר, הפגיעה קשה יותר.","**גיל האם**: ביציות ממתינות עצורות בפרופאזה עשרות שנים, והקומפלקס המחזיק נחלש. מונוזומיות אוטוזומליות אינן ברות-קיימא כלל."],"next":"אבל יש קבוצה שלמה של אנאופלואידיות שכן מאפשרות חיים תקינים כמעט — וזה לא במקרה דווקא בכרומוזומי המין."}]},{"id":"chr-02","title":"כרומוזומי מין ומוזאיקה","estMinutes":11,"source":"שיעור 14, עמ' 45–46","cards":[{"id":"h2-hook","type":"hook","text":"אדם עם 47 כרומוזומים, שמגלה את זה רק בגיל 30 — כשמנסה להביא ילדים.","sub":"בטריזומיה אוטוזומלית זה בלתי אפשרי. אז מה שונה כשהכרומוזום העודף הוא כרומוזום מין?"},{"id":"h2-concept-why-mild","type":"concept","term":"למה זה כל כך פחות חמור","text":"אנאופלואידיות של כרומוזומי המין הן **קלות באופן יוצא דופן** בהשוואה לאוטוזומליות. שתי סיבות, ושתיהן כבר מוכרות לך:","rows":[["X עודף","**מושתק.** מנגנון השתקת X מטפל בו כמו בכל X נוסף"],["Y עודף","**קטן מאוד וכמעט בלי גנים**, ולכן כמעט לא משפיע"]],"note":"כלומר הגוף כבר **מצויד במנגנון** להתמודד עם עודף של X — הוא בנוי לזה מלכתחילה. לכרומוזומים אוטוזומליים אין שום מנגנון מקביל, ולכן כל עודף שם הרסני."},{"id":"h2-concept-klinefelter","type":"concept","term":"47,XXY — תסמונת קליינפלטר","text":"שני כרומוזומי X וכרומוזום Y אחד. **הפנוטיפ זכרי** — כי יש Y, ולכן יש SRY.","rows":[["פוריות","אי-פוריות"],["גובה","גבוהים מהממוצע"],["אבחון","לרוב **רק בבגרות**"]],"note":"המומים קלים יחסית, ולכן המצב מתגלה בדרך כלל בשלב מאוחר — לעיתים רק בבירור של קשיי פוריות. השווה זאת לטריזומיה 18, שמאובחנת בלידה."},{"id":"h2-concept-others","type":"concept","term":"47,XXX ו-45,X","text":"שני מצבים נוספים, בשני קצוות של החומרה:","rows":[["47,XXX","פגיעה **קלה עוד יותר**. הנשים פוריות, ולעיתים כלל לא מאובחנות"],["45,X","**תסמונת טרנר** — המונוזומיה **היחידה** שמאפשרת חיים"]],"note":"בתסמונת טרנר יש שונות רבה: לפעמים אין סימנים כלל, לפעמים המצב מתגלה רק בניסיון להרות, ולפעמים יש סימנים משמעותיים יותר. **זכור את החריגות שלה** — בכל כרומוזום אחר בגנום, מונוזומיה אינה ברת-קיימא.","alt":[{"title":"למה דווקא X שורד לבד","text":"כי **גבר חי כך ממילא.** לגבר יש X אחד בלבד בכל תא, וזה תקין לחלוטין.\n\nהגוף יודע לעבוד עם עותק אחד של X — זו ברירת המחדל שלו אחרי ההשתקה.\n\nבכל כרומוזום אוטוזומלי, עותק בודד פירושו חוסר של מאות גנים שאין להם גיבוי."}]},{"id":"h2-mcq-turner","type":"mcq","level":2,"q":"למה **45,X** היא המונוזומיה היחידה שמאפשרת חיים?","options":["כי X הוא הכרומוזום הקטן ביותר","כי גם באדם תקין רק X אחד פעיל בכל תא — הגוף מסתדר עם עותק אחד","כי כרומוזום Y משלים את החסר","כי היא מתוקנת בהתפתחות העוברית"],"correct":1,"why":["X הוא דווקא מהגדולים בגנום. הגודל אינו ההסבר.","נכון. **השתקת X אומרת שבכל תא פעיל X אחד בלבד** — גם אצל נשים תקינות. לכן מצב של X יחיד אינו זר למערכת.","ב-45,X אין Y בכלל.","אין מנגנון שמייצר כרומוזום חסר."]},{"id":"h2-concept-mosaic","type":"concept","term":"מוזאיקה: כשהתקלה קרתה מאוחר","text":"עד עכשיו ההפרעה הייתה **בכל התאים** — כי היא הגיעה מתא המין שממנו נוצר העובר.\n\nאבל לפעמים המיוזה הייתה תקינה והעובר התחיל תקין — ורק **באחת המיטוזות** מאוחר יותר קרתה אי-הפרדה.","rows":[["מיוזה תקינה","העובר מתחיל את חייו עם קריוטיפ תקין"],["מיטוזה פגומה","נוצר תא טריזומי ותא מונוזומי"],["התוצאה","**שתי שורות תאים** באותו אדם"]],"note":"התא המונוזומי לרוב אינו שורד. הטריזומי ממשיך להתחלק, **וכל התאים שייווצרו ממנו יישאו את אותה הפרעה.** התוצאה: אדם שחלק מתאיו תקינים וחלק לא."},{"id":"h2-mcq-mosaic-severity","type":"mcq","level":3,"q":"מה קובע את חומרת התסמינים אצל אדם עם מוזאיקה?","options":["רק סוג הכרומוזום המעורב","כמות התאים הפגועים ומיקומם בגוף","גיל האם בלידה","מספר החלוקות שעבר העובר"],"correct":1,"why":["סוג הכרומוזום קובע איזו תסמונת, אבל לא את החומרה במוזאיקה.","נכון. **כמה תאים נפגעו ואיפה הם יושבים.** אם המעט שנפגע יושב ברקמה לא קריטית — ייתכן שלא נדע כלל. אם הרבה נפגעו, המצב יידמה לתסמונת המלאה.","גיל האם משפיע על הסיכוי לאי-הפרדה **במיוזה**. מוזאיקה נובעת ממיטוזה, אחרי ההפריה.","מספר החלוקות משפיע בעקיפין על כמות התאים, אבל המיקום קובע לא פחות."]},{"id":"h2-mcq-mosaic-children","type":"mcq","level":3,"q":"אדם עם מוזאיקה מביא ילדים. מה יהיה מצבם?","options":["כולם יהיו עם מוזאיקה","תלוי אילו תאי מין שלו פגועים — ייתכנו ילדים תקינים וייתכנו חולים","כולם יהיו תקינים","כולם יהיו חולים במחלה המלאה"],"correct":1,"why":["מוזאיקה אינה עוברת כמוזאיקה. הילד נוצר מ**תא מין אחד**, ומצבו נקבע לפיו.","נכון. אם הילד נוצר מ**תא מין תקין** — הוא ייוולד תקין. אם מ**תא מין פגום** — הוא ייוולד עם התסמונת המלאה, בכל תאיו. ייתכן גם שכל תאי המין שלו פגועים, ואז כל צאצאיו יהיו חולים.","אין ערובה לכך. תלוי לגמרי אילו תאי מין נפגעו.","רק אם במקרה כל תאי המין שלו פגועים — לא בהכרח."]},{"id":"h2-recap","type":"recap","points":["אנאופלואידיות של כרומוזומי מין **קלות בהרבה**: X עודף מושתק, ו-Y כמעט חסר גנים.","**47,XXY** קליינפלטר (פנוטיפ זכרי, אי-פוריות) · **47,XXX** קלה מאוד · **45,X** טרנר — **המונוזומיה היחידה** שמאפשרת חיים.","**מוזאיקה** נובעת מאי-הפרדה ב**מיטוזה** אחרי ההפריה. החומרה תלויה בכמות התאים הפגועים ובמיקומם."],"next":"נשארה קטגוריה שלישית: לא עודף ולא חוסר, אלא כרומוזומים שהתחברו למקום הלא נכון — והאדם עצמו בריא לגמרי."}]},{"id":"chr-03","title":"טרנסלוקציות: כשהאדם בריא והבעיה אצל הילדים","estMinutes":12,"source":"שיעור 14–15, עמ' 47–48","cards":[{"id":"h3-hook","type":"hook","text":"אדם בריא לחלוטין, עם כל הגנים שלו — אבל אחד מהם עבר לכרומוזום אחר.","sub":"הוא לא ידע על כך כל חייו. הבעיה מתחילה רק כשהוא מנסה להביא ילדים."},{"id":"h3-concept-balanced","type":"concept","term":"טרנסלוקציה מאוזנת","text":"**טרנסלוקציה** = קטע כרומוזום עבר למקום אחר. כשלא אבד ולא נוסף שום חומר גנטי, היא **מאוזנת**.","note":"וזו הנקודה שקשה לתפוס בהתחלה: **הנשא בריא לגמרי.** יש לו את כל הגנים בכמות הנכונה, רק בסידור אחר. גנים לא צריכים לשבת במקום מסוים כדי לעבוד.","alt":[{"title":"למה הסידור לא משנה לו","text":"תחשוב על ספרייה שבה העבירו מדף שלם מחדר אחד לחדר אחר.\n\n**כל הספרים עדיין שם**, ואפשר לקרוא את כולם. הקטלוג השתנה, התוכן לא.\n\nהבעיה מתחילה רק כשמנסים **לחלק את הספרייה לשניים** — ואז מגלים שהחלוקה כבר לא יוצאת שווה."}]},{"id":"h3-concept-gametes","type":"concept","term":"הבעיה מתחילה במיוזה","text":"בחלוקה, הכרומוזומים אמורים להתפצל כך שכל גמטה תקבל **בדיוק סט אחד**. אצל נשא טרנסלוקציה החלוקה לא יוצאת נקייה:","rows":[["גמטה תקינה","ילד בריא"],["גמטה עם הכרומוזום המחובר","ילד **נשא מאוזן** — בריא, כמו ההורה"],["גמטה לא מאוזנת","**מונוזומיה חלקית וטריזומיה חלקית** — פגיעה בילד"]],"note":"ולכן לזוג כזה יכולים להיוולד ילדים בריאים, ילדים נשאים מאוזנים, וילדים עם פגיעות — **לטליות, חמורות או מינוריות**, תלוי אילו גנים נמצאים באזור הלא מאוזן."},{"id":"h3-mcq-balanced","type":"mcq","level":2,"q":"למה נשא של טרנסלוקציה **מאוזנת** בריא לחלוטין?","options":["כי הטרנסלוקציה תוקנה","כי כל החומר הגנטי קיים בכמות תקינה, רק בסידור אחר","כי הוא הטרוזיגוט","כי הכרומוזום המחובר מושתק"],"correct":1,"why":["הטרנסלוקציה נשארת אצלו לכל החיים.","נכון. **לא אבד ולא נוסף כלום.** כל גן קיים בשני עותקים כמו שצריך, והמיקום הפיזי לא משנה לתפקוד.","הטרוזיגוטיות מתייחסת לאללים, לא לסידור הכרומוזומים.","אין השתקה של כרומוזומים אוטוזומליים."]},{"id":"h3-concept-robertsonian","type":"concept","term":"טרנסלוקציה רוברטסונית","text":"סוג מיוחד, שקורה **רק בכרומוזומים אקרוצנטריים** — אלה שהצנטרומר שלהם קרוב לקצה והזרוע הקצרה זעירה.\n\nבאדם אלה הכרומוזומים **13, 14, 15, 21, 22**.","rows":[["מה קורה","הזרועות הקצרות של שניים מהם **נשברות**"],["ואז","שתי הזרועות הארוכות **מתחברות** דרך הצנטרומר"],["התוצאה","כרומוזום ארוך אחד במקום שניים"]],"note":"טכנית זו אינה טרנסלוקציה מאוזנת לגמרי — **הזרועות הקצרות אבדו**. אבל הן מכילות גנים שחוזרים על עצמם במקומות אחרים בגנום, ולכן ברוב המקרים אין פגיעה כלל והנשא בריא."},{"id":"h3-concept-rob-risk","type":"concept","term":"למה החלוקה מסתבכת","text":"בדרך כלל שני הומולוגים נצמדים ומתחלקים כל אחד לצד אחר. כאן יש **שלושה** כרומוזומים שנצמדים יחד — ולא ברור מי הולך עם מי.","rows":[["שני התקינים יחד","עובר תקין"],["המחובר לבד","**נשא מאוזן** — בריא"],["תקין יחד עם המחובר","**טריזומיה חלקית** — פגיעה"]],"note":"מבין הטרנסלוקציות האפשריות כאן, אלה שמאפשרות חיים הן **טריזומיה 13 וטריזומיה 21** — בדיוק אלה שראית שהן ברות-קיימא. ולכן **טרנסלוקציה רוברטסונית על כרומוזום 21 גורמת לתסמונת דאון**."},{"id":"h3-pitfall-inherited-down","type":"pitfall","text":"**זו הצורה היחידה של תסמונת דאון שעוברת בתורשה.**\n\nהצורה הרגילה נובעת מאי-הפרדה מקרית ולא חוזרת במשפחה. אבל אם אחד ההורים הוא **נשא של טרנסלוקציה רוברטסונית**, הסיכון חוזר בכל היריון.","punch":"ולכן כשנולד ילד עם תסמונת דאון עושים קריוטיפ להורים — כדי לדעת אם מדובר בתקלה חד-פעמית או בסיכון חוזר."},{"id":"h3-mcq-2121","type":"mcq","level":3,"q":"נשא של טרנסלוקציה רוברטסונית שבה **שני כרומוזומי 21** התחברו זה לזה. מה מצב צאצאיו?","options":["25% חולים","50% חולים","כל ילד שייוולד יהיה חולה בתסמונת דאון","כולם יהיו נשאים בריאים"],"correct":2,"why":["היחסים המנדליים לא חלים כאן — אין כרומוזום 21 חופשי בכלל.","50% היה מתקבל אילו הייתה גמטה תקינה אפשרית.","נכון. כל גמטה תכיל **או את הכרומוזום הכפול, או שום 21 בכלל**. הראשונה נותנת טריזומיה 21, השנייה מונוזומיה 21 שאינה ברת-קיימא. **כל ילד שייוולד — יהיה חולה.**","אין אפשרות לנשא מאוזן כאן, כי אין כרומוזום 21 נפרד להשלים."]},{"id":"h3-concept-inversion","type":"concept","term":"אינברסיה: אותו מקום, כיוון הפוך","text":"הפרעה מבנית נוספת: קטע כרומוזום **נשבר, מסתובב, ומתחבר חזרה לאותו מקום — הפוך**.","note":"ברוב המקרים **אין לכך משמעות קלינית** — כל החומר הגנטי נמצא, רק בכיוון אחר. אבל אם השבר התרחש **בדיוק בתוך גן**, הגן נהרס ועלולה להתפתח מחלה. יש אינברסיות נפוצות כל כך שהן נחשבות **וריאנטים תקינים**, וקיימות אצל 1–2% מהאוכלוסייה."},{"id":"h3-concept-terms","type":"concept","term":"שני מונחים לגמטות","text":"כשמתארים את הגמטות שנוצרות במצבים האלה, משתמשים בשני מונחים:","rows":[["נוליזומית","**0 עותקים** של כרומוזום מסוים"],["דיזומית","**2 עותקים** במקום אחד"]],"note":"גמטה דיזומית שמופרית נותנת **טריזומיה** בעובר. גמטה נוליזומית נותנת **מונוזומיה**. שני המונחים מתארים את הגמטה, לא את העובר — אל תתבלבל ביניהם בשאלות."},{"id":"h3-recap","type":"recap","points":["**טרנסלוקציה מאוזנת**: כל החומר קיים, רק בסידור אחר. **הנשא בריא לגמרי** — הבעיה נוצרת רק בגמטות.","**רוברטסונית** מתרחשת רק באקרוצנטריים (13, 14, 15, 21, 22). הזרועות הקצרות אבדו אך מכילות גנים חוזרים, ולכן הנשא בריא.","**רוברטסונית על 21 = הצורה התורשתית של תסמונת דאון.** אם שני כרומוזומי 21 התחברו — כל ילד שייוולד יהיה חולה."],"next":"סיימנו את מה שקורה לכרומוזומים בגרעין. ביחידה הבאה — הגנים היחידים בגוף שלא נמצאים בגרעין בכלל, ולא מצייתים לאף חוק שלמדת."}]}],"plan":3},{"id":"10-dna-structure","title":"מבנה ה-DNA","lectures":"16","pages":"52–54","lessons":[{"id":"dna-01","title":"הנוקלאוטיד: אבן הבניין","estMinutes":11,"source":"שיעור 16, עמ' 52–53","cards":[{"id":"n1-hook","type":"hook","text":"לפני 70 שנה לא ידעו שה-DNA הוא החומר התורשתי.","sub":"החשד היה על החלבונים — הם מורכבים יותר, מ-20 אבני בניין. ל-DNA היו רק ארבע. מי היה מהמר עליו?"},{"id":"n1-concept-hershey","type":"concept","term":"איך זה הוכח","text":"כימאים הכירו את החומרים שבתא וידעו שהחומר התורשתי הוא **או חלבונים או חומצות גרעין** — אבל לא ידעו מי מהם.\n\nההוכחה הגיעה משני חוקרים, **הרשי וצ'ייס**, שהשתמשו ב**בקטריופאג'ים** — וירוסים שתוקפים חיידקים.","note":"בקטריופאג' בנוי משני חלקים בלבד: מעטפת חלבון וחומר גנטי בפנים. **זה מה שהפך אותו לכלי מושלם** — הפרדה נקייה בין שני החשודים, בלי כל השאר שיש בתא."},{"id":"n1-concept-building-blocks","type":"concept","term":"שתי משפחות של אבני בניין","text":"כדי להבין את השאלה, צריך לראות את היחס בין השניים:","rows":[["DNA","**4 סוגי נוקלאוטידים**"],["חלבון","**20 חומצות אמינו** שונות"]],"note":"ומכאן הקשר ביניהם: **שלושה נוקלאוטידים מקודדים חומצה אמינית אחת.** ה-DNA משועתק ל-RNA, ה-RNA יוצא מהגרעין, והריבוזום קורא אותו ומייצר ממנו חלבון — בעזרת tRNA. את השרשרת הזו נלמד לעומק ביחידה 15."},{"id":"n1-concept-nucleotide","type":"concept","term":"מבנה הנוקלאוטיד","text":"במרכז כל נוקלאוטיד יושב סוכר בשם **דאוקסיריבוז**. יש בו **5 פחמנים**, ממוספרים 1 עד 5, ולכל אחד תפקיד קבוע:","rows":[["פחמן 1","מחובר ל**בסיס החנקתי**"],["פחמן 3","נושא קבוצת **הידרוקסיל (OH)**"],["פחמן 5","מחובר לקבוצת ה**פוספט**"]],"note":"**המספרים 3 ו-5 יחזרו לאורך כל הפרק.** הם מגדירים את הכיווניות של הגדיל — ובלעדיהם אי אפשר להבין שכפול, שעתוק או תרגום.","alt":[{"title":"שלושה חלקים, שלושה תפקידים","text":"**סוכר** — השלד. הוא לא נושא מידע, הוא מחזיק את המבנה.\n**פוספט** — המחבר. הוא קושר נוקלאוטיד לנוקלאוטיד.\n**בסיס חנקתי** — המידע. רק הוא משתנה בין ארבעת הנוקלאוטידים.\n\nהשלד והמחבר זהים תמיד. **כל האינפורמציה נמצאת בבסיס.**"}]},{"id":"n1-concept-bases","type":"concept","term":"ארבעת הבסיסים ושתי המשפחות","text":"ההבדל היחיד בין הנוקלאוטידים הוא הבסיס החנקתי. יש ארבעה, והם מתחלקים לשתי משפחות לפי מבנה:","rows":[["פורינים","**אדנין (A)** ו**גואנין (G)** — שתי טבעות"],["פירימידינים","**ציטוזין (C)** ו**טימין (T)** — טבעת אחת"]],"note":"דרך זכירה: **פירימידין** הוא המילה הארוכה יותר, אבל המבנה **הקטן** יותר — טבעת אחת. והאותיות: **C** ו-**T** הן פירימידינים, כלומר **שתי האותיות ה\"עגולות\"** שאינן A או G."},{"id":"n1-mcq-purine","type":"mcq","q":"מי מהבאים הוא **פורין**?","options":["ציטוזין","טימין","גואנין","אורציל"],"correct":2,"why":["ציטוזין הוא פירימידין — טבעת אחת.","טימין הוא פירימידין — טבעת אחת.","נכון. **גואנין (G) ואדנין (A) הם הפורינים** — שתי טבעות.","אורציל אכן פירימידין, והוא מופיע ב-RNA במקום טימין. לא כאן."]},{"id":"n1-concept-backbone","type":"concept","term":"איך נבנית השרשרת","text":"הנוקלאוטידים מתחברים זה לזה **דרך הפוספט והסוכר** — לא דרך הבסיסים.\n\nהתוצאה היא שלד חוזר: **סוכר–פוספט–סוכר–פוספט**, כשהבסיסים בולטים ממנו הצידה.","note":"הפוספט שקשור לעמדה **5** של נוקלאוטיד אחד מתחבר לעמדה **3** של הנוקלאוטיד הבא. **תמיד באותו כיוון.** ולכן לשרשרת יש כיווניות: קצה אחד עם פוספט חופשי, וקצה שני שאליו מתווספים נוקלאוטידים חדשים."},{"id":"n1-mcq-direction","type":"mcq","level":2,"q":"למה לגדיל DNA יש **כיווניות**?","options":["כי הבסיסים מסודרים בסדר קבוע","כי החיבור נעשה תמיד מעמדה 5 לעמדה 3 — שני הקצוות שונים","כי הוא מסתלסל לסליל","כי הוא ארוך מאוד"],"correct":1,"why":["סדר הבסיסים הוא המידע, והוא משתנה בין גנים. הוא לא מקור הכיווניות.","נכון. **הקישור תמיד 5 אל 3**, ולכן קצה אחד נושא פוספט חופשי והשני הידרוקסיל. השרשרת **אינה סימטרית** משני הכיוונים.","הסלסול הוא מבנה מרחבי, לא מקור הכיווניות הכימית.","אורך לא יוצר כיוון."]},{"id":"n1-concept-scale","type":"concept","term":"סדר הגודל","text":"ב-DNA האנושי יש **מעל 3 מיליארד בסיסים**.\n\nוזה מה שמבדיל בין כל היצורים החיים: לא סוג אבני הבניין — הן זהות בכולנו — אלא **הרצף שבו הן מסודרות**.","note":"אותם ארבעה נוקלאוטידים בדיוק בונים חיידק, עץ ואדם. ההבדל כולו בסדר. **וזו הסיבה שאפשר לקרוא גנום של יצור אחד עם אותם כלים ששימשו ליצור אחר.**"},{"id":"n1-recap","type":"recap","points":["**הרשי וצ'ייס** הוכיחו שה-DNA הוא החומר התורשתי, בעזרת בקטריופאג' שבנוי מחלבון וחומר גנטי בלבד.","נוקלאוטיד = **סוכר דאוקסיריבוז + פוספט (בפחמן 5) + בסיס חנקתי (בפחמן 1)**, ו-OH בפחמן 3.","**פורינים A ו-G** — שתי טבעות. **פירימידינים C ו-T** — טבעת אחת. השרשרת נבנית **5 אל 3** ולכן יש לה כיווניות."],"next":"עד עכשיו תיארנו שרשרת אחת. אבל ה-DNA בנוי משתיים — ומהאופן שבו הן נצמדות נובעת היכולת של החיים לשכפל את עצמם."}]},{"id":"dna-02","title":"שני גדילים: ההשלמה שמאפשרת שכפול","estMinutes":10,"source":"שיעור 16, עמ' 54","cards":[{"id":"n2-hook","type":"hook","text":"המולקולה הזו צריכה לעשות שני דברים שנראים סותרים.","sub":"לשמור מידע יציב לאורך דורות — **וגם** להעתיק את עצמו במדויק. המבנה שלה פותר את שניהם בבת אחת."},{"id":"n2-concept-two-strands","type":"concept","term":"שני גדילים, לא אחד","text":"מה שתיארנו עד עכשיו הוא שרשרת אחת. ה-DNA האמיתי בנוי מ**שתי** שרשראות כאלה, שנצמדות זו לזו.\n\nהחיבור ביניהן נעשה **דרך הבסיסים** — אותם בסיסים שבולטים החוצה מכל שלד.","note":"השלדים של סוכר-פוספט נמצאים בחוץ, והבסיסים פונים פנימה ונפגשים באמצע. זה המבנה שמוכר כ**סליל הכפול**."},{"id":"n2-concept-pairing","type":"concept","term":"כלל ההשלמה","text":"הבסיסים לא נצמדים באקראי. יש **התאמה קבועה ובלעדית**:","rows":[["A","מתחבר תמיד ל-**T**"],["G","מתחבר תמיד ל-**C**"]],"note":"שים לב לתבנית: **בכל זוג יש פורין אחד ופירימידין אחד** — אחד גדול ואחד קטן. וזו לא במקרה: הצירוף הזה שומר על **רוחב אחיד** לאורך כל הסליל. שני פורינים היו רחבים מדי, ושני פירימידינים צרים מדי.","alt":[{"titl
