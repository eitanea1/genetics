<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מסלול גנטיקה</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A5A64" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C171A" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="גנטיקה">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap">

<style>
html { color-scheme: light dark; }
img { max-width: 100%; }
[hidden] { display: none !important; }

:root {
  --ground:      #E9EEEF;
  --surface:     #FFFFFF;
  --surface-2:   #F2F6F6;
  --ink:         #11242B;
  --ink-2:       #47616A;
  --ink-3:       #7B939B;
  --line:        #D3DEDF;
  --line-soft:   #E3EAEB;
  --accent:      #0A5A64;
  --accent-2:    #0E7A85;
  --accent-soft: #DBEDEE;
  --on-accent:   #FFFFFF;
  --gold:        #8A5E1B;
  --gold-soft:   #F4E8D2;
  --ok:          #1B7A4B;
  --ok-soft:     #DCF0E4;
  --no:          #A9372C;
  --no-soft:     #F7E3E0;
  --shadow:      0 1px 2px rgba(17,36,43,.06), 0 8px 24px -12px rgba(17,36,43,.18);
  --radius:      14px;

  --f-display: "Frank Ruhl Libre", "Times New Roman", Georgia, serif;
  --f-body:    "Assistant", "Segoe UI", system-ui, sans-serif;
  --f-mono:    "JetBrains Mono", ui-monospace, "Consolas", monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:      #0C171A;
    --surface:     #13242A;
    --surface-2:   #1A3037;
    --ink:         #E6EFF0;
    --ink-2:       #A3BBC0;
    --ink-3:       #74919A;
    --line:        #24404A;
    --line-soft:   #1C333A;
    --accent:      #56C6D1;
    --accent-2:    #85DDE5;
    --accent-soft: #143038;
    --on-accent:   #06181C;
    --gold:        #DCAC63;
    --gold-soft:   #32270F;
    --ok:          #5FCE95;
    --ok-soft:     #123021;
    --no:          #F08574;
    --no-soft:     #351B17;
    --shadow:      0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"] {
  --ground:      #0C171A;
  --surface:     #13242A;
  --surface-2:   #1A3037;
  --ink:         #E6EFF0;
  --ink-2:       #A3BBC0;
  --ink-3:       #74919A;
  --line:        #24404A;
  --line-soft:   #1C333A;
  --accent:      #56C6D1;
  --accent-2:    #85DDE5;
  --accent-soft: #143038;
  --on-accent:   #06181C;
  --gold:        #DCAC63;
  --gold-soft:   #32270F;
  --ok:          #5FCE95;
  --ok-soft:     #123021;
  --no:          #F08574;
  --no-soft:     #351B17;
  --shadow:      0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.7);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}

#app {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  max-width: 640px;
  margin: 0 auto;
  padding: 0 16px;
}

.ltr {
  font-family: var(--f-mono);
  font-weight: 600;
  direction: ltr;
  unicode-bidi: isolate;
  font-size: .94em;
  letter-spacing: -.01em;
}

button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; border-radius: 6px; }

/* ---------- shared shell ---------- */

.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 2px 10px;
  min-height: 56px;
}
.topbar h1 {
  font-family: var(--f-display);
  font-size: 17px;
  font-weight: 700;
  margin: 0;
  letter-spacing: -.01em;
}
.topbar .sub {
  font-size: 12.5px;
  color: var(--ink-3);
  margin-top: 1px;
}
.topbar .grow { flex: 1; min-width: 0; }
/* "14 / 17" מתהפך ל-"17 / 14" בהקשר RTL — הבידוד מחזיק את הסדר */
.counter { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; flex: none; }

.iconbtn {
  background: none;
  border: 1px solid var(--line);
  border-radius: 9px;
  width: 34px; height: 34px;
  display: grid; place-items: center;
  color: var(--ink-2);
  font-size: 16px;
  flex: none;
  transition: background .15s, border-color .15s;
}
.iconbtn:hover:not([disabled]) { background: var(--surface-2); border-color: var(--ink-3); }
.iconbtn[disabled] { opacity: .3; cursor: default; }

/* progress strip — one segment per card, colored by what happened */
.strip { display: flex; gap: 3px; padding-bottom: 14px; }
.seg {
  height: 4px;
  flex: 1;
  border-radius: 2px;
  background: var(--line);
  transition: background .3s, transform .3s;
}
.seg.done    { background: var(--accent); }
.seg.right   { background: var(--ok); }
.seg.wrong   { background: var(--no); }
.seg.current { background: var(--accent-2); transform: scaleY(2.2); }

main { flex: 1; display: flex; flex-direction: column; padding-bottom: 8px; }

.actions {
  position: sticky;
  bottom: 0;
  background: linear-gradient(to top, var(--ground) 62%, transparent);
  padding: 14px 0 18px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.btn {
  border: none;
  border-radius: 12px;
  background: var(--accent);
  color: var(--on-accent);
  padding: 15px 20px;
  font-size: 17px;
  font-weight: 700;
  width: 100%;
  transition: transform .12s, filter .15s;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn.ghost {
  background: none;
  border: 1px solid var(--line);
  color: var(--ink-2);
  font-weight: 600;
  font-size: 15px;
  padding: 12px 20px;
}
.btn.ghost:hover { background: var(--surface-2); }

/* ---------- cards ---------- */

.card {
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 22px;
  animation: rise .32s cubic-bezier(.2,.7,.3,1);
}
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
@media (prefers-reduced-motion: reduce) {
  .card { animation: none; }
  .seg { transition: none; }
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 12px;
}
.eyebrow::before {
  content: "";
  width: 14px; height: 2px;
  background: var(--accent);
  border-radius: 1px;
}

.lvl {
  margin-inline-start: 4px;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--gold-soft);
  color: var(--gold);
  letter-spacing: .04em;
}
.lvl.exam { background: var(--no-soft); color: var(--no); }

.q {
  font-family: var(--f-display);
  font-size: 22px;
  line-height: 1.45;
  font-weight: 700;
  margin: 0 0 14px;
  text-wrap: balance;
  letter-spacing: -.01em;
}
.body p { margin: 0 0 12px; }
.body p:last-child { margin-bottom: 0; }
.body strong { font-weight: 700; color: var(--ink); }

/* hook — the question that opens a gap */
.card.hook { background: var(--accent-soft); border-color: transparent; }
.card.hook .q { font-size: 25px; color: var(--accent); }
.card.hook .body { color: var(--ink-2); }

/* pitfall — the trap */
.card.pitfall { border-color: var(--gold); border-width: 1px; background: var(--gold-soft); }
.card.pitfall .eyebrow { color: var(--gold); }
.card.pitfall .eyebrow::before { background: var(--gold); }
.punch {
  margin-top: 14px;
  padding-top: 13px;
  border-top: 1px solid color-mix(in srgb, var(--gold) 35%, transparent);
  font-weight: 700;
  color: var(--gold);
}

/* concept table: genotype -> meaning */
.rows { display: flex; flex-direction: column; gap: 1px; margin: 16px 0 4px; background: var(--line-soft); border-radius: 10px; overflow: hidden; }
.rows .row { display: flex; gap: 12px; align-items: baseline; background: var(--surface-2); padding: 11px 14px; }
.rows .key { font-family: var(--f-mono); font-weight: 700; direction: ltr; color: var(--accent); flex: none; min-width: 34px; }
.rows .val { font-size: 15.5px; color: var(--ink-2); }

.note {
  margin-top: 16px;
  padding: 12px 14px;
  background: var(--surface-2);
  border-radius: 10px;
  font-size: 15px;
  color: var(--ink-2);
}

/* worked steps */
.work { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.work li { display: flex; gap: 10px; align-items: flex-start; font-size: 15.5px; color: var(--ink-2); }
.work li::before {
  content: "";
  flex: none;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  margin-top: 9px;
}

.stat { margin-top: 18px; text-align: center; padding: 16px; background: var(--accent-soft); border-radius: 12px; }
.stat .v { font-family: var(--f-mono); font-size: 34px; font-weight: 700; color: var(--accent); direction: ltr; letter-spacing: .02em; }
.stat .l { font-size: 13.5px; color: var(--ink-2); margin-top: 2px; }

/* reveal (anchor) */
.reveal { margin-top: 16px; }
.reveal-q { font-weight: 700; margin-bottom: 10px; }
.reveal-a {
  padding: 14px;
  background: var(--ok-soft);
  border-radius: 10px;
  color: var(--ok);
  font-weight: 700;
  animation: rise .25s;
}

/* options */
.opts { display: flex; flex-direction: column; gap: 9px; margin-top: 4px; }
.opt {
  text-align: start;
  background: var(--surface-2);
  border: 1.5px solid transparent;
  border-radius: 11px;
  padding: 14px 15px;
  font-size: 16px;
  line-height: 1.45;
  display: flex;
  gap: 11px;
  align-items: flex-start;
  transition: border-color .15s, background .15s;
  width: 100%;
}
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt .mark {
  flex: none;
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 1.5px solid var(--ink-3);
  display: grid; place-items: center;
  font-size: 13px; font-weight: 700;
  margin-top: 1px;
}
.opt.picked   { border-color: var(--accent); }
.opt.correct  { border-color: var(--ok); background: var(--ok-soft); }
.opt.correct .mark { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.opt.incorrect { border-color: var(--no); background: var(--no-soft); }
.opt.incorrect .mark { background: var(--no); border-color: var(--no); color: var(--surface); }
.opt[disabled] { cursor: default; opacity: 1; }
.opt.dim { opacity: .45; }

.feedback {
  margin-top: 14px;
  padding: 15px;
  border-radius: 11px;
  font-size: 15.5px;
  line-height: 1.55;
  animation: rise .25s;
}
.feedback.good { background: var(--ok-soft); }
.feedback.bad  { background: var(--no-soft); }
.feedback .head { font-weight: 700; margin-bottom: 5px; display: flex; align-items: center; gap: 7px; }
.feedback.good .head { color: var(--ok); }
.feedback.bad  .head { color: var(--no); }

/* punnett square */
.pn-wrap { margin: 18px 0 6px; display: flex; justify-content: center; }
.pn {
  display: grid;
  grid-template-columns: 40px repeat(2, 1fr);
  gap: 5px;
  width: 100%;
  max-width: 340px;
  direction: ltr;
}
.pn .hd {
  font-family: var(--f-mono);
  font-weight: 700;
  font-size: 19px;
  color: var(--accent);
  display: grid; place-items: center;
  min-height: 40px;
}
.pn .cell {
  aspect-ratio: 1.35;
  border: 1.5px dashed var(--line);
  border-radius: 10px;
  background: var(--surface-2);
  display: grid;
  place-items: center;
  gap: 1px;
  font-family: var(--f-mono);
  font-weight: 700;
  font-size: 20px;
  color: var(--ink-3);
  transition: border-color .15s, background .15s;
  padding: 4px;
}
.pn .cell.sel { border-color: var(--accent); border-style: solid; background: var(--accent-soft); }
.pn .cell.filled { border-style: solid; border-color: var(--line); color: var(--ink); }
.pn .cell .ph { font-family: var(--f-body); font-size: 11px; font-weight: 600; direction: rtl; line-height: 1.2; text-align: center; }
.pn .cell.ok  { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.pn .cell.no  { background: var(--no-soft); border-color: var(--no); color: var(--no); }
.pn .cell.err { background: var(--no-soft); border-color: var(--no); }
.pn .cell.mid { background: var(--gold-soft); border-color: var(--gold); color: var(--gold); }
.pn .cell.fixed { border-style: solid; opacity: .72; cursor: default; }
.pn.wide { max-width: 100%; gap: 3px; }
.pn.wide .cell { font-size: 13px; aspect-ratio: 1; border-radius: 7px; padding: 2px; }
.pn.wide .cell .ph { font-size: 8.5px; line-height: 1.1; }
.pn.wide .hd { font-size: 14px; min-height: 26px; }

.chips { display: flex; gap: 8px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
.chip {
  font-family: var(--f-mono);
  font-weight: 700;
  font-size: 17px;
  padding: 10px 18px;
  border-radius: 10px;
  border: 1.5px solid var(--line);
  background: var(--surface);
  direction: ltr;
  transition: border-color .15s, background .15s, transform .1s;
}
.chip:hover { border-color: var(--accent); }
.chip:active { transform: translateY(1px); }
.help { font-size: 14px; color: var(--ink-3); text-align: center; margin-top: 12px; }

/* order — סידור שלבים ברצף */
.ord-slots { display: flex; flex-direction: column; gap: 7px; margin: 14px 0 4px; min-height: 40px; }
.ord-slot {
  display: flex; align-items: center; gap: 11px;
  background: var(--surface-2);
  border: 1.5px solid var(--line);
  border-radius: 11px;
  padding: 12px 14px;
  font-size: 15.5px;
  text-align: start;
  width: 100%;
}
.ord-slot .n {
  flex: none; width: 22px; height: 22px; border-radius: 50%;
  background: var(--accent); color: var(--on-accent);
  font-family: var(--f-mono); font-size: 12px; font-weight: 700;
  display: grid; place-items: center;
}
.ord-slot.ok  { border-color: var(--ok); background: var(--ok-soft); }
.ord-slot.no  { border-color: var(--no); background: var(--no-soft); }
.ord-slot.no .n { background: var(--no); }
.ord-slot .fix { margin-inline-start: auto; font-size: 13px; color: var(--no); font-weight: 600; }
.ord-pool { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
.ord-chip {
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 15px;
  font-weight: 600;
  transition: border-color .15s;
}
.ord-chip:hover { border-color: var(--accent); }

/* recap */
.recap-list { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px; counter-reset: r; }
.recap-list li {
  display: flex; gap: 12px; align-items: flex-start;
  font-size: 16px; line-height: 1.55;
}
.recap-list li::before {
  counter-increment: r;
  content: counter(r);
  flex: none;
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--on-accent);
  font-family: var(--f-mono);
  font-size: 12.5px; font-weight: 700;
  display: grid; place-items: center;
  margin-top: 3px;
}

/* tutor */
.tutor { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line-soft); }
.tutor-btns { display: flex; gap: 7px; flex-wrap: wrap; }
.tutor-btn {
  background: none;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 7px 13px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--ink-2);
  transition: border-color .15s, color .15s;
}
.tutor-btn:hover:not([disabled]) { border-color: var(--accent); color: var(--accent); }
.tutor-btn[disabled] { opacity: .5; cursor: wait; }
.tutor-out {
  margin-top: 13px;
  padding: 15px;
  background: var(--accent-soft);
  border-radius: 11px;
  font-size: 15.5px;
  line-height: 1.6;
  animation: rise .25s;
}
.tutor-out .who { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 7px; }

/* ---------- home ---------- */

.hero { padding: 8px 0 22px; }
.hero .kicker { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.hero h1 { font-family: var(--f-display); font-size: 34px; line-height: 1.2; margin: 8px 0 0; letter-spacing: -.02em; text-wrap: balance; }
.hero .where { color: var(--ink-2); margin-top: 10px; font-size: 15.5px; }

.resume { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }
.resume .lbl { font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
.resume .ttl { font-family: var(--f-display); font-size: 20px; font-weight: 700; margin: 6px 0 3px; }
.resume .meta { font-size: 14.5px; color: var(--ink-3); margin-bottom: 16px; }
.resume + .resume { margin-top: 12px; }

.times { display: flex; gap: 7px; margin-top: 10px; }
.time {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 11px 4px;
  text-align: center;
  transition: border-color .15s, background .15s;
}
.time:hover { border-color: var(--accent); background: var(--accent-soft); }
.time .n { font-family: var(--f-mono); font-weight: 700; font-size: 18px; display: block; }
.time .u { font-size: 11.5px; color: var(--ink-3); }

.streak { display: flex; gap: 18px; margin-top: 20px; padding: 14px 18px; background: var(--surface-2); border-radius: 12px; }
.streak div { flex: 1; }
.streak .n { font-family: var(--f-mono); font-size: 21px; font-weight: 700; color: var(--gold); }
.streak .l { font-size: 12.5px; color: var(--ink-3); }

/* map */
.unit { display: flex; gap: 13px; align-items: center; padding: 13px 2px; border-bottom: 1px solid var(--line-soft); }
.unit:last-child { border-bottom: none; }
.unit .idx { font-family: var(--f-mono); font-size: 12.5px; font-weight: 700; color: var(--ink-3); flex: none; width: 22px; }
.unit .nm { flex: 1; font-size: 15.5px; line-height: 1.35; }
.unit .nm small { display: block; color: var(--ink-3); font-size: 12.5px; margin-top: 1px; }
.unit .partial { color: var(--gold); font-weight: 600; }
.unit .st { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; flex: none; }
.st.none  { background: var(--surface-2); color: var(--ink-3); }
.st.start { background: var(--gold-soft); color: var(--gold); }
.st.solid { background: var(--accent-soft); color: var(--accent); }
.st.mast  { background: var(--ok-soft); color: var(--ok); }

.section-title {
  font-family: var(--f-display);
  font-size: 15px;
  font-weight: 700;
  color: var(--ink-2);
  margin: 26px 0 4px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
}

.learned { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 18px 20px; margin-top: 12px; }
.learned h3 { font-family: var(--f-display); font-size: 17px; margin: 0 0 10px; }
.learned ul { margin: 0; padding-inline-start: 18px; font-size: 15px; color: var(--ink-2); line-height: 1.6; }
.learned li { margin-bottom: 6px; }

.empty { text-align: center; color: var(--ink-3); padding: 40px 20px; font-size: 15px; }

.fineprint { font-size: 13.5px; color: var(--ink-3); line-height: 1.5; margin: 10px 0; }

<script id="course-data" type="application/json">{"id":"genetics","title":"גנטיקה כללית ומולקולרית","source":"סיכום גנטיקה כללית ומולקולרית — אמיר (82 עמ', 25 שיעורים)","units":[{"id":"01-intro","title":"מבוא: גן, DNA וכרומוזומים","lectures":"1–2","pages":"1–3","lessons":[{"id":"intro-01","title":"איפה בכלל יושבות התכונות","estMinutes":9,"source":"שיעור 1, עמ' 1–2","cards":[{"id":"i1-hook","type":"hook","text":"יש לך את האף של אבא שלך.","sub":"לא משהו דומה — בדיוק אותו אף. איך הוא עבר לשם?"},{"id":"i1-concept-genetics","type":"concept","term":"מה גנטיקה חוקרת","text":"**גנטיקה היא המדע שחוקר איך תכונות עוברות מהורים לצאצאים.**\n\nזה הכל. השאלה \"למה הילד דומה להורה\" היא השאלה של כל הקורס, וכל השאר זה מנגנון.","note":"שמו לב לזה הרבה לפני שהבינו איך זה עובד — ובייתו חיטה וכלבים על סמך ההבחנה הזו בלבד."},{"id":"i1-anchor-zoom","type":"anchor","text":"בוא נתקרב פנימה, שכבה אחרי שכבה, עד שנגיע לאף.\n\nכל שלב כאן נמצא **בתוך** השלב שלפניו:","work":["**הגוף** מורכב ממערכות (עיכול, נשימה…)","**מערכת** מורכבת מאיברים","**איבר** מורכב מרקמות","**רקמה** מורכבת מתאים","**בתא** יש גרעין","**בגרעין** יש כרומוזומים","**בכרומוזום** יש אלפי גנים"],"reveal":{"q":"אז איפה בדיוק \"כתוב\" האף?","a":"בגנים. בסוף השרשרת."},"alt":[{"title":"אותו דבר, בכיוון ההפוך","text":"**גן** הוא הוראה בודדת.\nאלפי הוראות ארוזות ב**כרומוזום**.\nהכרומוזומים יושבים ב**גרעין**, בתוך ה**תא**.\nמיליוני תאים דומים מרכיבים **רקמה**, רקמות מרכיבות **איבר**, ואיברים מרכיבים אותך.\n\nאותה סולם, מלמטה למעלה."}]},{"id":"i1-concept-gene","type":"concept","term":"גן, DNA, גנום","text":"שלושת המונחים האלה מבלבלים כי הם מדברים על אותו חומר בשלוש רמות של זום.","rows":[["DNA","החומר עצמו — המולקולה הארוכה שהכל כתוב עליה"],["גן","**קטע** מתוך ה-DNA שאחראי על תפקוד מסוים"],["גנום","**כל** החומר הגנטי של יצור, הכל ביחד"]],"note":"כלומר: הגן הוא היחידה הבסיסית של ההורשה, והגנום הוא הספרייה השלמה."},{"id":"i1-mcq-hierarchy","type":"mcq","q":"מה נמצא בתוך מה?","options":["גן בתוך כרומוזום, כרומוזום בתוך גרעין, גרעין בתוך תא","תא בתוך גן, גן בתוך כרומוזום","כרומוזום בתוך גן, גן בתוך גרעין","כולם נמצאים זה לצד זה בתוך התא"],"correct":0,"why":["נכון. מהקטן לגדול: **גן → כרומוזום → גרעין → תא**.","הפוך. התא הוא הגדול מכולם כאן, לא הקטן.","הפוך. הכרומוזום מכיל אלפי גנים, לא להפך.","לא. זו שרשרת של הכלה — כל אחד ממש בתוך השני."]},{"id":"i1-concept-diploid","type":"concept","term":"למה הכל מגיע בזוגות","text":"לבני אדם יש **23 זוגות כרומוזומים** — 46 בסך הכל.\n\nזוגות, כי **מכל כרומוזום יש שני עותקים: אחד מאמא, אחד מאבא.** שני העותקים האלה נקראים **כרומוזומים הומולוגיים**.","rows":[["דיפלואידי","שני עותקים מכל כרומוזום. אנחנו, וכמעט כל מה שמוכר לך"],["הפלואידי","עותק אחד בלבד. יצורים פשוטים כמו וירוסים"]],"note":"כי מכל כרומוזום יש שני עותקים, יש גם **שני עותקים של כל גן**. תחזיק את זה — זה הבסיס לכל הקורס.","alt":[{"title":"למה זה משנה בכלל","text":"כי זה אומר שלכל הוראה בגוף שלך יש **גיבוי**.\n\nאם עותק אחד פגום, השני מכסה ואתה בריא לגמרי — בלי לדעת שיש לך עותק פגום.\n\nכמעט כל הגנטיקה הרפואית יושבת על המשפט הזה."}]},{"id":"i1-pitfall-count","type":"pitfall","text":"**מספר הכרומוזומים לא מעיד על מורכבות היצור.**\n\nזה מפתה לחשוב שיותר כרומוזומים = יצור מפותח יותר. זה פשוט לא נכון — יש צמחים עם הרבה יותר כרומוזומים מאיתנו.","punch":"מה שכן גדל עם המורכבות זו כמות הגנים, לא מספר החבילות שהם ארוזים בהן."},{"id":"i1-mcq-count","type":"mcq","q":"לאדם יש 23 זוגות כרומוזומים. כמה כרומוזומים יש בתא רגיל בגוף?","options":["23","46","92","תלוי באיזה תא"],"correct":1,"why":["23 זה מספר ה**זוגות**, לא הכרומוזומים.","נכון. 23 זוגות כפול 2 = **46**. אחד מכל זוג מאמא, אחד מאבא.","92 יהיה אם כל הורה היה תורם 46 — וזה בדיוק מה שהגוף מונע. הכרטיסייה הבאה מסבירה איך.","לא. כל התאים הרגילים בגוף נושאים את אותם 46. היוצא מן הכלל הוא תאי המין."]},{"id":"i1-concept-gametes","type":"concept","term":"למה תאי המין הם חצי","text":"אם אמא הייתה תורמת 46 ואבא 46, לילד היו 92. לנכד 184. תוך כמה דורות זה מתפוצץ.\n\nלכן **תאי המין נושאים רק חצי** — 23 כרומוזומים, אחד מכל זוג. תא כזה נקרא **גמטה** (זרע או ביצית).","note":"התהליך שמחלק את הכרומוזומים לחצי נקרא **מיוזה**. נלמד אותו לעומק ביחידה 8 — כרגע מספיק לדעת שזה מה שהוא עושה.","alt":[{"title":"החשבון בשורה אחת","text":"23 מאמא + 23 מאבא = **46**. בדיוק כמו שצריך.\n\nכל הורה תורם בדיוק אחד מכל זוג, ולכן הילד מקבל זוג שלם — עותק אחד מכל צד. המספר נשאר יציב לנצח."}]},{"id":"i1-mcq-gametes","type":"mcq","q":"כמה כרומוזומים יש בביצית אנושית?","options":["46, כמו בכל תא","23","92","אחד"],"correct":1,"why":["לא. אם לביצית היו 46, הילד היה מקבל 92.","נכון. הביצית היא **גמטה** — היא נושאת 23, אחד מכל זוג. הזרע נושא 23 נוספים.","לא. 92 זה בדיוק מה שהמערכת נועדה למנוע.","לא. אחד מכל **זוג**, כלומר 23 בסך הכל."]},{"id":"i1-mcq-transfer","type":"mcq","level":2,"q":"לחתול יש 19 **זוגות** כרומוזומים. כמה כרומוזומים יש בזרע של חתול?","options":["19","38","76","אי אפשר לדעת בלי לדעת את המין"],"correct":0,"why":["נכון. הזרע הוא גמטה — הוא נושא **אחד מכל זוג**, כלומר 19.","38 זה מה שיש בתא רגיל בגוף החתול (19 כפול 2), לא בגמטה.","76 זה כפול מהתא הרגיל — זה לא קורה באף שלב.","המין לא משנה כאן. כל גמטה, זרע או ביצית, נושאת אחד מכל זוג."]},{"id":"i1-recap","type":"recap","points":["התכונות יושבות ב**גנים**, שנמצאים על **כרומוזומים**, שנמצאים ב**גרעין** של כל תא.","אנחנו **דיפלואידיים**: 23 זוגות כרומוזומים, כלומר **שני עותקים של כל גן** — אחד מאמא, אחד מאבא.","**גמטות** (זרע וביצית) נושאות רק חצי — 23 — כדי שהילד יקבל בדיוק 46 ולא כפול."],"next":"בשיעור הבא: אם יש שני עותקים של כל גן, מה קורה כשהם **לא זהים**? שם נכנסים המונחים אלל, גנוטיפ ופנוטיפ."}]},{"id":"intro-02","title":"אלל, גנוטיפ ופנוטיפ","estMinutes":10,"source":"שיעור 1–2, עמ' 2–3","cards":[{"id":"i2-hook","type":"hook","text":"שני אחים, אותם הורים בדיוק.","sub":"לאחד עיניים חומות ולשני כחולות. אף אחד לא אומץ. אז מאיפה השוני?"},{"id":"i2-concept-allele","type":"concept","term":"אלל","text":"לגן אחד יכולות להיות **כמה גרסאות שונות**. כל גרסה כזו נקראת **אלל**.\n\nהגן לצבע שיער הוא גן אחד — אבל יש לו גרסה לשחור, גרסה לחום, גרסה לבלונדיני. אלו אללים שונים של אותו גן.","note":"לכן ההגדרה: **אלל = צורה מסוימת של גן, מתוך כמה צורות אפשריות.**","alt":[{"title":"ההבדל בין גן לאלל, בשורה","text":"**הגן** הוא השאלה: \"מה צבע השיער?\"\n**האלל** הוא התשובה: שחור. או חום. או בלונדיני.\n\nלכולנו יש את אותו גן לצבע שיער. מה שמבדיל בינינו זה איזה אללים קיבלנו."}]},{"id":"i2-concept-locus","type":"concept","term":"לוקוס","text":"לכל גן יש **מקום קבוע** על כרומוזום מסוים — תמיד אותו מקום, אצל כל בני האדם.\n\nהמקום הזה נקרא **לוקוס**.","note":"לכן אפשר לומר משפט כמו \"הגן לצבע השיער נמצא בכרומוזום 6, במיקום כזה וכזה\". בזכות זה בכלל אפשר לחפש גן ולבדוק אותו."},{"id":"i2-mcq-allele","type":"mcq","q":"\"שיער שחור\" ו\"שיער בלונדיני\" הם:","options":["שני גנים שונים","שני אללים — שתי גרסאות של אותו גן","שני לוקוסים שונים","גן ומוטציה שלו"],"correct":1,"why":["לא. זה גן אחד — הגן לצבע השיער.","נכון. אותו גן, אותו לוקוס, **שתי גרסאות שונות** שלו.","לא. הלוקוס הוא המיקום, והוא זהה לשניהם — שם בדיוק יושב הגן הזה.","לא בהכרח. שתי הגרסאות יכולות להיות נפוצות ותקינות לגמרי, בלי שאף אחת מהן היא \"תקלה\"."]},{"id":"i2-concept-zygosity","type":"concept","term":"הומוזיגוט והטרוזיגוט","text":"ראינו שאתה דיפלואידי — **שני עותקים של כל גן**. לכן יש לך תמיד **שני אללים** לכל תכונה.\n\nמסמנים אותם באות לועזית, ויש בדיוק שלוש אפשרויות:","rows":[["AA","**הומוזיגוט** — שני האללים זהים"],["aa","**הומוזיגוט** — גם כאן זהים, פשוט אלל אחר"],["Aa","**הטרוזיגוט** — שני האללים שונים"]],"note":"הומו = זהה. הטרו = שונה. אותו אדם יהיה הומוזיגוט בתכונה אחת והטרוזיגוט באחרת — זה נאמר תמיד **ביחס לתכונה מסוימת**, לא על האדם כולו.","alt":[{"title":"איך לא לשכוח מה זה מה","text":"**הומו**גני = אחיד, אותו דבר.\n**הטרו**גני = מגוון, שונה.\n\nהתחיליות האלה מתנהגות אותו דבר בכל מילה בעברית.\n\nAA ו-aa הומוזיגוטים כי שני האללים זהים. Aa הטרוזיגוט כי הם שונים. זה כל ההבדל."}]},{"id":"i2-mcq-zygosity","type":"mcq","q":"אדם עם הגנוטיפ aa הוא:","options":["הטרוזיגוט, כי שני האללים קטנים","הומוזיגוט, כי שני האללים זהים","לא הומוזיגוט ולא הטרוזיגוט","תלוי אם האלל תקין או פגום"],"correct":1,"why":["לא. גודל האות לא קובע — רק אם השניים **זהים** או לא.","נכון. aa הומוזיגוט בדיוק כמו AA. שניהם זהים, וזה כל מה שהמילה אומרת.","לא. תמיד יש שני אללים, ולכן תמיד אחד מהשניים.","לא. המילה מתארת רק אם השניים זהים — לא אם הם תקינים."]},{"id":"i2-concept-geno-pheno","type":"concept","term":"גנוטיפ ופנוטיפ","text":"**גנוטיפ** = אילו אללים יש לך. מה שכתוב.\n**פנוטיפ** = מה שרואים בפועל.\n\nהם לא אותו דבר, ושני אנשים עם פנוטיפ זהה יכולים להיות בעלי גנוטיפ שונה.","rows":[["גנוטיפ","Aa"],["פנוטיפ","עיניים חומות"]],"note":"וגם הסביבה משפיעה על הפנוטיפ, לא רק הגנים — אותו אדם יהיה כהה יותר אחרי קיץ בחוץ מאשר אחרי חורף בבית.","alt":[{"title":"בשפה של מרפאה","text":"**גנוטיפ** הוא מה שכתוב בתיק. **פנוטיפ** הוא מה שאתה רואה כשהמטופל נכנס לחדר.\n\nשני אנשים שנראים זהים לגמרי יכולים להיות שונים לחלוטין בתיק — וההבדל הזה לא משנה כלום עבורם, אבל משנה הכל עבור הילדים שלהם."}]},{"id":"i2-mcq-geno-pheno","type":"mcq","q":"לשני אנשים יש עיניים חומות. מה בהכרח נכון?","options":["יש להם אותו גנוטיפ","יש להם אותו פנוטיפ, אבל הגנוטיפ יכול להיות שונה","שניהם הומוזיגוטים","שניהם הטרוזיגוטים"],"correct":1,"why":["לא. זה בדיוק הפער — אותו מראה לא מבטיח אותם אללים.","נכון. **פנוטיפ זהה, גנוטיפ אפשרי שונה.** אחד יכול להיות AA והשני Aa, ושניהם ייראו זהים.","לא ידוע. אחד מהם יכול להיות הטרוזיגוט ועדיין להיראות אותו דבר.","לא ידוע, ומאותה סיבה."]},{"id":"i2-answer-hook","type":"example","text":"עכשיו אפשר לענות על השאלה שפתחנו איתה.\n\nלכל הורה יש **שני** אללים, והוא מעביר לכל ילד רק **אחד** מהם — בהגרלה.","work":["האח הראשון קיבל צירוף אחד של אללים","האח השני קיבל צירוף אחר","אותם הורים, הגרלה נפרדת לכל ילד"],"note":"זו התשובה לשאלה למה אחים דומים אבל לא זהים: הם שואבים מאותו מאגר, אבל כל אחד מקבל דגימה משלו."},{"id":"i2-concept-mutation","type":"concept","term":"מוטציה וזן בר","text":"ה-DNA ארוך ומורכב, ובזמן ההעתקה שלו קורות טעויות. שינוי כזה ברצף נקרא **מוטציה**.\n\nלעומתה, **זן בר** (wild type) הוא המצב הרגיל והנפוץ באוכלוסייה — זה שהיה שם לפני השינוי.","note":"מוטציה היא לא בהכרח דבר רע. חלקן גורמות למחלות קשות, אבל מוטציות הן גם המקור לכל השונות בטבע ולאבולוציה עצמה.","alt":[{"title":"למה \"טעות\" זה לא בהכרח \"נזק\"","text":"שינוי במתכון יכול להרוס את המנה, ויכול לצאת טעים יותר.\n\nמוטציה שמחליפה צבע שיער לא פוגעת באיש. מוטציה שפוגעת בחלבון חיוני — כן.\n\nאותו סוג אירוע בדיוק, תוצאות שונות לגמרי."}]},{"id":"i2-mcq-five-alleles","type":"mcq","level":2,"q":"לגן מסוים קיימים באוכלוסייה **5 אללים שונים**. כמה מהם יכולים להיות אצל אדם אחד?","options":["5","2","1","תלוי בגן"],"correct":1,"why":["כאן נופלים. 5 זה מה שקיים **באוכלוסייה** — לא אצל אדם יחיד.","נכון. אתה דיפלואידי, ולכן יש לך בדיוק **שני אללים** לכל גן — אחד מאמא, אחד מאבא. גם אם באוכלוסייה קיימות 50 גרסאות.","לא. אחד היה נכון ליצור הפלואידי, לא לנו.","לא תלוי. כל גן אוטוזומלי אצל אדם — תמיד שניים."]},{"id":"i2-mcq-environment","type":"mcq","level":3,"q":"אחרי קיץ בחוץ, העור של אדם כהה משמעותית מכפי שהיה בחורף. מה השתנה?","options":["הגנוטיפ שלו השתנה","הפנוטיפ השתנה, הגנוטיפ נשאר זהה","שניהם השתנו","אף אחד — זה לא קשור לגנטיקה"],"correct":1,"why":["לא. הגנוטיפ הוא האללים עצמם, והם לא משתנים מחשיפה לשמש.","נכון. **הפנוטיפ הוא מה שרואים, והוא מושפע גם מהסביבה** — לא רק מהגנים. אותם אללים בדיוק, מראה אחר.","לא. הגנוטיפ יציב. רק הביטוי שלו השתנה.","דווקא כן. הפנוטיפ הוא מושג גנטי, והנקודה כאן היא שהוא לא נקבע על ידי הגנים לבדם."]},{"id":"i2-recap","type":"recap","points":["**אלל** = גרסה של גן. ל**לוקוס** אחד (מיקום קבוע) יכולות להיות כמה גרסאות.","יש לך שני אללים לכל תכונה: זהים = **הומוזיגוט** (AA או aa), שונים = **הטרוזיגוט** (Aa).","**גנוטיפ** הוא מה שכתוב, **פנוטיפ** מה שרואים. פנוטיפ זהה לא מעיד על גנוטיפ זהה."],"next":"עכשיו יש לך את כל השפה. ביחידה הבאה נראה מה קורה כששני האללים שונים — מי מהם מנצח, ולמה שני הורים בריאים יכולים להביא ילד חולה."}]}],"plan":2},{"id":"02-mendel","title":"הורשה מנדלית וריבוע פאנט","lectures":"2–3","pages":"3–8","lessons":[{"id":"mendel-01","title":"שני עותקים, ומה שקורה כששניהם פגומים","estMinutes":12,"source":"שיעור 2–3, עמ' 3–5","cards":[{"id":"m1-hook","type":"hook","text":"לשני הורים בריאים לגמרי נולד ילד עם מחלה גנטית.","sub":"אף אחד לא בגד, ולאף אחד במשפחה אין את המחלה. אז מאיפה היא הגיעה?"},{"id":"m1-anchor","type":"anchor","text":"מכל הוראה בגוף שלך יש **שני עותקים** — אחד מאמא, אחד מאבא.\n\nאם עותק אחד פגום, השני מכסה עליו והכל עובד כרגיל. אתה בכלל לא יודע שיש לך עותק פגום.","reveal":{"q":"כמה עותקים תקינים צריך כדי שהכל יעבוד?","a":"אחד מספיק. וזה כל הרעיון."},"alt":[{"title":"אותו דבר, בשפה של סידור משמרות","text":"לכל תפקיד בגוף יש **שני עובדים רשומים** — אחד מאמא, אחד מאבא.\n\nאם אחד לא מגיע, השני מכסה והמשמרת עוברת בשלום. אף אחד לא שם לב שחסר מישהו.\n\nהבעיה מתחילה רק כששניהם לא הגיעו."},{"title":"ואם גם זה לא מתיישב","text":"יש לך שני עותקים של אותו מסמך חשוב. אחד מהם פגום ולא נפתח.\n\nאתה פותח את השני, הכל תקין, ובחיים לא תדע שהראשון פגום.\n\nעד שתעביר הלאה דווקא אותו."}]},{"id":"m1-concept-alleles","type":"concept","term":"אלל","text":"כל אחד משני העותקים נקרא **אלל**. מסמנים אותם באות לועזית: אות גדולה לעותק התקין, אות קטנה לפגום.","rows":[["AA","שני עותקים תקינים — בריא"],["Aa","עותק אחד תקין מכסה — **בריא, אבל נשא**"],["aa","אין מי שיכסה — חולה"]],"note":"העותק התקין נקרא **דומיננטי**, הפגום נקרא **רצסיבי**. בחירת האות שרירותית — רק שיהיה הבדל ברור בין הגדולה לקטנה.","alt":[{"title":"מה בעצם האותיות אומרות","text":"A ו-a הם **אותו גן, באותו מיקום** — שתי גרסאות שלו.\n\nכמו שני עותקים של אותו טופס: אחד מלא נכון, אחד עם שדה חסר. זה אותו טופס, לא שני מסמכים שונים.\n\nלכן תמיד כותבים שתי אותיות — הן שתי הגרסאות שיש לך ביד."}]},{"id":"m1-concept-zygosity","type":"concept","term":"הומוזיגוט והטרוזיגוט","text":"לשלושת המצבים שראית יש שמות רשמיים, ותפגוש אותם בכל שאלה בקורס.\n\nהם אומרים דבר אחד בלבד: **האם שני האללים זהים או שונים.**","rows":[["AA","**הומוזיגוט** — שני האללים זהים"],["aa","**הומוזיגוט** — גם כאן זהים, פשוט שניהם פגומים"],["Aa","**הטרוזיגוט** — שני האללים שונים. זה הנשא"]],"note":"הומו = זהה. הטרו = שונה. שים לב ש-**aa הוא הומוזיגוט בדיוק כמו AA** — המילה לא מספרת אם האלל תקין או פגום, רק שהשניים זהים.","alt":[{"title":"איך לא לשכוח מה זה מה","text":"**הומו**גני = אחיד, אותו דבר.\n**הטרו**גני = מגוון, שונה.\n\nהתחיליות האלה מתנהגות אותו דבר בכל מילה בעברית.\n\nזה כל ההבדל. AA ו-aa הומוזיגוטים כי שני האללים זהים. Aa הטרוזיגוט כי הם שונים."}]},{"id":"m1-pitfall-strong","type":"pitfall","text":"**דומיננטי לא אומר \"חזק\".**\n\nזו הטעות הכי נפוצה בקורס. A לא מנצח את a בקרב — פשוט מספיק עותק תקין אחד כדי שהכל יעבוד.\n\nב-Aa העותק הפגום **לא נמחק**. הוא יושב שם בשקט, ועובר הלאה לילדים.","punch":"וזה בדיוק איך שני הורים בריאים מביאים ילד חולה.","alt":[{"title":"למה \"מספיק אחד\" זה לא מוזר","text":"יש לך **שתי כליות**, ואפשר לחיות חיים מלאים עם אחת.\n\nהכליה השנייה לא \"מנצחת\" את הראשונה — פשוט אחת מספיקה. מי שיש לו כליה אחת בריא לגמרי, רק בלי גיבוי.\n\nכך בדיוק עובד עותק תקין אחד מול עותק פגום."}]},{"id":"m1-mcq-carrier","type":"mcq","q":"לאדם יש עותק תקין אחד ועותק פגום אחד — Aa. מה מצבו?","options":["חולה, כי יש לו עותק פגום","בריא לגמרי, אבל יכול להעביר את העותק הפגום","בריא, והעותק הפגום נעלם אצלו","חולה בצורה קלה — חצי מהמחלה"],"correct":1,"why":["לא. העותק התקין מכסה, והוא בריא לגמרי. מספיק אחד.","בדיוק. זה נקרא **נשא** — בריא, ומעביר הלאה בלי לדעת.","לא. הוא לא נעלם, הוא רק לא מתבטא. יש 50% שהוא יעבור לכל ילד.","לא. אין \"חצי מחלה\" בהורשה רצסיבית — או שיש מספיק חלבון תקין או שאין."]},{"id":"m1-concept-geno-pheno","type":"concept","term":"גנוטיפ מול פנוטיפ","text":"**גנוטיפ** = מה כתוב בגנים (AA, Aa, aa).\n**פנוטיפ** = מה רואים בפועל (בריא / חולה).\n\nהקשר ביניהם הוא לא אחד-לאחד: **AA ו-Aa נראים אותו דבר מבחוץ.**","note":"לכן אי אפשר לדעת מהמראה אם מישהו נשא. בשביל זה קיימות בדיקות סקר גנטיות.","alt":[{"title":"בשפה של מרפאה","text":"**גנוטיפ** הוא מה שכתוב בתיק. **פנוטיפ** הוא מה שאתה רואה כשהמטופל נכנס לחדר.\n\nשני אנשים שנראים זהים לגמרי — אחד AA ואחד Aa — יכולים להיות שונים לחלוטין בתיק.\n\nוההבדל הזה לא משנה כלום עבורם. הוא משנה הכל עבור הילדים שלהם."}]},{"id":"m1-truefalse-screening","type":"truefalse","q":"בדיקת סקר גנטית לפני היריון מחפשת אנשים בריאים לגמרי.","correct":true,"why":"נכון, וזה נשמע מוזר עד שמבינים את המנגנון. הבדיקה מחפשת **נשאים** — Aa, בריאים לחלוטין, בלי שום סימן. הסיכון מתגלה רק כששני נשאים נפגשים."},{"id":"m1-setup-punnett","type":"example","text":"שני ההורים נשאים: **Aa** ו-**Aa**.\n\nכל הורה נותן לילד **אלל אחד בלבד** — או A או a, בהגרלה של חצי-חצי.\n\nאז מה יכול לצאת? במקום לנחש — בוא נסדר את זה.","work":["אמא יכולה לתת: A או a","אבא יכול לתת: A או a","כל שילוב אפשרי, ולכל אחד סיכוי שווה"]},{"id":"m1-punnett","type":"punnett","q":"מלא את ריבוע פאנט להכלאה Aa × Aa","help":"בחר משבצת, ואז בחר מה נכנס אליה. כל משבצת = האלל מהשורה + האלל מהעמודה.","top":["A","a"],"side":["A","a"],"chips":["AA","Aa","aa"],"solution":[["AA","Aa"],["Aa","aa"]],"pheno":{"AA":{"label":"בריא","kind":"ok"},"Aa":{"label":"בריא (נשא)","kind":"ok"},"aa":{"label":"חולה","kind":"no"}},"after":"שים לב: **Aa הופיע פעמיים** — פעם מאמא-A/אבא-a, ופעם הפוך. זה בדיוק למה היחס יוצא כמו שהוא יוצא."},{"id":"m1-mcq-quarter","type":"mcq","q":"לפי הריבוע שמילאת — כמה מתוך 4 יהיו חולים?","options":["אחד מתוך 4 — 25%","שניים מתוך 4 — 50%","שלושה מתוך 4 — 75%","אף אחד"],"correct":0,"why":["נכון. רק המשבצת aa. **25% חולים, 50% נשאים בריאים, 25% תקינים לגמרי.**","לא. 50% זה הנשאים (Aa) — הם בריאים.","לא. 75% הם הבריאים: AA ועוד שני Aa.","לא. משבצת aa קיימת — כשגם אמא וגם אבא נותנים את העותק הפגום."]},{"id":"m1-pitfall-independent","type":"pitfall","text":"**25% זה לכל היריון בנפרד.**\n\nזוג שכבר יש לו ילד חולה חושב לפעמים ש\"מיצינו את הרבע\" ושלושת הבאים בטוחים. זה לא עובד ככה.\n\nכל היריון הוא הגרלה חדשה. אפשר גם ארבעה ילדים חולים ברצף.","punch":"זה בדיוק מה שרופא גנטיקאי צריך להסביר להורים, וזה מופיע בשאלות במבחן."},{"id":"m1-concept-segregation","type":"concept","term":"חוק הסגרגציה — החוק הראשון של מנדל","text":"עכשיו שראית את זה קורה, הנה הניסוח הרשמי:\n\n**שני האללים של אותו גן נפרדים זה מזה בזמן יצירת תאי המין, וכל גמטה מקבלת אלל אחד בלבד — בסיכוי של חצי-חצי.**","note":"**גמטה** = תא מין (זרע או ביצית). היא מכילה רק חצי מהכרומוזומים, ולכן רק אלל אחד מכל גן.","alt":[{"title":"מה החוק הזה בעצם אומר","text":"יש לך שני אללים, ואתה מכניס **בדיוק אחד** לכל תא מין — בהגרלה הוגנת של חצי-חצי.\n\nאתה לא בוחר, לא מעדיף, ואין זיכרון מהפעם הקודמת.\n\nזו הסיבה שאח ואחות מאותם הורים יכולים לצאת שונים לגמרי."}]},{"id":"m1-cloze-terms","type":"mcq","q":"צמח שהוא **הומוזיגוט** לתכונה מסוימת — מה זה אומר?","options":["שני האללים שלו זהים (AA או aa)","שני האללים שלו שונים (Aa)","יש לו רק אלל אחד","הוא בהכרח דומיננטי"],"correct":0,"why":["נכון. הומו = זהה. AA וגם aa הם הומוזיגוטים.","זה **הטרוזיגוט** — הטרו = שונה. זה ה-Aa, כלומר הנשא.","לא. תמיד יש שני אללים, אחד מכל הורה.","לא. aa הוא הומוזיגוט רצסיבי. הומוזיגוט אומר רק שהשניים זהים."]},{"id":"m1-concept-generations","type":"concept","term":"השפה של מנדל: P, F1, F2","text":"עוד רגע נראה את הניסוי המקורי. לפני זה — שני מונחים שמופיעים בכל שאלת הכלאה בקורס, ובלעדיהם השאלה לא קריאה.\n\nכשעוקבים אחרי הכלאה לאורך דורות, נותנים לכל דור שם:","rows":[["P","דור ההורים שממנו מתחילים (מלשון parents)"],["F1","הדור הראשון של הצאצאים"],["F2","הדור הבא — הילדים של F1"]],"note":"והמונח השני: **זן טהור** הוא פשוט הומוזיגוט בתכונה שבודקים — AA או aa, אף פעם לא Aa. מנדל התעקש להתחיל דווקא מזנים טהורים, כי רק ככה הוא ידע בוודאות מה כל הורה תרם.","alt":[{"title":"למה בכלל צריך שמות לדורות","text":"כי בלעדיהם אי אפשר לנסח את השאלה.\n\n\"ההורים היו כאלה, הילדים יצאו ככה, והנכדים ככה\" — מסורבל וקל להתבלבל. עם P, F1, F2 זה משפט אחד קצר.\n\nזו לא תיאוריה, זו קיצור דרך בכתיבה. F זה מ-filial, צאצא."}]},{"id":"m1-example-mendel","type":"example","text":"עד עכשיו דיברנו על בריא וחולה. אותו מנגנון בדיוק עובד על **כל** תכונה — וכך הוא התגלה לראשונה.\n\nב-1865 נזיר בשם **גרגור מנדל** ספר פרחי אפונה, בלי לדעת מה זה גן, DNA או אלל. הפעם A הוא לא \"תקין\" אלא \"סגול\", ו-a הוא \"לבן\".\n\nהוא הכליא שני פרחים סגולים שהם Aa — בדיוק כמו שני נשאים — וספר את הצאצאים:","work":["929 פרחים בסך הכל","705 סגולים","224 לבנים"],"stat":{"value":"3 : 1","label":"בדיוק מה שהריבוע שלך חזה"},"note":"מנדל הגיע למספר הזה **מספירה בלבד**. הוא לא ידע על אללים כלום. כל התמונה של \"שני עותקים\" נבנתה אחר כך, כדי להסביר למה דווקא 3:1 ולא חצי-חצי."},{"id":"m1-mcq-f1","type":"mcq","q":"מנדל הכליא זן טהור סגול (AA) עם זן טהור לבן (aa). כל דור F1 יצא סגול. איפה נעלם הלבן?","options":["האלל הלבן נהרס בהכלאה","כל צמחי F1 הם Aa — הלבן שם, פשוט מכוסה","הלבן חוזר רק אם מכליאים עם צמח לבן","מנדל טעה בספירה"],"correct":1,"why":["לא. אללים לא נהרסים בהכלאה, הם רק עוברים.","בדיוק. AA × aa נותן **רק** Aa. כולם נשאים, כולם סגולים — ולכן ב-F2 הלבן חוזר ב-25%.","לא. הוא חוזר גם בהכלאה עצמית של F1 — וזה בדיוק הניסוי של מנדל.","לא. הספירה שלו הייתה מדויקת, וזו הסיבה שהיא שינתה את הביולוגיה."]},{"id":"m1-concept-conditional","type":"concept","term":"שני כללים שהופכים את זה לשאלת מבחן","text":"הריבוע נותן 25% / 50% / 25%. אבל שאלות מבחן כמעט אף פעם לא שואלות את זה ישירות — הן מוסיפות **מידע**, ואז המספרים משתנים.","rows":[["מידע מצמצם","אם ידוע שאדם **בריא**, המשבצת aa יורדת מהחשבון. נשארות 3 משבצות, לא 4"],["אירועים נכפלים","הסיכוי ששני דברים יקרו יחד = הכפלת הסיכויים"]],"note":"הכלל הראשון הוא המלכודת. ברגע שאתה יודע משהו על התוצאה, אתה כבר לא סופר מתוך 4 — אתה סופר מתוך מה שנשאר.","alt":[{"title":"הכלל הראשון בשורה אחת","text":"יש 4 משבצות: AA, Aa, Aa, aa.\n\nמישהו אומר לך \"הילד בריא\". aa יורד. נשארו **שלוש** משבצות: AA, Aa, Aa.\n\nמתוכן, שתיים הן נשא. אז הסיכוי שהוא נשא הוא 2 מתוך 3 — לא חצי, ולא 50%."}]},{"id":"m1-mcq-twothirds","type":"mcq","level":3,"q":"לזוג נשאים (Aa × Aa) נולדו שני ילדים. הבן חולה. הבת **בריאה**. מה הסיכוי שהבת נשאית?","options":["1/2","2/3","1/4","3/4"],"correct":1,"why":["כאן נופלים. 1/2 היה נכון אם לא היינו יודעים שהיא בריאה — אבל אנחנו יודעים.","נכון. היא בריאה, ולכן aa יורד. נשארו AA, Aa, Aa — ומתוכן **2 מתוך 3** הן נשא.","1/4 זה הסיכוי להיות AA מתוך כל ארבע המשבצות, לא מתוך השלוש שנשארו.","3/4 זה הסיכוי להיות בריא בכלל — וזה כבר ידוע לנו עליה, לא מה שנשאל."]},{"id":"m1-mcq-compound","type":"mcq","level":3,"q":"אותו זוג נשאים מתכנן שני ילדים נוספים. מה הסיכוי ש**שניהם** יהיו בריאים?","options":["3/4","9/16","1/2","6/8"],"correct":1,"why":["3/4 זה הסיכוי לילד **אחד** בריא. השאלה על שניים.","נכון. כל היריון עומד בפני עצמו: 3/4 × 3/4 = **9/16**.","לא. חצי לא מופיע כאן בכלל — הסיכוי לילד בריא הוא 3/4, לא 1/2.","6/8 זה 3/4 — חיברת במקום להכפיל. אירועים עצמאיים מוכפלים."]},{"id":"m1-recap","type":"recap","points":["מכל גן יש **שני אללים** — אחד מכל הורה. עותק תקין אחד מספיק, ולכן דומיננטי ≠ חזק.","**Aa = נשא**: בריא לגמרי, ומעביר הלאה. שני נשאים → 25% חולים, בכל היריון מחדש.","**ריבוע פאנט** מסדר את כל צירופי הגמטות. Aa × Aa נותן 1:2:1 בגנוטיפ, שזה 3:1 בפנוטיפ."],"next":"מכאן נפתחות שתי דרכים: **הכלאת מבחן** — איך לגלות אם צמח סגול הוא AA או Aa; ו**הורשה דיהיברידית** — שתי תכונות במקביל, ריבוע של 4×4. שתיהן ביחידה הזו."}]},{"id":"mendel-02","title":"הכלאת מבחן: לגלות גנוטיפ שמסתתר","estMinutes":10,"source":"שיעור 3, עמ' 5","cards":[{"id":"m2-hook","type":"hook","text":"לפניך שני צמחים סגולים. אחד מהם AA, השני Aa.","sub":"הם נראים זהים לחלוטין. אין מיקרוסקופ ואין בדיקת DNA. איך תדע מי מי?"},{"id":"m2-concept-problem","type":"concept","term":"הבעיה: הדומיננטי מסתיר","text":"עד עכשיו תמיד ידענו את הגנוטיפ, כי התחלנו מזנים טהורים.\n\nעכשיו הכיוון הפוך: יש לך פנוטיפ דומיננטי ביד, ואתה רוצה לדעת מה הגנוטיפ שמאחוריו.","rows":[["AA","סגול"],["Aa","סגול"],["aa","לבן — את זה כן אפשר לזהות במבט"]],"note":"הפנוטיפ הרצסיבי הוא היחיד שמסגיר את הגנוטיפ שלו בוודאות. **aa נראה שונה, ולכן אין לגביו ספק.** זה בדיוק מה שנשתמש בו."},{"id":"m2-anchor-testcross","type":"anchor","text":"הרעיון: **תכליא את הצמח המסתורי עם צמח aa.**\n\nלמה דווקא aa? כי הוא יכול לתת רק דבר אחד — a. הוא לא תורם שום הפתעה.","reveal":{"q":"אז מה קובע את מראה הצאצאים?","a":"רק מה שהצמח המסתורי נתן. הצאצאים מדווחים עליו ישירות."},"note":"זו **הכלאת מבחן** (test cross): מכליאים עם הומוזיגוט רצסיבי, והצאצאים חושפים את מה שלא רואים.","alt":[{"title":"למה זה עובד","text":"אם אחד הצדדים תורם רק a, אז כל צאצא הוא בעצם **חלון** אל מה שהצד השני תרם.\n\nיצא סגול? הצד המסתורי נתן A.\nיצא לבן? הוא נתן a — וזה מוכיח שהיה בו a להתחיל עם."}]},{"id":"m2-punnett-AA","type":"punnett","q":"מקרה ראשון: נניח שהצמח המסתורי הוא AA. מלא את ההכלאה עם aa.","help":"למעלה הגמטות של הצמח המסתורי, בצד הגמטות של aa.","top":["A","A"],"side":["a","a"],"chips":["AA","Aa","aa"],"solution":[["Aa","Aa"],["Aa","Aa"]],"pheno":{"Aa":{"label":"סגול","kind":"ok"}},"after":"**כל הצאצאים סגולים, בלי יוצא מן הכלל.** ל-AA אין בכלל a לתת, אז לבן לא יכול להופיע."},{"id":"m2-punnett-Aa","type":"punnett","q":"מקרה שני: נניח שהצמח המסתורי הוא Aa. מלא שוב את ההכלאה עם aa.","help":"שים לב מה השתנה בשורה העליונה.","top":["A","a"],"side":["a","a"],"chips":["AA","Aa","aa"],"solution":[["Aa","aa"],["Aa","aa"]],"pheno":{"Aa":{"label":"סגול","kind":"ok"},"aa":{"label":"לבן","kind":"no"}},"after":"**חצי סגולים, חצי לבנים.** כל צאצא לבן הוא הוכחה שהצמח המסתורי נשא a."},{"id":"m2-concept-reading","type":"concept","term":"איך קוראים את התוצאה","text":"שתי ההכלאות נותנות תמונות שונות לגמרי, וזה מה שהופך את זה לכלי:","rows":[["100% דומיננטי","הצמח היה **AA**"],["בערך 50/50","הצמח היה **Aa**"]],"note":"צאצא רצסיבי **אחד** כבר מספיק כדי לקבוע Aa — הוא לא היה יכול להגיע משום מקום אחר. הכיוון ההפוך פחות ודאי, וזה הנושא של הכרטיסייה הבאה."},{"id":"m2-mcq-read","type":"mcq","level":2,"q":"ביצעת הכלאת מבחן וקיבלת 40 צאצאים: 21 סגולים, 19 לבנים. מה היה הצמח המקורי?","options":["AA","Aa","aa","אי אפשר לדעת"],"correct":1,"why":["לא. אילו היה AA, לא היה מופיע ולו לבן אחד — ויש 19.","נכון. 21 מול 19 זה **בערך 50/50**, בדיוק מה שהטרוזיגוט נותן בהכלאת מבחן.","לא. הצמח המקורי היה סגול, ו-aa הוא לבן.","דווקא אפשר. הופעת לבנים בכלל כבר סוגרת את העניין."]},{"id":"m2-mcq-sample","type":"mcq","level":3,"q":"הכלאת מבחן אחרת הניבה **3 צאצאים בלבד, כולם סגולים**. האם אפשר לקבוע שהצמח הוא AA?","options":["כן — לא הופיע אף לבן","לא — גם Aa היה נותן את זה בסיכוי של 1/8","לא — צריך לפחות 10 צאצאים תמיד","כן, אבל רק אם ההורה השני היה זן טהור"],"correct":1,"why":["כאן נופלים. היעדר ראיה הוא לא ראיה להיעדר — במיוחד במדגם של שלושה.","נכון. אם הצמח Aa, כל צאצא הוא הגרלה של חצי. שלושה סגולים ברצף = ½ בשלישית = **1/8**, כלומר 12.5%. זה קורה.","אין מספר קסם. מה שקובע זה **כמה קטן הסיכוי לטעות** — עם 10 צאצאים הוא כבר פחות מאלפית.","ההורה השני תמיד aa בהכלאת מבחן, וזה לא פותר את בעיית המדגם הקטן."]},{"id":"m2-recap","type":"recap","points":["**הכלאת מבחן** = הכלאה עם הומוזיגוט רצסיבי (aa), שתורם רק a ולכן לא מסתיר כלום.","כל הצאצאים דומיננטיים → ההורה **AA**. בערך חצי־חצי → ההורה **Aa**.","צאצא רצסיבי אחד מוכיח Aa. אבל **היעדר** צאצא רצסיבי במדגם קטן לא מוכיח AA."],"next":"בשיעור הבא: מה קורה כשעוקבים אחרי **שתי תכונות במקביל** — ריבוע של 4×4, והיחס המפורסם 9:3:3:1."}]},{"id":"mendel-03","title":"שתי תכונות במקביל: היחס 9:3:3:1","estMinutes":13,"source":"שיעור 3, עמ' 6–8","cards":[{"id":"m3-hook","type":"hook","text":"עד עכשיו עקבנו אחרי תכונה אחת בכל פעם.","sub":"אבל אף אורגניזם אמיתי הוא לא תכונה אחת. מה קורה כששני גנים משחקים בו-זמנית — הם מפריעים זה לזה?"},{"id":"m3-concept-setup","type":"concept","term":"נקודת הפתיחה: טהור בשני הגנים","text":"כמו קודם, מנדל התחיל מזנים טהורים — אבל הפעם **הומוזיגוטים בשני הגנים** שנבדקים, לא רק באחד.\n\nהוא לקח אפונה **צהובה ומקומטת** והכליא אותה עם אפונה **ירוקה ועגולה**.","rows":[["Y / y","צבע הזרע: **צהוב** דומיננטי, ירוק רצסיבי"],["R / r","צורת הזרע: **עגול** דומיננטי, מקומט רצסיבי"]],"note":"כל תכונה מקבלת אות משלה. שני הגנים לא חייבים להיות דומיננטיים באותו הורה — הצהוב־מקומט הוא YYrr, והירוק־עגול הוא yyRR."},{"id":"m3-example-f1","type":"example","text":"כל הורה טהור יכול לתת גמטה אחת בלבד:","work":["**YYrr** יכול לתת רק **Yr**","**yyRR** יכול לתת רק **yR**","ולכן כל דור F1 יוצא **YyRr**"],"note":"בפועל מנדל קיבל ב-F1 אפונים **צהובות ועגולות** — תכונה אחת מכל הורה. מכאן הוא ידע מי הדומיננטי: צהוב ועגול. הגנוטיפ YyRr נקרא **הטרוזיגוט כפול**."},{"id":"m3-concept-gametes","type":"concept","term":"כמה סוגי גמטות יכול YyRr לתת?","text":"כל גמטה מקבלת **אלל אחד מכל גן**. יש שתי אפשרויות לצבע ושתיים לצורה, וכל שילוב חוקי:","rows":[["YR","צהוב + עגול"],["Yr","צהוב + מקומט"],["yR","ירוק + עגול"],["yr","ירוק + מקומט"]],"note":"**ארבעה סוגים, בסיכוי שווה.** זה הצעד שקובע את כל השאר — ומכאן מגיע ריבוע של 4×4 במקום 2×2.","alt":[{"title":"למה בדיוק ארבעה","text":"בחר אלל לצבע: 2 אפשרויות.\nבחר אלל לצורה: 2 אפשרויות.\n\n2 × 2 = **4** צירופים. אותו חשבון כמו שתי מטבעות — עץ־עץ, עץ־פלי, פלי־עץ, פלי־פלי."}]},{"id":"m3-mcq-gametes","type":"mcq","level":2,"q":"אילו גמטות יכול לתת צמח שהוא **YYRr**?","options":["YR, Yr, yR, yr — ארבע","YR, Yr — שתיים בלבד","YR בלבד","YY, Rr"],"correct":1,"why":["לא. אין לו בכלל אלל y, אז אף גמטה שלו לא תכיל y.","נכון. לצבע יש לו רק **Y** לתת, ולצורה או **R** או **r**. סה\"כ שתיים.","לא. הוא הטרוזיגוט לצורה (Rr), ולכן יכול לתת גם R וגם r.","גמטה מקבלת **אלל אחד מכל גן**, לא זוג. YY זה גנוטיפ, לא גמטה."]},{"id":"m3-punnett-dihybrid","type":"punnett","q":"ההכלאה של F1: YyRr × YyRr. הריבוע כבר מלא כמעט כולו — השלם את ארבע הפינות באלכסון.","help":"כל משבצת = האלל מהשורה + האלל מהעמודה, לכל גן בנפרד.","top":["YR","Yr","yR","yr"],"side":["YR","Yr","yR","yr"],"chips":["YYRR","YYrr","yyRR","yyrr","YyRr"],"prefill":{"1":"YYRr","2":"YyRR","3":"YyRr","4":"YYRr","6":"YyRr","7":"Yyrr","8":"YyRR","9":"YyRr","11":"yyRr","12":"YyRr","13":"Yyrr","14":"yyRr"},"solution":[["YYRR","YYRr","YyRR","YyRr"],["YYRr","YYrr","YyRr","Yyrr"],["YyRR","YyRr","yyRR","yyRr"],["YyRr","Yyrr","yyRr","yyrr"]],"pheno":{"YYRR":{"label":"צהוב עגול","kind":"ok"},"YYRr":{"label":"צהוב עגול","kind":"ok"},"YyRR":{"label":"צהוב עגול","kind":"ok"},"YyRr":{"label":"צהוב עגול","kind":"ok"},"YYrr":{"label":"צהוב מקומט","kind":"mid"},"Yyrr":{"label":"צהוב מקומט","kind":"mid"},"yyRR":{"label":"ירוק עגול","kind":"mid"},"yyRr":{"label":"ירוק עגול","kind":"mid"},"yyrr":{"label":"ירוק מקומט","kind":"no"}},"after":"עכשיו הסתכל על הצבעים: גוש ירוק גדול, שתי קבוצות ביניים, ומשבצת אדומה בודדת בפינה. **זה היחס 9:3:3:1** — והוא יצא מהריבוע, לא משננו אותו."},{"id":"m3-mcq-ratio","type":"mcq","level":2,"q":"לפי הריבוע — כמה מתוך 16 יהיו **ירוקים ומקומטים**?","options":["9","3","1","4"],"correct":2,"why":["9 זה צהוב ועגול — שתי התכונות הדומיננטיות.","3 זה כל אחת משתי קבוצות הביניים: צהוב־מקומט או ירוק־עגול.","נכון. **רק yyrr**, משבצת אחת מתוך 16. זו הפינה היחידה שבה שני הגנים רצסיביים.","4 לא מופיע ביחס בכלל. הפירוק הוא 9 + 3 + 3 + 1 = 16."]},{"id":"m3-concept-law2","type":"concept","term":"החוק השני של מנדל: אי-תלות בסגרגציה","text":"התוצאה הזו מוכיחה משהו לא מובן מאליו:\n\n**גנים שונים עוברים להורים לילדים באופן בלתי תלוי זה בזה.** האלל שקיבלת לצבע לא משפיע בכלל על האלל שתקבל לצורה.","note":"לכן YyRr נותן את כל ארבע הגמטות **בסיכוי שווה**. אילו הגנים היו תלויים זה בזה, היינו מקבלים יחס אחר לגמרי — וזה בדיוק מה שקורה בתאחיזה, ביחידה 14.","alt":[{"title":"מה זה \"בלתי תלוי\" בפועל","text":"זריקת שתי קוביות. מה שיצא בראשונה לא משנה כלום לגבי השנייה.\n\nכך בדיוק הגנים כאן: הגרלה נפרדת לכל תכונה, באותו רגע, בלי שאחת מושכת את השנייה."}]},{"id":"m3-pitfall-single","type":"pitfall","text":"**תסתכל על תכונה אחת בלבד, והיחס חוזר להיות 3:1.**\n\nמתוך 16: צהובים = 9 + 3 = **12**. ירוקים = 3 + 1 = **4**. כלומר 12:4, שזה 3:1.","punch":"9:3:3:1 הוא פשוט 3:1 כפול 3:1. אין כאן חוק חדש — יש שני חוקים ישנים שרצים במקביל."},{"id":"m3-concept-formula","type":"concept","term":"הנוסחה שחוסכת ציור","text":"כשמכליאים הטרוזיגוטים בכל הגנים הנבדקים, אפשר לדעת כמה אפשרויות יתקבלו בלי לצייר כלום.\n\nעבור **n** גנים:","rows":[["פנוטיפים","2 בחזקת n"],["גנוטיפים","3 בחזקת n"]],"note":"בדיהיברידי: 2² = 4 פנוטיפים (וזה ה-9:3:3:1), ו-3² = 9 גנוטיפים. תספור בריבוע למעלה — בדיוק 9 גנוטיפים שונים."},{"id":"m3-mcq-trihybrid","type":"mcq","level":3,"q":"בהכלאה **תריהיברידית** (AaBbDd × AaBbDd) — כמה גנוטיפים שונים אפשריים?","options":["8","27","64","9"],"correct":1,"why":["8 זה מספר ה**פנוטיפים**: 2 בחזקת 3. השאלה על גנוטיפים.","נכון. 3 בחזקת 3 = **27**. כל גן תורם שלוש אפשרויות (AA, Aa, aa), והן מוכפלות.","64 זה מספר המשבצות בריבוע (8 גמטות × 8), לא מספר הגנוטיפים השונים — הרבה משבצות חוזרות.","9 זה המצב הדיהיברידי, עם שני גנים בלבד."]},{"id":"m3-recap","type":"recap","points":["הטרוזיגוט כפול **YyRr** נותן **4 סוגי גמטות** בסיכוי שווה, ולכן הריבוע הוא 4×4.","היחס בפנוטיפ הוא **9:3:3:1** — וזה פשוט 3:1 כפול 3:1, כי שני הגנים עצמאיים.","**החוק השני של מנדל**: גנים שונים מתפצלים לגמטות בלי להשפיע זה על זה. עבור n גנים — 2ⁿ פנוטיפים, 3ⁿ גנוטיפים."],"next":"לשלושה גנים ומעלה הריבוע כבר בלתי אפשרי — 64 משבצות ומעלה. ביחידה הבאה נחליף אותו בשתי נוסחאות הסתברות שעושות את אותה עבודה בשורה אחת."}]}],"plan":3},{"id":"03-probability","title":"שיטת ההסתברויות","lectures":"4","pages":"9–10","lessons":[{"id":"prob-01","title":"להכפיל או לחבר: שתי נוסחאות במקום ריבוע","estMinutes":12,"source":"שיעור 4, עמ' 9–10","cards":[{"id":"p1-hook","type":"hook","text":"הכלאה שעוקבת אחרי חמש תכונות דורשת ריבוע פאנט של **1024 משבצות**.","sub":"אתה לא הולך לצייר את זה, ובמבחן אין לך זמן. אז מה עושים?"},{"id":"p1-concept-why","type":"concept","term":"למה הריבוע נשבר","text":"מספר הגמטות מכל צד הוא 2 בחזקת מספר הגנים ההטרוזיגוטיים. מספר המשבצות הוא זה בריבוע.","rows":[["גן אחד","2 × 2 = 4 משבצות"],["שני גנים","4 × 4 = 16 משבצות"],["שלושה גנים","8 × 8 = 64 משבצות"],["חמישה גנים","32 × 32 = 1024 משבצות"]],"note":"הריבוע לא טועה — הוא פשוט לא מעשי. במקומו נשתמש בשני חוקי הסתברות שנותנים את אותה תשובה בשורה אחת."},{"id":"p1-concept-product","type":"concept","term":"חוק המכפלה — \"וגם\"","text":"**ההסתברות ששני אירועים בלתי תלויים יקרו שניהם = מכפלת ההסתברויות שלהם.**\n\nאירועים בלתי תלויים הם כאלה שלא משפיעים זה על זה בכלל.","rows":[["6 בקובייה אחת","1/6"],["6 בשתי קוביות","1/6 × 1/6 = 1/36"]],"note":"הקובייה השנייה לא יודעת מה יצא בראשונה — גם אם זרקת אותן יחד. זה מה שהופך אותן לבלתי תלויות.","alt":[{"title":"למה מכפלה ולא חיבור","text":"כי כל תנאי נוסף **מצמצם** את מה שנשאר.\n\nמחצי המקרים שעברו את התנאי הראשון, רק חצי יעברו גם את השני. חצי מחצי זה רבע — פחות, לא יותר.\n\nמכפלה תמיד מקטינה. חיבור מגדיל, ולכן הוא לא יכול להתאים ל\"וגם\"."}]},{"id":"p1-mcq-product","type":"mcq","q":"מה ההסתברות שרצף DNA באורך 3 נוקלאוטידים יהיה **GGG**?","options":["3/4","1/4 בחזקת 3","1/4 × 3","1/12"],"correct":1,"why":["לא. 3/4 הוא הסיכוי ש\"לא G\" במיקום אחד.","נכון. לכל מיקום יש 4 אפשרויות (A, T, C, G), אז 1/4 לכל אחד, והם בלתי תלויים: **1/4 × 1/4 × 1/4**.","זה חיבור מוסווה. \"וגם\" דורש הכפלה, לא הכפלה במספר האירועים.","1/12 לא נובע משום חישוב כאן."]},{"id":"p1-concept-sum","type":"concept","term":"חוק הסכום — \"או\"","text":"**ההסתברות שיקרה אחד מתוך כמה אירועים זרים = סכום ההסתברויות שלהם.**\n\nאירועים זרים הם כאלה שלא יכולים לקרות יחד באותו אירוע.","rows":[["4 בקובייה","1/6"],["5 בקובייה","1/6"],["4 או 5","1/6 + 1/6 = 1/3"]],"note":"בזריקה אחת אי אפשר לקבל גם 4 וגם 5 — הם מוציאים זה את זה. **זה התנאי לחיבור.**"},{"id":"p1-pitfall-which","type":"pitfall","text":"**המילה בשאלה מסגירה את הפעולה.**\n\n\"גם וגם\" / \"שניהם\" / \"ברצף\" → **מכפלה**.\n\"או\" / \"לפחות אחד מהשניים\" → **חיבור**.","punch":"אם אתה מהסס — שאל את עצמך אם שני הדברים יכולים לקרות באותו אירוע. אם כן, זה \"וגם\". אם לא, זה \"או\"."},{"id":"p1-mcq-combined","type":"mcq","level":2,"q":"מה ההסתברות שברצף DNA באורך 10, **כל** מיקום יהיה C או G?","options":["1/2 בחזקת 10","1/4 בחזקת 10","1/2 × 10","1/4 + 1/4"],"correct":0,"why":["נכון. קודם **חיבור** בתוך מיקום: C או G = 1/4 + 1/4 = 1/2. אחר כך **מכפלה** על פני 10 מיקומים: **1/2 בחזקת 10**.","זה היה נכון לאות אחת ספציפית בכל מיקום, לא לשתי אפשרויות.","חיבור במקום מכפלה. עשרה תנאים שכולם חייבים להתקיים — מכפילים.","זה רק המיקום הראשון. השאלה על עשרה."]},{"id":"p1-concept-apply","type":"concept","term":"איך זה עובד על הכלאה","text":"החוק השני של מנדל אומר שהגנים עצמאיים. **בדיוק בגלל זה מותר להכפיל.**\n\nהשיטה:","rows":[["1","מפצלים לגן אחד בכל פעם"],["2","מחשבים את ההסתברות לגן הבודד"],["3","מכפילים את כל התוצאות"]],"note":"בלי החוק השני זה היה אסור — גנים תלויים זה בזה (תאחיזה) שוברים בדיוק את ההנחה הזו. נגיע לזה ביחידה 14."},{"id":"p1-example-five","type":"example","text":"הכלאה בין שני זנים:\n\n**AaBbCcDdEe** × **AabbCcddEe**\n\nמה הסיכוי לצאצא **הומוזיגוט רצסיבי בכל חמשת הגנים**? במקום 1024 משבצות — חמש שורות:","work":["גן A: Aa × Aa → **aa** בסיכוי 1/4","גן B: Bb × bb → **bb** בסיכוי 1/2","גן C: Cc × Cc → **cc** בסיכוי 1/4","גן D: Dd × dd → **dd** בסיכוי 1/2","גן E: Ee × Ee → **ee** בסיכוי 1/4"],"stat":{"value":"1 / 256","label":"¼ × ½ × ¼ × ½ × ¼"},"note":"שים לב לתבנית: **הטרוזיגוט × הטרוזיגוט נותן 1/4 לרצסיבי. הטרוזיגוט × רצסיבי נותן 1/2.** שתי התבניות האלה מכסות כמעט כל שאלה מהסוג הזה."},{"id":"p1-mcq-apply","type":"mcq","level":3,"q":"בהכלאה **AaBbCc × AaBbCc**, מה הסיכוי לצאצא שהוא **דומיננטי בפנוטיפ בכל שלושת הגנים**?","options":["27/64","1/64","3/4","9/16"],"correct":0,"why":["נכון. לכל גן, הטרוזיגוט × הטרוזיגוט נותן פנוטיפ דומיננטי בסיכוי **3/4**. שלושה גנים עצמאיים: 3/4 בחזקת 3 = **27/64**.","1/64 זה הסיכוי להיות רצסיבי בכל השלושה (1/4 בחזקת 3) — ההפך מהנשאל.","3/4 זה גן אחד בלבד. יש שלושה.","9/16 זה שני גנים (3/4 בריבוע). כאן שלושה."]},{"id":"p1-recap","type":"recap","points":["**\"וגם\" → מכפלה** (אירועים בלתי תלויים). **\"או\" → חיבור** (אירועים זרים שלא יכולים לקרות יחד).","בהכלאה מרובת גנים: מפצלים לגן אחד בכל פעם, מחשבים, ומכפילים. מותר רק כי הגנים עצמאיים.","שתי תבניות לזכור: **Aa × Aa → 1/4 רצסיבי, 3/4 דומיננטי.** **Aa × aa → 1/2 ו-1/2.**"],"next":"עד עכשיו אמרנו \"עותק תקין אחד מספיק\" בלי להסביר למה. בשיעור הבא נרד לרמת החלבון ונראה בדיוק מה קורה שם — דרך מחלה אמיתית."}]},{"id":"prob-02","title":"למה רצסיבי הוא רצסיבי: התשובה ברמת החלבון","estMinutes":11,"source":"שיעור 4, עמ' 10","cards":[{"id":"p2-hook","type":"hook","text":"אמרתי לך כבר בשיעור הראשון ש\"עותק תקין אחד מספיק\".","sub":"אבל למה בעצם? מה קורה שם באמת שגורם לזה לעבוד? הגיע הזמן לרדת רמה."},{"id":"p2-concept-protein","type":"concept","term":"מה גן באמת עושה","text":"גן הוא **הוראה לייצור חלבון**. הדרך מהוראה למוצר:","rows":[["1","ה-DNA בגרעין מועתק למולקולת **RNA**"],["2","ה-RNA יוצא מהגרעין ומגיע ל**ריבוזום**"],["3","הריבוזום קורא **3 אותיות בכל פעם**, וכל שלישייה = חומצה אמינית"],["4","החומצות האמיניות משתרשרות ויוצרות את **החלבון**"]],"note":"נלמד את זה לעומק ביחידה 15. כרגע מספיקה השורה התחתונה: **גן = חלבון. אלל שונה = חלבון קצת אחר.**"},{"id":"p2-concept-melanin","type":"concept","term":"לבקנות: מחלה עם מנגנון ידוע","text":"**מלאנין** הוא הפיגמנט שנותן צבע לעור, לשיער ולעיניים. מי שאין לו ייצור מלאנין נקרא **לבקן** — עור לבן, שיער לבן, עיניים בהירות.\n\nייצור המלאנין הוא שרשרת שלבים. אחד מהם: חומצת אמינו בשם **טירוזין** נחתכת על ידי אנזים בשם **טירוזינאז**.","note":"לבקנות היא פגם בגן שמייצר את הטירוזינאז. נוצר חלבון שלא מסוגל לחתוך את הטירוזין — ובלי החיתוך הזה, אין מלאנין.","alt":[{"title":"השרשרת בשורה אחת","text":"גן תקין ← אנזים טירוזינאז תקין ← טירוזין נחתך ← מלאנין ← צבע.\n\nשבור חוליה אחת בשרשרת, וכל מה שאחריה לא קורה. הצבע לא נעלם — הוא **פשוט לא נוצר**."}]},{"id":"p2-example-three","type":"example","text":"עכשיו שלושת הגנוטיפים, אבל הפעם **ברמת האנזים** ולא ברמת האותיות:","work":["**שני עותקים תקינים** — שני עותקים מייצרים טירוזינאז. מלאנין נוצר כרגיל","**עותק תקין אחד** — רק אחד מייצר טירוזינאז. **חצי מהכמות, וזה מספיק**. מלאנין נוצר, והאדם נראה רגיל לחלוטין","**שני עותקים פגומים** — שניהם מייצרים טירוזינאז פגום. אין חיתוך, אין מלאנין"],"note":"הנה התשובה שחיפשנו: **חצי מכמות האנזים מספיקה כדי לשמור על מצב תקין.** זה כל הסוד מאחורי \"עותק אחד מספיק\"."},{"id":"p2-pitfall-strong","type":"pitfall","text":"עכשיו אפשר לנסח את זה מדויק: **האלל התקין לא \"מנצח\" את הפגום.**\n\nשניהם עובדים במקביל, בכל תא. אחד מייצר אנזים תקין והשני מייצר אנזים פגום — והם לא נלחמים.","punch":"פשוט מספיקה כמות האנזים שהעותק התקין מייצר. \"דומיננטי\" מתאר תוצאה, לא מאבק."},{"id":"p2-mcq-hetero","type":"mcq","level":2,"q":"אצל הטרוזיגוט ללבקנות — האם מיוצר טירוזינאז פגום?","options":["לא. האלל התקין מונע את ייצורו","כן. שני העותקים פעילים, ואחד מהם מייצר חלבון פגום","כן, אבל רק בחלק מהתאים","לא, כי האלל הפגום שקט"],"correct":1,"why":["לא. שום אלל לא \"מכבה\" את השני. שניהם מתבטאים.","נכון. **מיוצרים שני סוגי חלבון בו-זמנית** — תקין ופגום. הפנוטיפ תקין כי הכמות התקינה מספיקה, לא כי הפגום נעלם.","לא. ההתבטאות היא בכל התאים, לא בחלקם.","\"שקט\" מתאר את הפנוטיפ, לא את הגן. הגן פעיל ומייצר."]},{"id":"p2-mcq-principle","type":"mcq","level":3,"q":"רוב המחלות שנגרמות מ**חוסר באנזים** הן רצסיביות. מה ההסבר הכי טוב?","options":["אנזימים הם חלבונים קטנים ולכן פחות חשובים","50% מפעילות האנזים בדרך כלל מספיקה לתפקוד תקין","מוטציות באנזימים נדירות יותר","אנזימים מיוצרים רק מעותק אחד ממילא"],"correct":1,"why":["גודל החלבון לא קשור. אנזימים חיוניים לגמרי.","נכון, וזה עיקרון שילווה אותך בכל הגנטיקה הרפואית: **המערכת בנויה עם מרווח ביטחון.** חצי אנזים מספיק, ולכן נשא לא חולה.","השכיחות של מוטציות לא קובעת אם מחלה דומיננטית או רצסיבית.","לא נכון. שני העותקים מתבטאים ומייצרים."]},{"id":"p2-recap","type":"recap","points":["**גן = הוראה לחלבון.** אלל רצסיבי הוא בדרך כלל גרסה שמייצרת חלבון שלא עובד.","אצל הטרוזיגוט **שני האללים פעילים** ומיוצרים שני סוגי חלבון. אין מאבק — פשוט מספיקה הכמות התקינה.","**חצי מפעילות האנזים מספיקה** בדרך כלל, ולכן מחלות של חוסר אנזים הן רצסיביות ונשאים בריאים."],"next":"עד עכשיו כל הגנים שראינו היו על כרומוזומים רגילים, ולכן ההורשה הייתה זהה לגברים ולנשים. ביחידה הבאה — מה משתנה כשהגן יושב על כרומוזום המין."}]}],"plan":2},{"id":"04-sex-chromosomes","title":"כרומוזומי מין והשתקת X","lectures":"5–6","pages":"11–16","lessons":[{"id":"sex-01","title":"למה זה תמיד קורה לגברים","estMinutes":13,"source":"שיעור 5, עמ' 11–13","cards":[{"id":"s1-hook","type":"hook","text":"עיוורון צבעים: כ-8% מהגברים, ופחות מ-0.5% מהנשים.","sub":"המופיליה: כמעט אך ורק גברים. זו לא במקרה אותה תבנית. מה שונה שם?"},{"id":"s1-concept-two-kinds","type":"concept","term":"שני סוגי כרומוזומים","text":"מתוך 23 הזוגות שלך, 22 הם **אוטוזומליים** — זהים אצל גברים ונשים. הזוג האחרון הוא **כרומוזומי המין**, ורק בו יש הבדל.","rows":[["אישה","XX"],["גבר","XY"]],"note":"כל מה שלמדנו עד עכשיו היה על גנים אוטוזומליים — גם האפונים של מנדל. **שם ההורשה זהה לחלוטין לשני המינים.** כאן היא לא."},{"id":"s1-concept-x-vs-y","type":"concept","term":"X ו-Y הם לא זוג רגיל","text":"בכל 22 הזוגות האחרים שני הכרומוזומים **הומולוגיים** — נושאים את אותם גנים. אצל גבר, X ו-Y נושאים גנים שונים לגמרי.","rows":[["X","גדול, מאות גנים, רבים מהם **חיוניים לחיים**"],["Y","קטן, כמה עשרות גנים, כמעט כולם קשורים לזכריות"]],"note":"אי אפשר לחיות בלי X. **כן** אפשר לחיות בלי Y — כל אישה חיה בלעדיו. רק בקצוות של X ו-Y יש אזורים הומולוגיים, והם נחוצים כדי שהשניים ייפרדו נכון במיוזה.","alt":[{"title":"למה זה כל כך לא סימטרי","text":"X הוא כרומוזום רגיל לכל דבר, עם גנים חיוניים לשני המינים — קרישת דם, ראיית צבעים, שרירים.\n\nY הוא בעצם מתג. תפקידו העיקרי הוא להחליט \"זכר\", וזהו.\n\nהם נקראים \"זוג\" רק כי הם מתנהגים כזוג בחלוקת התא — לא כי הם דומים."}]},{"id":"s1-concept-hemizygous","type":"concept","term":"המיזיגוט — הסיבה לכל העניין","text":"לגבר יש **עותק אחד בלבד** מכל גן שיושב על X. אין לו גיבוי, כי ב-Y אין את הגנים האלה.\n\nהמצב הזה נקרא **המיזיגוט**.","rows":[["אישה","שני עותקים של כל גן על X — יש גיבוי"],["גבר","עותק אחד בלבד — **אין גיבוי**"]],"note":"וזו כל התשובה לשאלה שפתחנו איתה: אצל גבר, אלל רצסיבי על X **מתבטא מיד**. אין עותק שני שיכסה עליו.","alt":[{"title":"החוקים הישנים לא חלים כאן","text":"כל מה שלמדנו נשען על \"שני עותקים, אחד מספיק\".\n\nלגבר, על כרומוזום X, **אין שני עותקים**. יש אחד. ולכן אין הבדל בין דומיננטי לרצסיבי — מה שיש, מתבטא.\n\nגבר לא יכול להיות \"נשא\" של מחלה תפוסת X. או שהיא אצלו, או שלא."}]},{"id":"s1-concept-notation","type":"concept","term":"הסימון משתנה","text":"כדי לא להתבלבל עם גנים אוטוזומליים, כותבים את האלל **על גבי** ה-X:","rows":[["XR","כרומוזום X שנושא את האלל הדומיננטי"],["Xr","כרומוזום X שנושא את האלל הרצסיבי"],["Y","בלי אלל — הגן פשוט לא קיים שם"]],"note":"ולכן אישה יכולה להיות XRXR, XRXr או XrXr, אבל גבר יכול להיות רק **XRY או XrY**. שתי אפשרויות, לא שלוש."},{"id":"s1-punnett-carrier","type":"punnett","q":"אמא **נשאית** לעיוורון צבעים (XRXr) עם אבא בריא (XRY). מלא את הריבוע.","help":"למעלה הגמטות של האבא, בצד של האמא. בכל משבצת שים לב גם למין וגם לתכונה.","top":["XR","Y"],"side":["XR","Xr"],"chips":["XRXR","XRY","XRXr","XrY"],"solution":[["XRXR","XRY"],["XRXr","XrY"]],"pheno":{"XRXR":{"label":"בת בריאה","kind":"ok"},"XRY":{"label":"בן בריא","kind":"ok"},"XRXr":{"label":"בת נשאית","kind":"mid"},"XrY":{"label":"בן חולה","kind":"no"}},"after":"**מחצית מהבנים חולים. אף בת לא חולה.** הבנים מקבלים את ה-X היחיד שלהם מאמא — ואם הוא נושא את האלל הפגום, אין מה שיכסה עליו."},{"id":"s1-mcq-father","type":"mcq","level":2,"q":"גבר עם עיוורון צבעים (XrY) מתחתן עם אישה שאינה נשאית (XRXR). מה יקרה לילדיהם?","options":["מחצית הבנים יהיו עיוורי צבעים","כל הבנים בריאים, כל הבנות נשאיות","כל הילדים חולים","מחצית הבנות יהיו חולות"],"correct":1,"why":["לא. אבא נותן לבנים **Y** בלבד, לא X. הוא לא יכול להוריש להם את התכונה הזו כלל.","נכון. הבנים מקבלים מאבא Y ומאמא XR — כולם בריאים. הבנות מקבלות מאבא את ה-Xr שלו ומאמא XR — **כולן נשאיות**.","לא. אף ילד לא יהיה חולה בהכלאה הזו.","בת חולה דורשת Xr משני ההורים. כאן אמא נותנת רק XR."]},{"id":"s1-pitfall-father-son","type":"pitfall","text":"**אבא לעולם לא מוריש תכונה תפוסת X לבן שלו.**\n\nלבן הוא נותן Y, ורק Y. ה-X של הבן מגיע תמיד מאמא, בלי יוצא מן הכלל.","punch":"לכן אם בעץ משפחה אתה רואה אב חולה ובן חולה — ההורשה כנראה **אינה** תפוסת X. זה סימן זיהוי חזק, ונשתמש בו הרבה ביחידה 5."},{"id":"s1-concept-reciprocal","type":"concept","term":"המבחן שחושף הכל: הכלאה רציפרוקלית","text":"**הכלאה רציפרוקלית** = מבצעים את אותה הכלאה, אבל מחליפים את התכונה בין האב לאם.\n\nזה מבחן האבחון החשוב ביותר בפרק הזה:","rows":[["גן אוטוזומלי","שתי ההכלאות נותנות **בדיוק אותה תוצאה**"],["גן על X","שתי ההכלאות נותנות **תוצאות שונות**"]],"note":"מנדל עשה הכלאות רציפרוקליות ותמיד קיבל אותו דבר — ובצדק, כי כל שבע התכונות שבדק היו אוטוזומליות. אצל זבוב הפירות, שבו הגן לצבע העיניים יושב על X, ההבדל קפץ מיד לעין.","alt":[{"title":"למה זה עובד","text":"בגן אוטוזומלי אין משמעות לשאלה מי ההורה שתרם — שני הצדדים תורמים אותו סוג כרומוזום.\n\nעל X יש משמעות עצומה: אמא תורמת X לכולם, אבא תורם X רק לבנות.\n\n**החלפת הכיוון משנה את התוצאה בדיוק כי התרומה לא סימטרית.**"}]},{"id":"s1-mcq-reciprocal","type":"mcq","level":3,"q":"בהכלאה A×B קיבלת תוצאה אחת, ובהכלאה ההפוכה (B×A) תוצאה שונה לגמרי. מה זה מלמד?","options":["אחת ההכלאות בוצעה לא נכון","הגן ככל הנראה יושב על כרומוזום מין","הגן דומיננטי","יש כאן שני גנים ולא אחד"],"correct":1,"why":["לא. זו תוצאה צפויה ותקפה — היא בדיוק מה שהניסוי נועד לגלות.","נכון. **חוסר סימטריה בין ההכלאות ההפוכות הוא חתימה של תאחיזה למין.** בגן אוטוזומלי הכיוון לא משנה.","דומיננטיות לא יוצרת הבדל בין הכלאות הפוכות. שתיהן היו נותנות אותה תוצאה.","מספר הגנים לא מסביר אסימטריה בין כיווני ההכלאה."]},{"id":"s1-recap","type":"recap","points":["22 זוגות **אוטוזומליים** מתנהגים כמו שלמדנו. זוג המין הוא היוצא מן הכלל: אישה XX, גבר XY.","גבר הוא **המיזיגוט** ל-X — עותק אחד, בלי גיבוי. לכן אלל רצסיבי על X מתבטא אצלו מיד, והוא לא יכול להיות נשא.","**אבא מוריש X רק לבנות.** הכלאה רציפרוקלית שנותנת תוצאה שונה מעידה על גן תפוס מין."],"next":"אם לאישה יש שני עותקים של X ולגבר רק אחד — למה לנשים אין פי שניים חלבון מכל גן על X? התשובה היא מנגנון מפתיע, ואפשר לראות אותו בעיניים על פרוות של חתולה."}]},{"id":"sex-02","title":"השתקת X: המנגנון שרואים על פרווה של חתולה","estMinutes":12,"source":"שיעור 5–6, עמ' 13–16","cards":[{"id":"s2-hook","type":"hook","text":"לאישה יש שני עותקים של כל גן על X. לגבר יש אחד.","sub":"אז למה לנשים אין פי שניים חלבון מכל אחד מהגנים האלה? בפועל הכמות זהה. איך?"},{"id":"s2-concept-problem","type":"concept","term":"הבעיה: גנים עובדים לפי כמות","text":"מכל גן אוטוזומלי שני העותקים עוברים שעתוק, ומיוצר חלבון משניהם. **הפעילות תלויה בכמות** — יותר חלבון, יותר פעילות.\n\nוזה בדיוק מה שיוצר את הבעיה בכרומוזומי המין:","rows":[["גנים על Y","לנשים אין אותם כלל — והן מסתדרות מצוין"],["גנים על X","לאישה שני עותקים, לגבר אחד. **פי שניים חלבון?**"]],"note":"המערכת צריכה כמות מדויקת של החלבונים האלה, זהה בשני המינים. פי שניים אינו אפשרות."},{"id":"s2-concept-inactivation","type":"concept","term":"הפתרון: לכבות אחד","text":"בשלב מוקדם מאוד בהתפתחות העוברית של נקבה, **בכל תא ותא מושתק אחד משני כרומוזומי ה-X**.\n\nמושתק = כאילו נלחץ עליו כפתור כיבוי. הוא לא עובר שעתוק ולא מייצר חלבונים. רק השני נשאר פעיל.","note":"התהליך קורה **רק בנקבות**. לזכר יש X אחד בלבד, ואם הוא היה מושתק הוא לא היה יכול לחיות.","alt":[{"title":"התוצאה בשורה אחת","text":"בכל תא בגוף האישה עובד **X אחד בלבד** — בדיוק כמו אצל גבר.\n\nהחלבונים מיוצרים מעותק אחד אצל שני המינים, והכמות יוצאת זהה. הבעיה נפתרה בכיבוי, לא בהתאמה."}]},{"id":"s2-concept-random","type":"concept","term":"אקראי — אבל רק בפעם הראשונה","text":"זו הנקודה העדינה בפרק, וממנה נובע כל השאר:","rows":[["אקראי","בכל תא מוגרל **מי** יושתק: ה-X מאמא או ה-X מאבא. בערך חצי-חצי"],["קבוע","מרגע ההגרלה, **כל התאים שייווצרו מאותו תא ישמרו על אותה השתקה**"]],"note":"לכן גוף של אישה הוא **פסיפס**: אזורים שלמים שבהם פעיל ה-X של אמא, ולצידם אזורים שבהם פעיל ה-X של אבא. ההשתקה נקבעת בעובר ונשארת לכל החיים."},{"id":"s2-mcq-random","type":"mcq","level":2,"q":"לשתי אחיות תאומות זהות יש אותם שני כרומוזומי X בדיוק. האם דפוס ההשתקה שלהן יהיה זהה?","options":["כן — אותם כרומוזומים, אותה תוצאה","לא — ההגרלה מתבצעת בנפרד בכל עובר","כן, כי ההשתקה נקבעת גנטית","רק אם הן נולדו באותו זמן"],"correct":1,"why":["לא. הכרומוזומים זהים, אבל **ההחלטה איזה מהם לכבות בכל תא היא הגרלה** שמתרחשת בנפרד בכל עובר.","נכון. אותו גנוטיפ בדיוק, ובכל זאת פסיפס שונה. זו דוגמה יפה לכך שלא כל הבדל בין אנשים הוא גנטי.","לא. שום דבר בגנים לא קובע איזה X יושתק — זה אקראי.","עיתוי הלידה לא רלוונטי. ההגרלה קורית בשלב עוברי מוקדם."]},{"id":"s2-example-calico","type":"example","text":"הפסיפס הזה **נראה לעין** אצל חתולות מסוג קליקו.\n\nהגן לצבע הפרווה — כתום או שחור — יושב על כרומוזום X.","work":["**זכר**: X אחד בלבד, ולכן צבע אחיד — או כולו כתום או כולו שחור","**נקבה הטרוזיגוטית**: בחלק מהתאים הושתק הכתום, בחלק הושתק השחור","התוצאה: **כתמים כתומים וכתמים שחורים** על אותה חתולה"],"note":"אפשר לקחת 1000 חתולות קליקו ולקבל 1000 דפוסים שונים. אין שתיים זהות, כי בכל אחת ההגרלה יצאה אחרת. **זו ההשתקה, גלויה על הפרווה.**"},{"id":"s2-mcq-calico","type":"mcq","level":3,"q":"למה חתול **זכר** כמעט לעולם אינו קליקו?","options":["הגן לצבע פעיל רק בנקבות","יש לו X אחד, ולכן אין שני אללים שיוכלו להתחלף בין תאים","זכרים לא עוברים השתקת X","הצבע הכתום דומיננטי בזכרים"],"correct":1,"why":["הגן פעיל בשני המינים באותה מידה.","נכון. קליקו דורש **שני אללים שונים על שני כרומוזומי X**, ואז השתקה אקראית יוצרת את הפסיפס. לזכר יש X אחד — אלל אחד — ולכן צבע אחיד.","נכון שהם לא עוברים השתקה, אבל זה תוצאה ולא סיבה: אין להם מה להשתיק. הסיבה היא שאין להם שני אללים.","אין דומיננטיות שונה בין המינים. הבעיה היא מספר האללים, לא היחס ביניהם."]},{"id":"s2-concept-barr-xist","type":"concept","term":"גופיף באר והגן XIST","text":"ה-X המושתק **נדחס** פיזית לגוש צפוף בתוך הגרעין. בצביעה הוא נראה ככתם כהה, ונקרא **גופיף באר**.","rows":[["מי גילתה","מארי ליון — ומכאן השם *ליוניזציה*"],["המנגנון","הגן **XIST** מתחיל להתבטא באחד מכרומוזומי ה-X"],["איך","הוא מייצר מולקולת RNA שנקשרת חזרה **לכרומוזום שיצר אותה** ודוחסת אותו"]],"note":"זהו מקרה נדיר שבו התוצר הסופי של גן הוא **RNA ולא חלבון** — וה-RNA הזה פועל על הכרומוזום שממנו הגיע. בלי XIST פעיל תיווצר כמות יתר של חלבוני X, ולא יתאפשרו חיים תקינים."},{"id":"s2-example-duchenne","type":"example","text":"לפסיפס יש משמעות רפואית ישירה. **מחלת דושן** היא מחלת שרירים תפוסת X.","work":["**גבר**: X אחד — או חולה לגמרי, או בריא לגמרי","**אישה נשאית**: שני X, ובכל תא הוגרל אחר","התוצאה: **מצב ביניים** — לא חולה לגמרי ולא בריאה לגמרי"],"note":"ולכן חומרת המצב **שונה מאישה לאישה**: אצל כל אחת ההגרלה פגעה ברקמות אחרות. זו הסיבה שנשאיות של מחלות תפוסות X לא תמיד בריאות לחלוטין, בניגוד לנשאיות אוטוזומליות."},{"id":"s2-concept-dosage","type":"concept","term":"פיצוי מינון — השם הכללי","text":"**פיצוי מינון** הוא כל מנגנון שמונע ביטוי יתר של כרומוזום X. השתקה היא רק אחת הדרכים, ולא כל היצורים בחרו בה:","rows":[["בני אדם","משתיקים X אחד אצל הנקבה"],["דרוזופילה","אין השתקה — ה-X **של הזכר** מתבטא פי שניים"],["תולעת elegans","שני ה-X של הנקבה מתבטאים, אך **בעוצמה מופחתת**"]],"note":"שלוש דרכים שונות לגמרי, אותה מטרה בדיוק: **איזון בכמות החלבון בין המינים.** זה מה שהמושג מתאר — את הבעיה שנפתרת, לא את הפתרון המסוים."},{"id":"s2-recap","type":"recap","points":["**השתקת X**: בכל תא של נקבה מכובה אחד משני כרומוזומי ה-X, כדי שכמות החלבון תהיה זהה לזו של גבר.","ההגרלה **אקראית בכל תא אך נשמרת בתאי הבת** — ולכן גוף של אישה הוא פסיפס. חתולת קליקו היא ההוכחה הגלויה.","ה-X המושתק נדחס ל**גופיף באר**, בפעולת ה-RNA של הגן **XIST**. פיצוי מינון הוא השם הכללי, ומינים שונים משיגים אותו אחרת."],"next":"נשאר כרומוזום אחד שלא דיברנו עליו לעומק — Y, והגן היחיד שבו שקובע הכל."}]},{"id":"sex-03","title":"כרומוזום Y: מתג אחד שקובע הכל","estMinutes":10,"source":"שיעור 5–6, עמ' 11–13, 16","cards":[{"id":"s3-hook","type":"hook","text":"מה בעצם הופך עובר לזכר?","sub":"התשובה היא לא \"כרומוזום Y\". היא הרבה יותר ממוקדת מזה — גן בודד עליו."},{"id":"s3-concept-y","type":"concept","term":"מה יש על Y","text":"Y הוא הכרומוזום הקטן בגנום. יש עליו רק **כמה עשרות גנים**, וכמעט כולם עוסקים בזכריות ובפוריות.\n\nהחשוב שבהם נקרא **SRY**.","note":"בהשוואה: על X יש מאות גנים, רבים מהם חיוניים לחיים בשני המינים. Y הוא לא \"הכרומוזום הגברי המקביל ל-X\" — הוא כרומוזום קטן וממוקד לתפקיד אחד."},{"id":"s3-concept-sry","type":"concept","term":"SRY: ברירת המחדל ומה שמבטל אותה","text":"העובדה הזו מפתיעה רבים: **ברירת המחדל ביונקים היא התפתחות לנקבה.**\n\nעובר שאין בו SRY יתפתח לנקבה. זה לא דורש שום מתג — זו התוכנית הבסיסית.","rows":[["אין SRY","התפתחות נקבית — ברירת המחדל"],["יש SRY","החלבון שלו **מדכא** את ההתפתחות הנקבית ומעודד יצירת אשכים"],["אשכים","מפרישים הורמונים, שמניעים את שאר ההתפתחות הזכרית"]],"note":"כלומר SRY לא \"בונה\" זכר בעצמו. הוא מדליק שרשרת: אשכים ← הורמונים ← מאפיינים זכריים.","alt":[{"title":"המתג, לא המכונה","text":"SRY הוא **מתג הפעלה**, לא תוכנית הבנייה.\n\nהוא לא מכיל את ההוראות לגוף גברי. הוא רק מחליט לאיזה מסלול העובר ייכנס, ומשם ההורמונים עושים את העבודה.\n\nגן אחד, החלטה אחת, שרשרת ארוכה אחריו."}]},{"id":"s3-mcq-default","type":"mcq","level":2,"q":"עובר אנושי ללא כרומוזום Y — לאיזה כיוון יתפתח?","options":["לא יתפתח כלל","יתפתח לנקבה — זו ברירת המחדל","יתפתח לזכר בעל פוריות מופחתת","תלוי בהורמונים של האם"],"correct":1,"why":["לא. אפשר לחיות בלי Y לגמרי — כך חיה כל אישה.","נכון. **בהיעדר SRY, המסלול הנקבי הוא ברירת המחדל.** אין צורך בגן שיפעיל אותו.","בלי SRY לא מתחיל המסלול הזכרי כלל.","הורמוני האם לא קובעים את מין העובר. הקביעה גנטית, ומתרחשת בעובר עצמו."]},{"id":"s3-example-mismatch","type":"example","text":"מכיוון שהכל תלוי בגן אחד, פגיעה בו מנתקת בין הכרומוזומים למראה החיצוני. שני מצבים הפוכים:","work":["**SRY פגום על Y** — הקריוטיפ הוא XY, אבל המסלול הזכרי לא הופעל, וההתפתחות החיצונית נקבית","**SRY עבר לכרומוזום X** — הקריוטיפ הוא XX, אבל SRY קיים ומופעל, וההתפתחות החיצונית זכרית"],"note":"בשני המקרים יש אי-התאמה בין הקריוטיפ לפנוטיפ, ובדרך כלל גם **אי-פוריות** — כי לפיתוח מערכת רבייה מתפקדת נדרשים גנים נוספים שאינם במקומם. איך SRY עובר בכלל לכרומוזום אחר? זו **טרנסלוקציה**, ונלמד אותה ביחידה 9."},{"id":"s3-pitfall-xy","type":"pitfall","text":"**\"XY = זכר\" הוא כלל אצבע, לא חוק.**\n\nהקובע האמיתי הוא נוכחות של **SRY פעיל** — ובדרך כלל, אך לא תמיד, הוא יושב על Y.","punch":"לכן קריוטיפ לבדו לא תמיד מספר את כל הסיפור, וזו נקודה שנבחנת."},{"id":"s3-concept-gametic","type":"concept","term":"הומוגמטי והטרוגמטי","text":"המונחים האלה מתארים **מי מהמינים מייצר שני סוגי גמטות**:","rows":[["הומוגמטי","שני כרומוזומי מין זהים — מייצר סוג גמטה אחד"],["הטרוגמטי","שני כרומוזומי מין שונים — מייצר **שני** סוגי גמטות"]],"note":"אצל בני אדם: האישה הומוגמטית (XX, נותנת רק X), הגבר הטרוגמטי (XY, נותן X או Y). **ולכן האב הוא שקובע את מין הילד.** אצל עשים זה הפוך בדיוק — הזכר הומוגמטי והנקבה הטרוגמטית, ואז משתמשים באותיות אחרות מ-XY כדי לא להתבלבל."},{"id":"s3-concept-nonchromosomal","type":"concept","term":"ולא תמיד זה גנטי בכלל","text":"קביעת מין באמצעות כרומוזומים היא רק אחת השיטות בטבע:","rows":[["סוגי זוחלים","**טמפרטורת הביצה** קובעת אם ייבקע זכר או נקבה"],["תולעת ימית","הפרט הופך לנקבה אם פגש זכר, ולזכר אם פגש נקבה"],["צמחים רבים","אותו פרט נושא איברים זכריים ונקביים — כמו האפונה של מנדל"]],"note":"**תאחיזה לזוויג** רלוונטית רק במינים שבהם יש הבדל כרומוזומלי בין המינים. באפונה של מנדל אין הפרדה כזו כלל — ולכן כל שבע התכונות שבדק היו בהכרח אוטוזומליות."},{"id":"s3-mcq-sex-determination","type":"mcq","level":3,"q":"אצל עשים הנקבה היא ההטרוגמטית. מי קובע את מין הצאצא?","options":["האב, כמו אצל בני אדם","האם — היא זו שמייצרת שני סוגי גמטות","שניהם בשווה","הטמפרטורה"],"correct":1,"why":["לא. אצל בני אדם האב קובע **דווקא מפני שהוא ההטרוגמטי** — לא מפני שהוא האב.","נכון. **ההורה ההטרוגמטי הוא שקובע**, כי רק הגמטה שלו יכולה להגיע בשני סוגים. אצל עשים זו האם.","לא. ההורה ההומוגמטי תורם תמיד את אותו כרומוזום מין, ולכן לא משפיע על התוצאה.","טמפרטורה קובעת אצל זוחלים מסוימים, לא במין שיש בו כרומוזומי מין."]},{"id":"s3-recap","type":"recap","points":["Y קטן ונושא עשרות גנים בלבד. **SRY** הוא המתג: בלעדיו ההתפתחות נקבית כברירת מחדל, ואיתו מופעל המסלול הזכרי.","פגיעה ב-SRY או מעבר שלו ל-X יוצרים **אי-התאמה בין הקריוטיפ למראה החיצוני**, בדרך כלל עם אי-פוריות.","**ההורה ההטרוגמטי קובע את המין.** אצלנו זה האב, אצל עשים זו האם, ואצל זוחלים מסוימים זו הטמפרטורה."],"next":"עכשיו יש לך את כל סוגי ההורשה: אוטוזומלי ותפוס X, דומיננטי ורצסיבי. ביחידה הבאה נלמד לקרוא **אילן יוחסין** — ולזהות מתוכו איזה מהארבעה מדובר."}]}],"plan":3},{"id":"05-inheritance-patterns","title":"סוגי הורשה ואילנות יוחסין","lectures":"7–8","pages":"17–26","lessons":[{"id":"pat-01","title":"אוטוזומלי דומיננטי: המחלה שלא מדלגת","estMinutes":12,"source":"שיעור 6–7, עמ' 17–19","cards":[{"id":"d1-hook","type":"hook","text":"משפחה שבה בכל דור, בלי יוצא מן הכלל, יש חולים.","sub":"סבא, אבא, ועכשיו הבן. גברים ונשים כאחד. מה זה מספר לך לפני שראית גן אחד?"},{"id":"d1-concept-pedigree","type":"concept","term":"איך קוראים אילן יוחסין","text":"**אילן יוחסין** הוא תרשים המשפחה שממנו מסיקים את דפוס ההורשה. השפה קבועה:","rows":[["ריבוע","זכר"],["עיגול","נקבה"],["צבע מלא","חולה"],["עיגול עם נקודה","נשאית — בריאה, נושאת את האלל"]],"note":"את הדורות מסמנים בספרות **רומיות** (I, II, III), ואת הפרטים בכל דור במספרים רגילים. כך אפשר לומר \"II-3\" ולדעת בדיוק על מי מדובר. **זה הסימון שמופיע בשאלות המבחן.**"},{"id":"d1-concept-ad","type":"concept","term":"אוטוזומלי דומיננטי","text":"כאן התפקידים מתהפכים ממה שהתרגלת אליו: **האלל הבריא הוא הרצסיבי, והאלל הפגום הוא הדומיננטי.**\n\nולכן מספיק עותק פגום אחד כדי להיות חולה.","rows":[["AA","חולה (ולעיתים אף קטלני)"],["Aa","חולה"],["aa","**בריא** — וזה הגנוטיפ הנפוץ באוכלוסייה"]],"note":"שים לב שהאלל השכיח כאן הוא דווקא הרצסיבי, כי הוא הבריא. **דומיננטי לא אומר נפוץ.** זו טעות נפוצה נוספת שנובעת מהמילה עצמה.","alt":[{"title":"למה זה מרגיש הפוך","text":"בכל מה שלמדנו עד עכשיו האלל הפגום היה רצסיבי, כי חלבון שבור פשוט לא עובד ועותק אחד תקין כיסה.\n\nכאן החלבון הפגום **מפריע באופן פעיל** — הוא לא סתם חסר. ולכן עותק תקין אחד לא מספיק כדי לתקן את הנזק, והמחלה מופיעה."}]},{"id":"d1-concept-signs","type":"concept","term":"ארבעת סימני הזיהוי","text":"אלה הסימנים שמזהים אוטוזומלי דומיננטי באילן יוחסין. תזכור אותם — הם התשובה לחצי משאלות הפרק:","rows":[["1","**חולים בכל דור** — המחלה לא מדלגת"],["2","לכל חולה יש **לפחות הורה אחד חולה**"],["3","**גברים ונשים באותה שכיחות** — הגן אוטוזומלי"],["4","הורה חולה הטרוזיגוט → **50%** לכל ילד"]],"note":"סימן 2 הוא החזק ביותר. אם מצאת חולה שלשני הוריו בריאים — או שזו לא הורשה דומיננטית, או שקרתה מוטציה חדשה."},{"id":"d1-mcq-risk","type":"mcq","q":"אב חולה במחלה אוטוזומלית דומיננטית (הטרוזיגוט) ואם בריאה. מה הסיכון לכל ילד?","options":["25%","50%","75%","100%"],"correct":1,"why":["25% שייך להורשה רצסיבית משני נשאים.","נכון. Aa × aa — האב נותן A או a בסיכוי שווה, והאם נותנת a תמיד. **חצי מהילדים יקבלו A ויהיו חולים.**","75% מתקבל כששני ההורים הטרוזיגוטים חולים.","100% היה נכון אילו האב היה הומוזיגוט חולה (AA)."]},{"id":"d1-concept-denovo","type":"concept","term":"מוטציית דה-נובו: החריג שמסביר את עצמו","text":"לפעמים נולד ילד חולה לשני הורים בריאים לגמרי, במחלה דומיננטית מובהקת. זה נראה כמו סתירה — אבל יש הסבר.\n\n**מוטציה חדשה** (de novo) התרחשה בתא המין של אחד ההורים.","note":"אם המוטציה קרתה בתא **סומטי** רגיל, היא לא תעבור לילדים ולרוב לא תעשה דבר. אבל אם קרתה ב**תא מין** — כל תאי העובר שיתפתח ממנו יישאו אותה, והוא יהיה חולה לכל דבר. **ומכאן והלאה הוא יעביר את המחלה הלאה כ
